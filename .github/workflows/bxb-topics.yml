# BxB 公告监听与归档流水线
# 注意：schedule 触发只认默认分支(main)上的 workflow 文件，
#       本文件须提交到 main；归档数据在 topics 分支，job 内 checkout。
name: bxb-topics-crawler

on:
  schedule:
    - cron: '5 * * * *'          # 每小时基线（整点后 5 分钟）
    - cron: '20,35,50 * * * *'   # 加密轮询（仅检测到更新后的 5h 窗口内生效）
    - cron: '5 7 * * *'          # 每日安全网滑窗 = 16:05 JST
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto（按 RSS 判定）或 window（强制滑窗重爬最近 40 条）'
        default: 'auto'
        type: choice
        options: [auto, window]

permissions:
  contents: write
  issues: write

concurrency:
  group: bxb-topics-crawler
  cancel-in-progress: false

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.poll.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: topics
          filter: 'blob:none'
          sparse-checkout: |
            scripts
            state
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - id: poll
        run: >
          python scripts/poll.py --check
          --schedule "${{ github.event.schedule }}"
          --dispatch "${{ inputs.mode == 'window' && 'window' || '' }}"

  crawl:
    needs: check
    if: needs.check.outputs.mode != 'none'
    runs-on: ubuntu-latest
    env:
      R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
    steps:
      - name: Preflight config check
        env:
          KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          KEY_SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          BUCKET: ${{ vars.R2_BUCKET }}
          PUB_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        run: |
          fail=0
          [ -n "$KEY_ID" ]     || { echo "::error::Secret R2_ACCESS_KEY_ID 未设置"; fail=1; }
          [ -n "$KEY_SECRET" ] || { echo "::error::Secret R2_SECRET_ACCESS_KEY 未设置"; fail=1; }
          [ -n "$ENDPOINT" ]   || { echo "::error::Secret R2_ENDPOINT 未设置"; fail=1; }
          [ -n "$BUCKET" ]     || { echo "::error::Variable R2_BUCKET 未设置（注意在 Variables 标签页，不是 Secrets）"; fail=1; }
          [ -n "$PUB_URL" ]    || { echo "::error::Variable R2_PUBLIC_BASE_URL 未设置（缺失会导致页面无 R2 回退链接）"; fail=1; }
          exit $fail

      - uses: actions/checkout@v4
        with:
          ref: topics
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Crawl
        run: python scripts/poll.py --execute --mode "${{ needs.check.outputs.mode }}"
      - name: Build Topics.html
        run: python scripts/build_topics.py
      - name: Fix comic links
        run: python scripts/comic.py

      - name: Upload new assets to R2
        if: ${{ hashFiles('r2-staging/**') != '' }}
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q rclone
          rclone version
          rclone copy r2-staging "R2:${{ vars.R2_BUCKET }}" --transfers 8 --s3-no-check-bucket -v --stats-one-line
          # 上传成功后才记入 manifest（失败则下轮重试）
          (cd r2-staging && find . -type f | sed 's|^\./||') >> state/r2_manifest.txt
          sort -u -o state/r2_manifest.txt state/r2_manifest.txt

      - name: Commit & push
        run: |
          git config user.name "bxb-archive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "archive: $(date -u +%FT%TZ)"
            git pull --rebase origin topics || true
            git push origin topics
          fi

      - name: Open issues for changes (email via Watch)
        uses: actions/github-script@v7
        env:
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('state/changes.json')) return;
            const data = JSON.parse(fs.readFileSync('state/changes.json', 'utf8'));
            const base = (process.env.PAGES_BASE_URL || '').replace(/\/$/, '');
            for (const c of data.changes) {
              const prefix = c.type === 'new' ? '[新公告]' : '[修改]';
              const mirror = base ? `${base}/${c.mirror}` : c.mirror;
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `${prefix} ${c.title}`,
                body: [
                  `- 时间 (JST): ${c.ts}`,
                  `- 官网: ${c.url_official}`,
                  `- 镜像: ${mirror}`,
                ].join('\n'),
              });
            }

  # 图床先行探测: event/campaign/gacha 的 title 图常先于公告上线。
  # 每次触发都跑(加密轮询 :20/:35/:50 跳过)，独立于 RSS 变更；needs crawl 串在其后避免并发推送竞态。
  probe:
    needs: crawl
    if: ${{ always() && github.event.schedule != '20,35,50 * * * *' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: topics
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Probe asset frontier
        run: python scripts/probe_assets.py

      - name: Commit probe state
        run: |
          git config user.name "bxb-archive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/asset_probe.json
          if git diff --cached --quiet; then
            echo "probe state 无变化"
          else
            git commit -m "probe: asset frontier $(date -u +%FT%TZ)"
            git pull --rebase origin topics || true
            git push origin topics
          fi

      - name: Open issues for asset hits (email via Watch)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('state/probe_hits.json')) return;
            const data = JSON.parse(fs.readFileSync('state/probe_hits.json', 'utf8'));
            for (const h of (data.hits || [])) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[图床先行] ${h.category} id=${h.id} 资源已上线`,
                body: [
                  `检测到 **${h.category}** id \`${h.id}\` 的 title 图已上传图床，公告可能尚未发布。`,
                  ``,
                  `- 图: ${h.url}`,
                  `- 序列: ${h.sequence}`,
                  `- 探测时间 (JST): ${h.ts}`,
                ].join('\n'),
              });
            }
