# BxB 公告监听与归档流水线
# 注意：schedule 触发只认默认分支(main)上的 workflow 文件，
#       本文件须提交到 main；归档数据在 topics 分支，job 内 checkout。
name: bxb-topics-crawler

on:
  # 定时触发由 Cloudflare Worker 调 workflow_dispatch:每小时 mode=auto + 每日 mode=window。
  # GitHub schedule 已移除(高峰丢跑)。加密轮询(5h 窗口每 15min)随之取消 —
  # 二次编辑会被下一次每小时 auto 轮询补上。
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto（按 RSS 判定）或 window（强制滑窗重爬最近 40 条）'
        default: 'auto'
        type: choice
        options: [auto, window]

permissions:
  contents: write

concurrency:
  group: bxb-topics-crawler
  cancel-in-progress: false

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.poll.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: topics
          filter: 'blob:none'
          sparse-checkout: |
            scripts
            state
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch WARP pool from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          B="s3://${{ vars.R2_ACCOUNTS_BUCKET }}"; E="${{ secrets.R2_ENDPOINT }}"
          aws s3 cp "$B/routines/daily/warp_pool.py" scripts/warp_pool.py --endpoint-url "$E" || true
          mkdir -p bin warp_pool
          aws s3 cp "$B/routines/bin/wireproxy" bin/wireproxy --endpoint-url "$E" && chmod +x bin/wireproxy || true
          aws s3 cp "$B/warp/" warp_pool/ --recursive --endpoint-url "$E" || true
          echo "warp pool: $(ls warp_pool/*.conf 2>/dev/null | wc -l) configs"
      - id: poll
        env:
          BXB_WARP_POOL_DIR: warp_pool
          BXB_WIREPROXY_BIN: bin/wireproxy
          BXB_WARP_BURNED: warp_burned.txt
        run: >
          python scripts/poll.py --check
          --dispatch "${{ inputs.mode == 'window' && 'window' || '' }}"
      - name: Delete burned WARP configs from R2
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          if [ -s warp_burned.txt ]; then
            B="s3://${{ vars.R2_ACCOUNTS_BUCKET }}"; E="${{ secrets.R2_ENDPOINT }}"
            while read -r f; do
              [ -n "$f" ] && aws s3 rm "$B/warp/$f" --endpoint-url "$E" || true
            done < warp_burned.txt
          fi

  crawl:
    needs: check
    if: needs.check.outputs.mode != 'none'
    runs-on: ubuntu-latest
    env:
      R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
    steps:
      - name: Preflight config check
        env:
          KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          KEY_SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          BUCKET: ${{ vars.R2_BUCKET }}
          PUB_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        run: |
          fail=0
          [ -n "$KEY_ID" ]     || { echo "::error::Secret R2_ACCESS_KEY_ID 未设置"; fail=1; }
          [ -n "$KEY_SECRET" ] || { echo "::error::Secret R2_SECRET_ACCESS_KEY 未设置"; fail=1; }
          [ -n "$ENDPOINT" ]   || { echo "::error::Secret R2_ENDPOINT 未设置"; fail=1; }
          [ -n "$BUCKET" ]     || { echo "::error::Variable R2_BUCKET 未设置（注意在 Variables 标签页，不是 Secrets）"; fail=1; }
          [ -n "$PUB_URL" ]    || { echo "::error::Variable R2_PUBLIC_BASE_URL 未设置（缺失会导致页面无 R2 回退链接）"; fail=1; }
          exit $fail

      - uses: actions/checkout@v7
        with:
          ref: topics
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Fetch WARP pool from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          B="s3://${{ vars.R2_ACCOUNTS_BUCKET }}"; E="${{ secrets.R2_ENDPOINT }}"
          aws s3 cp "$B/routines/daily/warp_pool.py" scripts/warp_pool.py --endpoint-url "$E" || true
          mkdir -p bin warp_pool
          aws s3 cp "$B/routines/bin/wireproxy" bin/wireproxy --endpoint-url "$E" && chmod +x bin/wireproxy || true
          aws s3 cp "$B/warp/" warp_pool/ --recursive --endpoint-url "$E" || true
          echo "warp pool: $(ls warp_pool/*.conf 2>/dev/null | wc -l) configs"
      - name: Crawl
        env:
          BXB_WARP_POOL_DIR: warp_pool
          BXB_WIREPROXY_BIN: bin/wireproxy
          BXB_WARP_BURNED: warp_burned.txt
        run: python scripts/poll.py --execute --mode "${{ needs.check.outputs.mode }}"
      - name: Delete burned WARP configs from R2
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          if [ -s warp_burned.txt ]; then
            B="s3://${{ vars.R2_ACCOUNTS_BUCKET }}"; E="${{ secrets.R2_ENDPOINT }}"
            while read -r f; do
              [ -n "$f" ] && aws s3 rm "$B/warp/$f" --endpoint-url "$E" || true
            done < warp_burned.txt
          fi
      - name: Build Topics.html
        run: python scripts/build_topics.py
      - name: Fix comic links
        run: python scripts/comic.py

      - name: Upload new assets to R2
        if: ${{ hashFiles('r2-staging/**') != '' }}
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q rclone
          rclone version
          rclone copy r2-staging "R2:${{ vars.R2_BUCKET }}" --transfers 8 --s3-no-check-bucket -v --stats-one-line
          # 上传成功后才记入 manifest（失败则下轮重试）
          (cd r2-staging && find . -type f | sed 's|^\./||') >> state/r2_manifest.txt
          sort -u -o state/r2_manifest.txt state/r2_manifest.txt

      - name: Commit & push
        run: |
          git config user.name "bxb-archive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "archive: $(date -u +%FT%TZ)"
            git pull --rebase origin topics || true
            git push origin topics
          fi

      - name: Notify Telegram (公告变更)
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const { TG_TOKEN, TG_CHAT } = process.env;
            if (!TG_TOKEN || !TG_CHAT) { core.info('未配置 TELEGRAM secret、跳过通知'); return; }
            if (!fs.existsSync('state/changes.json')) return;
            const data = JSON.parse(fs.readFileSync('state/changes.json', 'utf8'));
            const slugTag = (slug) => {
              if (!slug) return '#topic';
              const map = [['event_', '#event'], ['c_', '#campaign'], ['g_', '#gacha'],
                ['info_4koma', '#info_4koma'], ['info_kaini', '#info_kaini'], ['balance_', '#balance'],
                ['yokoku_', '#yokoku'], ['loginbonus', '#loginbonus'], ['update_', '#update'],
                ['medal_', '#medal_shop'], ['guildbattle', '#guildbattle'], ['ridy_room', '#ridy_room'],
                ['advance_diapack', '#diapack'], ['advance_', '#diapack']];
              for (const [pre, tag] of map) if (slug.startsWith(pre)) return tag;
              const keep = [];  // 兜底:取到第一个数字/Camel 段前的前缀
              for (const p of slug.split('_')) { if (/^\d/.test(p) || /^[A-Z]/.test(p)) break; keep.push(p); }
              return '#' + (keep.join('_') || 'topic');
            };
            let sent = 0;
            for (const c of (data.changes || [])) {
              const prefix = c.type === 'new' ? '🆕 [新公告]' : '✏️ [修改]';
              let text = `${prefix} ${c.title}\n${c.url_official}`;
              if (c.edit_note) text += `\n\n📝 ${c.edit_note.slice(0, 800)}`;  // 修改的「追記」文字
              text += `\n\n${slugTag(c.slug)}`;  // hashtag 永远在最下方
              const r = await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: TG_CHAT, text }),
              });
              const j = await r.json();
              if (!j.ok) core.warning(`telegram sendMessage 失败 (${c.title}): ${j.description}`);
              else sent++;
            }
            // 频道帖会被自动转发进关联讨论群并置顶 → 排空 is_automatic_forward 的置顶(保留手动置顶)
            if (sent) {
              const tgApi = (m, b) => fetch(`https://api.telegram.org/bot${TG_TOKEN}/${m}`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b),
              }).then(r => r.json());
              const gc = await tgApi('getChat', { chat_id: TG_CHAT });
              const grp = gc.ok && gc.result.linked_chat_id;
              if (grp) {
                const sleep = ms => new Promise(r => setTimeout(r, ms));
                for (let i = 0, quiet = 0; i < 15 && quiet < 3; i++) {
                  await sleep(2000);
                  const g = await tgApi('getChat', { chat_id: grp });
                  const pm = g.ok && g.result.pinned_message;
                  if (pm && pm.is_automatic_forward) {
                    await tgApi('unpinChatMessage', { chat_id: grp, message_id: pm.message_id });
                    quiet = 0;
                  } else { quiet++; }
                }
              }
            }

  # 图床先行探测: event/campaign/gacha 的 title 图常先于公告上线。
  # 每次触发都跑(Worker 每小时 auto + 每日 window)，独立于 RSS 变更；needs crawl 串在其后避免并发推送竞态。
  probe:
    needs: crawl
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: topics
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Probe asset frontier
        run: python scripts/probe_assets.py

      - name: Commit probe state
        run: |
          git config user.name "bxb-archive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/asset_probe.json
          if git diff --cached --quiet; then
            echo "probe state 无变化"
          else
            git commit -m "probe: asset frontier $(date -u +%FT%TZ)"
            git pull --rebase origin topics || true
            git push origin topics
          fi

      - name: Notify Telegram (图床先行,发全部图)
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const { TG_TOKEN, TG_CHAT } = process.env;
            if (!TG_TOKEN || !TG_CHAT) { core.info('未配置 TELEGRAM secret、跳过通知'); return; }
            if (!fs.existsSync('state/probe_hits.json')) return;
            const data = JSON.parse(fs.readFileSync('state/probe_hits.json', 'utf8'));
            const api = (m, body) => fetch(`https://api.telegram.org/bot${TG_TOKEN}/${m}`, {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
            }).then(r => r.json());
            let sent = 0;
            for (const h of (data.hits || [])) {
              const imgs = (h.images && h.images.length) ? h.images : (h.url ? [h.url] : []);
              if (!imgs.length) continue;
              const catTag = { gacha: '#gacha', events: '#event', campaign: '#campaign' }[h.category] || '';
              const caption = `🔔 [图床先行] ${h.category} id=${h.id}（${imgs.length} 图）\ntitle 图已上图床、公告可能尚未发布。\n#preview ${catTag}`.trim();
              // sendMediaGroup 相册,每组最多 10 张;caption 放第一组第一张
              let first = true;
              for (let k = 0; k < imgs.length; k += 10) {
                const group = imgs.slice(k, k + 10).map((u, idx) => {
                  const m = { type: 'photo', media: u };
                  if (first && idx === 0) m.caption = caption;
                  return m;
                });
                const j = await api('sendMediaGroup', { chat_id: TG_CHAT, media: group });
                if (!j.ok) core.warning(`sendMediaGroup 失败 id=${h.id}: ${j.description}`);
                else sent++;
                first = false;
              }
            }
            // 频道帖会被自动转发进关联讨论群并置顶 → 排空 is_automatic_forward 的置顶(保留手动置顶)
            if (sent) {
              const gc = await api('getChat', { chat_id: TG_CHAT });
              const grp = gc.ok && gc.result.linked_chat_id;
              if (grp) {
                const sleep = ms => new Promise(r => setTimeout(r, ms));
                for (let i = 0, quiet = 0; i < 15 && quiet < 3; i++) {
                  await sleep(2000);
                  const g = await api('getChat', { chat_id: grp });
                  const pm = g.ok && g.result.pinned_message;
                  if (pm && pm.is_automatic_forward) {
                    await api('unpinChatMessage', { chat_id: grp, message_id: pm.message_id });
                    quiet = 0;
                  } else { quiet++; }
                }
              }
            }
