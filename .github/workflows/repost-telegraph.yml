name: repost-telegraph

# 手动重发某个 asset_version 的 Telegraph 图册。
# 用途: extract_assets 合成逻辑更新后,用存着的 TELEGRAPH_TOKEN 重新生成历史页面的合并图。
# 页已在 telegraph_index → editPage 原地更新 (URL 不变、不重发频道);不在则新建。
# 留空 asset_version = 最新版。

on:
  workflow_dispatch:
    inputs:
      asset_version:
        description: 'asset_version 号 (如 12491);留空 = 最新版'
        required: false
        default: ''

concurrency:
  group: repost-telegraph
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  repost:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout data/master-tables (asset_version 快照 + telegraph_index)
        uses: actions/checkout@v4
        with:
          ref: data/master-tables
          path: _mt
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r scripts/ci/requirements.txt

      - name: Repost asset_version 图册 (合成图 + editPage 原地更新)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAPH_TOKEN: ${{ secrets.TELEGRAPH_TOKEN }}
          BXB_MASTER_TABLES: ${{ github.workspace }}/_mt
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        run: python scripts/ci/notify.py asset_version "${{ github.event.inputs.asset_version }}"

      - name: Configure git
        run: |
          git config --global user.name "bxb-db-bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # telegraph_index 若新建了页 (原地 editPage 不变 path、无需提交;新建才有变更) → 回写
      - name: Commit telegraph index (若有变更)
        working-directory: _mt
        continue-on-error: true
        run: |
          git add state/telegraph_index.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "telegraph index 无变更"; exit 0; fi
          git commit -m "data(master-tables): telegraph index repost $(date -u +%FT%TZ)"
          git pull --rebase origin data/master-tables || true
          git push origin HEAD:data/master-tables
