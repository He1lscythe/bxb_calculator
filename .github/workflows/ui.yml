name: ui-smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Fetch revise data from data-staging
        # *_revise.json 在 .gitignore 内 (main 不 commit、走 data-staging 单向积累)
        # CI 跑 UI test 需 revise 数据 (deepApply 注入 max_value/tags/acquisition)、从 data-staging checkout
        run: |
          git fetch origin data-staging
          git checkout origin/data-staging -- \
            data/chara_revise.json \
            data/soul_revise.json \
            data/crystal_revise.json \
            data/masou_revise.json \
            data/bg_revise.json

      - name: Run UI smoke tests
        run: npm run test:ui

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7
