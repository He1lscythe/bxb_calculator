name: sync-main-to-staging

# main push 后自动 merge 进 data-staging、触发 GitHub Pages 重新部署
# 2026-06-09 单 worktree 架构: main = 框架 + 数据集 (icons/omoide/master JSON)、
# data-staging = main + 5 *_revise.json (Vercel PR target、user edit 流入)
# workflow_run: update-database 用 GITHUB_TOKEN push main 不触发 push 事件 (防递归)、
# 完事后由此触发补 sync;workflow_dispatch 手动兜底

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [update-database]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: sync-main-to-staging
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: data-staging
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge origin/main into data-staging
        run: |
          git fetch origin main
          git merge origin/main --no-edit
          for i in 1 2 3 4 5; do
            if git push origin data-staging; then exit 0; fi
            echo "::warning::push 被拒 (第 $i 次)、取远端后重试"
            sleep $((i * 5))
            git fetch origin data-staging
            git merge origin/data-staging --no-edit || exit 1
          done
          echo "::error::data-staging 连续 5 次被抢先、放弃 (手动 Run workflow 重试)"
          exit 1
