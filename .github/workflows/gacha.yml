name: bxb-gacha

on:
  workflow_dispatch:
    inputs:
      gacha_schedule_id:
        required: true
      mode:
        required: true
        type: choice
        options: ["single", "sequential"]
      count:
        required: true
        default: "1"
      shards:
        required: false
        default: ""
      total_rate:
        required: false
        default: ""

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      shards: ${{ steps.gen.outputs.shards }}
      total_rate: ${{ steps.gen.outputs.total_rate }}
    steps:
      - id: gen
        run: |
          N="${{ inputs.shards }}"; N="${N:-${{ vars.BXB_RUN_SHARDS }}}"; N="${N:-16}"
          TR="${{ inputs.total_rate }}"; TR="${TR:-${{ vars.BXB_RUN_TOTAL_RATE }}}"; TR="${TR:-8}"
          echo "shards=$N"      >> "$GITHUB_OUTPUT"
          echo "total_rate=$TR" >> "$GITHUB_OUTPUT"
          echo "matrix=[$(seq -s, 0 $((N-1)))]" >> "$GITHUB_OUTPUT"

  run:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch routines code from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 cp "s3://${{ vars.R2_ACCOUNTS_BUCKET }}/routines/" . --recursive \
            --endpoint-url "${{ secrets.R2_ENDPOINT }}" \
            --exclude ".git/*" --exclude "scripts/_boot.py" \
            --exclude "data/*" --exclude "outputs/*" \
            --exclude "*.pyc" --exclude "*/__pycache__/*"
      - run: pip install -r requirements-daily.txt
      - name: Fetch accounts from R2 (private)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: >
          aws s3 cp "s3://${{ vars.R2_ACCOUNTS_BUCKET }}/accounts/yuu/accounts.csv" accounts.csv
          --endpoint-url "${{ secrets.R2_ENDPOINT }}"
      - name: Stagger start (shard×60s + 随机 0-15s)
        run: |
          sleep $(( ${{ matrix.shard }} * 60 ))
          sleep $(( RANDOM % 16 ))
      - name: Run gacha shard
        env:
          PYTHONUNBUFFERED: "1"
          BXB_BOOTSTRAP_KEY: ${{ secrets.BXB_BOOTSTRAP_KEY }}
          BXB_APP_VERSION: ${{ vars.BXB_APP_VERSION }}
          BXB_UNITY_VERSION: ${{ vars.BXB_UNITY_VERSION }}
        run: |
          N="${{ needs.prepare.outputs.shards }}"
          TR="${{ needs.prepare.outputs.total_rate }}"
          CONC="${{ vars.BXB_RUN_CONCURRENCY }}"; CONC="${CONC:-8}"
          python -m daily.gacha \
            --gacha-schedule-id ${{ inputs.gacha_schedule_id }} \
            --mode ${{ inputs.mode }} \
            --count ${{ inputs.count }} \
            --shard ${{ matrix.shard }}/$N \
            --accounts-file accounts.csv \
            --concurrency "$CONC" --rate 3.0 --total-rate "$TR" \
            --out "results-${{ matrix.shard }}.csv" > "shard-${{ matrix.shard }}.log" 2>&1
      - name: Upload results + log to R2 (private)
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
        run: |
          B="s3://${{ vars.R2_ACCOUNTS_BUCKET }}"; E="${{ secrets.R2_ENDPOINT }}"
          JST=$(TZ=Asia/Tokyo date +%F)
          [ -f "results-${{ matrix.shard }}.csv" ] && aws s3 cp "results-${{ matrix.shard }}.csv" "$B/results/gacha/shard-${{ matrix.shard }}.csv" --endpoint-url "$E" || true
          aws s3 cp "shard-${{ matrix.shard }}.log" "$B/logs/${JST}/gacha-shard${{ matrix.shard }}.log" --endpoint-url "$E" || true

  aggregate:
    needs: run
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch routines code from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 cp "s3://${{ vars.R2_ACCOUNTS_BUCKET }}/routines/" . --recursive \
            --endpoint-url "${{ secrets.R2_ENDPOINT }}" \
            --exclude ".git/*" --exclude "scripts/_boot.py" \
            --exclude "data/*" --exclude "outputs/*" \
            --exclude "*.pyc" --exclude "*/__pycache__/*"
      - name: Fetch base accounts.csv + gacha results from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
        run: |
          B="s3://${{ vars.R2_ACCOUNTS_BUCKET }}"; E="${{ secrets.R2_ENDPOINT }}"
          aws s3 cp "$B/accounts/yuu/accounts.csv" accounts.csv --endpoint-url "$E"
          mkdir -p merged_results
          aws s3 cp "$B/results/gacha/" merged_results/ --recursive --endpoint-url "$E" || true
      - name: Merge rarity4 (union) + diamond (replace) into accounts.csv
        run: |
          python -m daily.writeback --base accounts.csv --results-dir merged_results \
            --out accounts.tmp.csv --min-rows 1 \
            --results-col rarity4 --base-col rarity4_base_ids --mode union --sep " "
          python -m daily.writeback --base accounts.tmp.csv --results-dir merged_results \
            --out accounts.new.csv --min-rows 1 \
            --results-col diamond --base-col diamond --mode replace
      - name: Backup + write back accounts.csv, then delete gacha results from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
        run: |
          B="s3://${{ vars.R2_ACCOUNTS_BUCKET }}"; E="${{ secrets.R2_ENDPOINT }}"
          JST_DATE=$(TZ=Asia/Tokyo date +%Y%m%d)
          aws s3 cp accounts.csv "$B/accounts/yuu/accounts-${JST_DATE}-gacha.csv" --endpoint-url "$E"
          aws s3 cp accounts.new.csv "$B/accounts/yuu/accounts.csv" --endpoint-url "$E"
          aws s3 rm "$B/results/gacha/" --recursive --endpoint-url "$E" || true

  cleanup-old-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete previous gacha runs (keep current)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "/repos/${{ github.repository }}/actions/workflows/gacha.yml/runs?per_page=100" \
            --jq '.workflow_runs[].id' | while read -r id; do
              [ "$id" = "${{ github.run_id }}" ] && continue
              echo "delete run $id"
              gh api -X DELETE "/repos/${{ github.repository }}/actions/runs/$id" || true
            done
