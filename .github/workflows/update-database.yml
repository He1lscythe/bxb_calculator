name: update-database

on:
  workflow_dispatch:

concurrency:
  group: update-database
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout data/master-tables
        uses: actions/checkout@v7
        with:
          ref: data/master-tables
          path: _mt
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout data-staging
        uses: actions/checkout@v7
        with:
          ref: data-staging
          path: _ds
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch 现版 revise from data-staging
        run: |
          git fetch origin data-staging
          git checkout origin/data-staging -- \
            data/crystal_revise.json data/bg_revise.json data/masou_revise.json || \
            echo "WARN: data-staging revise 取失败、用空基准"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r scripts/ci/requirements.txt

      - name: Pull from R2
        run: |
          B="s3://${{ vars.R2_DATA_BUCKET }}/pipeline"; E="${{ secrets.R2_ENDPOINT }}"
          aws s3 cp "$B/mt/" _mt/ --recursive --endpoint-url "$E" --only-show-errors
          aws s3 cp "$B/wiki/_npc_motions.json" "$RUNNER_TEMP/npc_motions.json" --endpoint-url "$E" --only-show-errors || true
          mkdir -p "$RUNNER_TEMP/assets"
          aws s3 cp "$B/wiki/assets/" "$RUNNER_TEMP/assets/" --recursive --endpoint-url "$E" --only-show-errors || true
          echo "新图标源: $(find "$RUNNER_TEMP/assets" -type f | wc -l)"
          git -C _mt status --short | head -50

      - name: Run ingest
        id: run
        env:
          BXB_MASTER_TABLES: ${{ github.workspace }}/_mt
          BXB_NPC_MOTIONS_IN: ${{ runner.temp }}/npc_motions.json
          BXB_ASSETS_DIR: ${{ runner.temp }}/assets
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set +e
          python scripts/ci/run_ingest.py
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "::error::run_ingest 失败 (rc=$rc)"
            exit "$rc"
          fi

      - name: Load summary
        id: sum
        run: |
          F="${{ runner.temp }}/ci_update_summary.json"
          echo "revise_safe=$(jq -r '.revise_safe // false' "$F")" >> "$GITHUB_OUTPUT"
          echo "revise_changed=$(jq -r '(.revise_changed // []) | length' "$F")" >> "$GITHUB_OUTPUT"

      - name: Configure git
        run: |
          git config --global user.name "bxb-db-bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit data/master-tables
        working-directory: _mt
        run: |
          git add -A
          if git diff --cached --quiet; then echo "master-tables 无变更"; exit 0; fi
          git commit -m "data(master-tables): sync $(date -u +%FT%TZ)"
          git pull --rebase origin data/master-tables || true
          git push origin HEAD:data/master-tables

      - name: Commit main (data + npc_motions + icons)
        run: |
          git add data/characters.json data/souls.json data/crystals.json \
                  data/bladegraphs.json data/masou.json data/senzai_table.json \
                  data/_npc_motions.json icons/ 2>/dev/null || true
          git reset -q HEAD data/crystal_revise.json data/bg_revise.json data/masou_revise.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "data/icons 无变更"; exit 0
          fi
          git commit -m "data: master_data auto-update $(date -u +%FT%TZ)"
          git pull --rebase origin main || true
          git push origin HEAD:main

      - name: Commit data-staging (revise)
        if: steps.sum.outputs.revise_safe == 'true' && steps.sum.outputs.revise_changed != '0'
        working-directory: _ds
        run: |
          cp ../data/crystal_revise.json ../data/bg_revise.json ../data/masou_revise.json data/
          git add data/crystal_revise.json data/bg_revise.json data/masou_revise.json
          if git diff --cached --quiet; then echo "revise 无变更"; exit 0; fi
          git commit -m "data(revise): 入手方法/max_value/range refresh $(date -u +%FT%TZ)"
          git pull --rebase origin data-staging || true
          git push origin HEAD:data-staging

      - name: Publish icons index + npc_motions to R2
        run: |
          B="s3://${{ vars.R2_DATA_BUCKET }}/pipeline"; E="${{ secrets.R2_ENDPOINT }}"
          (cd icons && find . -type f -name '*.png' | sed 's|^\./||' | LC_ALL=C sort) > "$RUNNER_TEMP/icons_index.txt"
          aws s3 cp "$RUNNER_TEMP/icons_index.txt" "$B/wiki/icons_index.txt" --endpoint-url "$E" --only-show-errors
          aws s3 cp data/_npc_motions.json "$B/wiki/_npc_motions.json" --endpoint-url "$E" --only-show-errors
          (cd "$RUNNER_TEMP/assets" && find . -type f | sed 's|^\./||') | while read -r f; do
            aws s3 rm "$B/wiki/assets/$f" --endpoint-url "$E" --only-show-errors || true
          done

      - name: Revise 安全检查未过 → 告警
        if: steps.sum.outputs.revise_safe == 'false'
        run: |
          echo "::error::revise 字段级安全检查未通过 (有条目/字段丢失) — 已跳过 revise 提交,需人工查 build_crystals merge"
          exit 1
