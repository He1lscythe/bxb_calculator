name: pages-retry

# pages-build-deployment (branch 部署的 dynamic workflow) 的 deploy 偶发
# "Deployment failed, try again later" — GitHub 后端 syncing_files 阶段 transient、
# build/artifact 本身没问题、re-run 必过 (2026-07-03/04 实证: attempt 2-3 成功)。
# dynamic workflow 内容不可改、无法内置 retry → 这里监听失败自动 re-run (最多到 attempt 3)。

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: Re-run failed pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "run ${{ github.event.workflow_run.id }} attempt ${{ github.event.workflow_run.run_attempt }} failed — re-running"
          sleep 60
          gh api -X POST "/repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/rerun-failed-jobs"
