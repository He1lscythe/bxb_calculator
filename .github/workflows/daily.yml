name: bxb-daily-tasks

on:
  workflow_dispatch:
    inputs:
      time_point:
        description: "时间点代称 1-4 (JST 00:29 / 05:29 / 10:29 / 17:29)"
        required: true
        type: choice
        options: ["1", "2", "3", "4"]
      shards:
        description: "分片数 N(并行 job 数,各跑 1/N 账号、各自独立 IP)"
        required: false
        default: "12"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        run: |
          N=${{ inputs.shards }}
          echo "matrix=[$(seq -s, 0 $((N-1)))]" >> "$GITHUB_OUTPUT"

  run:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: routines
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-daily.txt
      - name: Fetch accounts from R2 (private)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: >
          aws s3 cp "s3://${{ vars.R2_ACCOUNTS_BUCKET }}/accounts.csv" accounts.csv
          --endpoint-url "${{ secrets.R2_ENDPOINT }}"
      - name: Stagger start (sleep shard×60s)
        run: sleep $(( ${{ matrix.shard }} * 60 ))
      - name: Run shard
        env:
          PYTHONUNBUFFERED: "1"
          BXB_BOOTSTRAP_KEY: ${{ secrets.BXB_BOOTSTRAP_KEY }}
        run: |
          set -o pipefail
          python -m daily \
            --time-point ${{ inputs.time_point }} \
            --shard ${{ matrix.shard }}/${{ inputs.shards }} \
            --accounts-file accounts.csv \
            --concurrency 30 --rate 3.0 --total-rate 30.0 \
            --out "results-${{ matrix.shard }}.csv" 2>&1 | tee "shard-${{ matrix.shard }}.log"
      - name: Upload results + log to R2 (private)
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
        run: |
          B="s3://${{ vars.R2_ACCOUNTS_BUCKET }}"; E="${{ secrets.R2_ENDPOINT }}"
          JST=$(TZ=Asia/Tokyo date +%F)
          [ -f "results-${{ matrix.shard }}.csv" ] && aws s3 cp "results-${{ matrix.shard }}.csv" "$B/results/tp${{ inputs.time_point }}/shard-${{ matrix.shard }}.csv" --endpoint-url "$E" || true
          aws s3 cp "shard-${{ matrix.shard }}.log" "$B/logs/${JST}/tp${{ inputs.time_point }}-shard${{ matrix.shard }}.log" --endpoint-url "$E" || true

  aggregate:
    needs: run
    if: ${{ inputs.time_point == '1' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: routines
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch base accounts.csv + tp1 results from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
        run: |
          B="s3://${{ vars.R2_ACCOUNTS_BUCKET }}"; E="${{ secrets.R2_ENDPOINT }}"
          aws s3 cp "$B/accounts.csv" accounts.csv --endpoint-url "$E"
          mkdir -p merged_results
          aws s3 cp "$B/results/tp1/" merged_results/ --recursive --endpoint-url "$E"
      - name: Merge diamond into accounts.csv
        run: >
          python -m daily.writeback
          --base accounts.csv
          --results-dir merged_results
          --out accounts.new.csv
          --min-rows 1
      - name: Backup + write back accounts.csv, then delete tp1 results from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
        run: |
          B="s3://${{ vars.R2_ACCOUNTS_BUCKET }}"; E="${{ secrets.R2_ENDPOINT }}"
          JST_DATE=$(TZ=Asia/Tokyo date +%Y%m%d)
          aws s3 cp accounts.csv "$B/accounts-${JST_DATE}.csv" --endpoint-url "$E"
          aws s3 cp accounts.new.csv "$B/accounts.csv" --endpoint-url "$E"
          aws s3 rm "$B/results/tp1/" --recursive --endpoint-url "$E"

  cleanup-old-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete previous daily runs (keep current)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "/repos/${{ github.repository }}/actions/workflows/daily.yml/runs?per_page=100" \
            --jq '.workflow_runs[].id' | while read -r id; do
              [ "$id" = "${{ github.run_id }}" ] && continue
              echo "delete run $id"
              gh api -X DELETE "/repos/${{ github.repository }}/actions/runs/$id" || true
            done
