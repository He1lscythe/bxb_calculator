name: 通知发布

on:
  workflow_dispatch:
    inputs:
      md_date:
        description: 'master_data 文件夹名 (如 2026_07_08_16_00_00);留空 = 最新'
        required: false
        default: ''

concurrency:
  group: 通知发布
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  repost:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout master_tables
        uses: actions/checkout@v4
        with:
          ref: master_tables
          path: _mt
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r scripts/ci/requirements.txt

      - name: Resolve target + predecessor
        id: resolve
        run: |
          NEW="${{ github.event.inputs.md_date }}"
          cd _mt/master_data
          LIST=$(ls -d */ | tr -d / | grep -E '^[0-9]{4}_' | sort)
          [ -z "$NEW" ] && NEW=$(echo "$LIST" | tail -1)
          if ! echo "$LIST" | grep -qx "$NEW"; then echo "master_data/$NEW 不存在"; exit 1; fi
          OLD=$(echo "$LIST" | grep -x -B1 "$NEW" | head -1)
          if [ -z "$OLD" ] || [ "$OLD" = "$NEW" ]; then echo "$NEW 无前置快照"; exit 1; fi
          echo "OLD=$OLD" >> "$GITHUB_ENV"
          echo "NEW=$NEW" >> "$GITHUB_ENV"
          echo "regen: $OLD → $NEW"

      - name: Regenerate changelog.md
        run: |
          python scripts/ci/diff_master_tables.py "$OLD" "$NEW" \
            --root _mt/master_data --out "_mt/master_data/$NEW/changelog.md"

        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          : ${{ secrets. }}
          BXB_MASTER_TABLES: ${{ github.workspace }}/_mt
        run: python scripts/ci/notify.py master_data "$NEW"

      - name: Configure git
        run: |
          git config --global user.name "bxb-db-bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit changelog + 通知渠道 index (若有变更)
        working-directory: _mt
        continue-on-error: true
        run: |
          git add "master_data/$NEW/changelog.md" state/通知索引.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "无变更"; exit 0; fi
          git commit -m "data(master_tables): changelog regen $NEW $(date -u +%FT%TZ)"
          git pull --rebase origin master_tables || true
          git push origin HEAD:master_tables
