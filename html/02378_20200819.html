       <script type="text/javascript">
        var played = false;
    function audio_play(wid) {
        var w = document.getElementById("voice" + wid);
        if(played){
            w.pause();
            w.currentTime = 0;
            played = false;
            $("#voice_"+wid).removeClass("played");
        }
        else{
            w.play();
            played = true;
            $("#voice_"+wid).addClass("played");
        }
        w.addEventListener("ended", function(){
            w.currentTime = 0;
            played = false;
            $("#voice_"+wid).removeClass("played");
        }, false);
    }
       </script>
       <script type="text/javascript">
        var title_played = false;
    function audio_play_ridy(voice_id) {
        var w = document.getElementById("ridyvoice_" + voice_id);
        if(title_played){
            w.pause();
            w.currentTime = 0;
            title_played = false;
        }
        else{
            w.play();
            title_played = true;
        }
        w.addEventListener("ended", function(){
            w.currentTime = 0;
            title_played = false;
        }, false);
    }
       </script>
