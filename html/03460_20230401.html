       <script type="text/javascript">
        var played = false;

    function audio_play(wid) {
        var w = document.getElementById("voice" + wid);
        if (played) {
            w.pause();
            w.currentTime = 0;
            played = false;
            $("#voice_" + wid).removeClass("played");
        } else {
            w.play();
            played = true;
            $("#voice_" + wid).addClass("played");
        }
        w.addEventListener("ended", function () {
            w.currentTime = 0;
            played = false;
            $("#voice_" + wid).removeClass("played");
        }, false);
    }
       </script>
       <script type="text/javascript">
        var played = false;
    var played_id = "";

    function audio_play(wid, num) {
        var audio = document.getElementById("voice" + wid + "_" + num);
        if (played) {
            played = false;
            $(".played").removeClass("played");
            if (played_id == wid + "_" + num) {
                audio.pause();
                audio.currentTime = 0;
            } else {
                var played_audio = document.getElementById("voice" + played_id);
                played_audio.pause();
                played_audio.currentTime = 0;
                audio.play();
                played = true;
                played_id = wid + "_" + num;
                $("#voice_" + wid + "_" + num).addClass("played");
            }
        } else {
            audio.play();
            played = true;
            played_id = wid + "_" + num;
            $("#voice_" + wid + "_" + num).addClass("played");
        }
        audio.addEventListener("ended", function () {
            audio.currentTime = 0;
            played = false;
            $("#voice_" + wid + "_" + num).removeClass("played");
        }, false);
    }
       </script>
       <script type="text/javascript">
