  <script>
   $(function () {
        var topBtn = $("#pageTop");
        topBtn.hide();
        $(window).scroll(function () {
          if ($(this).scrollTop() > 80) {
            topBtn.fadeIn();
          } else {
            topBtn.fadeOut();
          }
        });
        topBtn.click(function () {
          $("body,html").animate({ scrollTop: 0 }, 500);
          return false;
        });
      });
  </script>
  <!-- 分页 & 搜索 脚本 -->
  <script>
   $(document).ready(function () {
        var perPage = 10;
        // 保存所有新闻项
        var $allItems = $(".news_container .news_heading");
        // 当前要显示的新闻项集合（支持搜索过滤）
        var filteredItems = $allItems;
        var totalItems = filteredItems.length;
        var totalPages = Math.ceil(totalItems / perPage);
        var currentPage = 1;

        function showPage(page) {
          if (page < 1 || page > totalPages) return;
          currentPage = page;
          $allItems.hide();
          filteredItems.slice((page - 1) * perPage, page * perPage).show();
          $("#pageIndicator").text("第 " + currentPage + " 页 / 共 " + totalPages + " 页");
        }

        $("#prevPage").click(function () {
          if (currentPage > 1) {
            showPage(currentPage - 1);
          }
        });

        $("#nextPage").click(function () {
          if (currentPage < totalPages) {
            showPage(currentPage + 1);
          }
        });

        $("#jumpButton").click(function () {
          var target = parseInt($("#jumpInput").val(), 10);
          if (!isNaN(target) && target >= 1 && target <= totalPages) {
            showPage(target);
          } else {
            alert("请输入 1 到 " + totalPages + " 之间的页码。");
          }
        });

        $("#searchButton").click(function () {
        var keywordInput = $("#searchInput").val().trim();
        if (keywordInput === "") {
            filteredItems = $allItems;
        } else {
            // 用空格分割关键词，忽略多个空格
            var keywords = keywordInput.split(/\s+/);
            
            filteredItems = $allItems.filter(function () {
            var text = $(this).find("a.title_text").text();
            // 只要匹配任意一个关键词，就返回 true
            return keywords.some(function (kw) {
                return text.indexOf(kw) !== -1;
            });
            });
        }
        totalItems = filteredItems.length;
        totalPages = Math.ceil(totalItems / perPage);
        currentPage = 1;
        showPage(currentPage);
        });

        $("#clearSearchButton").click(function () {
          $("#searchInput").val("");
          filteredItems = $allItems;
          totalItems = filteredItems.length;
          totalPages = Math.ceil(totalItems / perPage);
          currentPage = 1;
          showPage(currentPage);
        });

        // 初始显示第一页
        showPage(currentPage);

        // 现在把容器显示出来
        $(".news_container").css("visibility", "visible");
      });
  </script>
