    const TAGS_LABEL = { 1:'時止め', 2:'麻痺', 3:'強制BK', 4:'弱体解除', 5:'BDバフ', 6:'AOE', 7:'13倍',

      renderSpecFilters($('filters'), charaSpec, state, render);

      render();

    function render() {
      const filtered = applySpec(all, charaSpec, state);
      $('count').textContent = filtered.length;
      $('list').innerHTML = filtered.slice(0, 600).map(c => {
        const v0 = c.states?.['通常']?.variant_id || c.states?.['改造']?.variant_id;

            </div>
          </div>
        </div>`;
      }).join('') + (filtered.length > 600 ? `<p style="opacity:0.6;padding:6px">+${filtered.length-600} more</p>` : '');
      $('list').onclick = (e) => {
        const el = e.target.closest('.item');
        if (!el) return;
        selected = +el.dataset.id;
        const c = all.find(x => x.id === selected);
        currentState = Object.keys(c.states||{})[0] || null;
        renderDetail(c);
        render();
      };
    }

    function renderDetail(c) {
      if (!c) { $('detail').innerHTML = '<p style="opacity:0.6">魔剣を選択</p>'; return; }
      const v0 = c.states?.['通常']?.variant_id || c.states?.['改造']?.variant_id;

      const stateNames = Object.keys(c.states || {});
      const tabs = stateNames.map(s => `<div class="state-tab ${currentState===s?'active':''}" data-st="${s}">${s}</div>`).join('');

      // BD card
      const bd = c.bd_skill;
      const bdEffects = bd ? (bd.effects||[]).map(e => `<li>${e.parameter} / ${e.math_type} / ${e.value}${e.duration_value?` · ${e.duration_value}s`:''}</li>`).join('') : '';
      const bdH = bd?.name ? `<div class="bd-card">

      // profile
      const p = c.profile || {};
      const profileH = `<h3>プロフィール</h3>
        <dl class="profile-grid">
          <dt>年齢</dt><dd>${p.age||'-'}</dd>
          <dt>身長</dt><dd>${p.height||'-'}</dd>

          <dt>B/W/H</dt><dd>${p.three_size_b||'-'}/${p.three_size_w||'-'}/${p.three_size_h||'-'}</dd>

          ${p.like ? `<dt>好き</dt><dd>${p.like}</dd>` : ''}

        ${p.flavor_text ? `<p class="profile-text"><em>${p.flavor_text}</em></p>` : ''}
        ${p.intro ? `<details><summary>自己紹介</summary><p class="profile-text">${p.intro}</p></details>` : ''}
        ${p.description ? `<details><summary>魔剣説明</summary><p class="profile-text">${p.description}</p></details>` : ''}`;

      $('detail').innerHTML = `
        ${v0 ? `<img class="icon lg" src="${charaIcon(v0)}" alt="${c.name}" onerror="this.style.display='none'">` : ''}
        <h2>${c.name}</h2>
        <p><span class="rarity-${c.rarity}">${RARITY_LABEL[c.rarity]}</span> · <span class="e${c.element_id}">${ELEMENT_LABEL[c.element_id]||''}</span> · ${WEAPON_LABEL[c.weapon_type_id]||''} <small>· base_id ${c.id}</small></p>
        ${tags ? `<p>${tags}</p>` : ''}
        <div class="state-tabs">${tabs}</div>

      // bind state tab

        el.onclick = () => { currentState = el.dataset.st; renderDetail(c); };

      const st = c.states[currentState];
      if (!st) return;
      const s = st.stats || {};
      const statsTable = `<table class="stats-table">
        <tr><th>HP</th><td class="init">${s.initial_hp||'-'}</td><td>→</td><td class="max">${s.max_hp||'-'}</td>
            <th>攻撃力</th><td class="init">${s.initial_attack||'-'}</td><td>→</td><td class="max">${s.max_attack||'-'}</td></tr>

      const skills = (st.weapon_skills||[]).map(sk => `<tr>
