  <main>
    <aside>
      <h3>検索</h3>
      <input type="text" id="search" placeholder="名前..." />
      <h3>★</h3><div id="f-rarity"></div>
      <h3>属性</h3><div id="f-element"></div>
      <h3>武器</h3><div id="f-weapon"></div>
      <p style="font-size:11px;opacity:0.6"><span id="count">-</span> 件</p>
    </aside>
    <section id="list"></section>
    <article id="detail"><p style="opacity:0.6">魔剣を選択</p></article>
  </main>
  <script type="module">
    import { loadCharacters } from '../shared/data-loader.js';
    import { RARITY_LABEL, ELEMENT_LABEL, WEAPON_LABEL, EVOLVE_NAME } from '../shared/constants.js';
    import * as fc from '../shared/filter-core.js';
    import { charaIcon, imgWithFallback } from '../shared/image-paths.js';

    const state = { rarity: new Set(), element: new Set(), weapon: new Set(), search: '' };
    let all = [];
    let selected = null;

    const $ = (id) => document.getElementById(id);

    async function init() {
      all = await loadCharacters();
      fc.renderToggles($('f-rarity'), 'rarity', fc.rarityOptions(), state, render);
      fc.renderToggles($('f-element'), 'element', fc.elementOptions(), state, render);
      fc.renderToggles($('f-weapon'), 'weapon', fc.weaponTypeOptions(), state, render);
      $('search').oninput = (e) => { state.search = e.target.value; render(); };
      render();
    }

    function render() {
      const fields = { rarity: 'rarity', element: 'element_id', weapon: 'weapon_type_id' };
      const filtered = fc.applyFilterSort(all, state, fields, 'rarity', 'desc');
      $('count').textContent = filtered.length;
      $('list').innerHTML = filtered.map((c) => {
        const v0 = c.states?.['通常']?.variant_id || c.states?.['改造']?.variant_id;
        return `<div class="item ${selected===c.id?'selected':''}" data-id="${c.id}">
          ${v0 ? imgWithFallback(charaIcon(v0), c.name) : ''}
          <div><span class="rarity-${c.rarity}">${RARITY_LABEL[c.rarity]}</span>
          <span style="margin-left:4px">${ELEMENT_LABEL[c.element_id]||''}${WEAPON_LABEL[c.weapon_type_id]||''}</span>
          <br><b>${c.name}</b></div>
        </div>`;
      }).join('');
      $('list').onclick = (e) => {
        const el = e.target.closest('.item');
        if (!el) return;
        selected = +el.dataset.id;
        const c = all.find((x) => x.id === selected);
        renderDetail(c);
        render();
      };
    }

    function renderDetail(c) {
      if (!c) { $('detail').innerHTML = '<p style="opacity:0.6">魔剣を選択</p>'; return; }
      const states = Object.entries(c.states || {}).map(([name, st]) => {
        const stats = st.stats || {};
        return `<details><summary><b>${EVOLVE_NAME[st.evolve_count]||name}</b> (variant ${st.variant_id})</summary>
        <pre>HP:${stats.initial_hp}→${stats.max_hp} 攻:${stats.initial_attack}→${stats.max_attack} 防:${stats.initial_defense}→${stats.max_defense}
BK:${stats.initial_break}→${stats.max_break} 速:${stats.initial_speed}→${stats.max_speed}
熟度:${stats.max_mature} lv:${stats.initial_max_level}→${stats.max_max_level} LP:${stats.max_lp}</pre>
        <p style="font-size:11px;opacity:0.7">${(st.weapon_skills||[]).map(s=>`<b>${s.name}</b>: ${s.parameter}/${s.math_type}/${s.value}${s.value_scaling?` (+${s.value_scaling}/熟度)`:''}<br>${s.description||''}`).join('<br><br>')}</p>
        </details>`;
      }).join('');
      const bd = c.bd_skill;
      const bdH = bd ? `<h3>BD</h3><b>${bd.name||bd.description||''}</b> cost ${bd.cost} / ${bd.hit_count} 連 / ${bd.range}<br><small>${(bd.effects||[]).map(e=>`${e.parameter} ${e.math_type} ${e.value}${e.duration_value?` ${e.duration_value}s`:''}`).join(' / ')}</small>` : '';
      const v0 = c.states?.['通常']?.variant_id || c.states?.['改造']?.variant_id;
      $('detail').innerHTML = `${v0 ? imgWithFallback(charaIcon(v0), c.name) : ''}
        <h2>${c.name}</h2>
        <p>${RARITY_LABEL[c.rarity]} / ${ELEMENT_LABEL[c.element_id]||''}${WEAPON_LABEL[c.weapon_type_id]||''} (base_id ${c.id})</p>
        ${states}${bdH}`;
    }
    init();
  </script>
