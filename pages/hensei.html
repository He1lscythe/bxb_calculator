<!doctype html>
<html lang="ja">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>編成 — v2</title>
  <link rel="stylesheet" href="../css/v2.css" />
</head>
<body>
  <header>
    <a href="characters.html">魔剣</a>
    <a href="souls.html">ソウル</a>
    <a href="crystals.html">記憶結晶</a>
    <a href="bladegraphs.html">心象結晶</a>
    <a href="hensei.html">編成</a>
    <span style="float:right;font-size:11px;opacity:0.6">v2 / minimal hensei (1 slot demo)</span>
  </header>
  <main style="grid-template-columns: 300px 1fr;">
    <aside>
      <h3>魔剣選択</h3>
      <select id="chara-pick" style="width:100%"><option value="">--</option></select>
      <h3>State</h3>
      <select id="state-pick" style="width:100%"></select>
      <h3>練度</h3>
      <div class="row"><label>熟度</label><input type="number" id="mature" value="99" min="1" /></div>
      <div class="row"><label>等級</label><input type="number" id="lv" value="255" min="1" /></div>
      <div class="row"><label>覚醒</label><input type="number" id="awk" value="0" min="0" /></div>
      <h3>状態</h3>
      <div class="row"><label><input type="checkbox" id="bh" checked /> 燃心 BH ×1.3</label></div>
      <div class="row"><label>結婚</label>
        <select id="marriage"><option value="none">無</option><option value="no_flower">花無</option><option value="with_flower" selected>花有</option></select>
      </div>
      <div class="row"><label>HP %</label><input type="number" id="hp_percent" value="100" min="0" max="100" /></div>
    </aside>
    <section id="stats-panel" class="stats-panel">
      <p style="opacity:0.6">魔剣を選んで stats を計算</p>
    </section>
  </main>
  <script type="module">
    import { loadCharacters } from '../shared/data-loader.js';
    import { EVOLVE_NAME, RARITY_LABEL, ELEMENT_LABEL, WEAPON_LABEL } from '../shared/constants.js';
    import { calcHenseiStats } from '../shared/stats-calc.js';

    const $ = (id) => document.getElementById(id);
    let chars = [];

    async function init() {
      chars = await loadCharacters();
      chars.sort((a, b) => (b.rarity - a.rarity) || a.id - b.id);
      $('chara-pick').innerHTML = '<option value="">--</option>' +
        chars.map(c => `<option value="${c.id}">${RARITY_LABEL[c.rarity]} ${c.name}</option>`).join('');
      $('chara-pick').onchange = onCharaChange;
      ['state-pick', 'mature', 'lv', 'awk', 'bh', 'marriage', 'hp_percent'].forEach(id =>
        $(id).onchange = recalc, $(id).oninput = recalc);
    }

    function onCharaChange() {
      const cid = +$('chara-pick').value;
      const c = chars.find(x => x.id === cid);
      if (!c) { $('stats-panel').innerHTML = '<p style="opacity:0.6">魔剣を選んで stats を計算</p>'; return; }
      const states = Object.keys(c.states || {});
      $('state-pick').innerHTML = states.map(s => `<option value="${s}">${s}</option>`).join('');
      recalc();
    }

    function recalc() {
      const cid = +$('chara-pick').value;
      const c = chars.find(x => x.id === cid);
      if (!c) return;
      const stateKey = $('state-pick').value || Object.keys(c.states)[0];
      const result = calcHenseiStats(c, stateKey, {
        lv: +$('lv').value || 1,
        mature: +$('mature').value || 1,
        awakening: +$('awk').value || 0,
        rarity: c.rarity,
        marriage: $('marriage').value,
        bh_on: $('bh').checked,
        lp: 999, max_lp: c.states[stateKey]?.stats?.max_lp || 9,
        hp_percent: +$('hp_percent').value || 100,
      });
      if (!result) { $('stats-panel').innerHTML = '<p>無効な state</p>'; return; }
      $('stats-panel').innerHTML = `<h2>${c.name} (${stateKey})</h2>
        <p>${RARITY_LABEL[c.rarity]} / ${ELEMENT_LABEL[c.element_id]||''}${WEAPON_LABEL[c.weapon_type_id]||''}</p>
        <p>lv ${result.lv} / cap ${result.cap} / max with awk ${result.max_lv_with_awk}</p>
        <table style="border-collapse:collapse;font-size:13px">
          <tr><td>HP</td><td style="padding:2px 12px;text-align:right">${result.hp.toLocaleString()}</td></tr>
          <tr><td>攻撃力</td><td style="padding:2px 12px;text-align:right;color:#f1c40f"><b>${result.attack.toLocaleString()}</b></td></tr>
          <tr><td>防御力</td><td style="padding:2px 12px;text-align:right">${result.defense.toLocaleString()}</td></tr>
          <tr><td>ブレイク</td><td style="padding:2px 12px;text-align:right">${result.break.toLocaleString()}</td></tr>
          <tr><td>スピード</td><td style="padding:2px 12px;text-align:right">${result.speed}</td></tr>
        </table>
        <p style="font-size:11px;opacity:0.7;margin-top:12px">
          結婚 ×${result.marriage_mult} / BH ×${result.bh} / LP ×${result.lp_mult}
        </p>
        <p style="font-size:11px;opacity:0.5">
          ⚠ v2 minimal hensei: 1 slot only、未含 buff (魂/結晶/魔装/bg)、未含 50 步 EAD pipeline、未含 HP-curve scale 精确公式
        </p>`;
    }
    init();
  </script>
</body>
</html>
