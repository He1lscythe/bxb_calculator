      export const fmtVal = (ef) => {
        const bunrui = ef.bunrui || [];
        const isHitOnly = bunrui.length === 1 && bunrui[0] === 7;
        if (isHitOnly) return fmtHitStages(ef);
        let v = '';

          const sc = ef.bairitu_scaling;
          // ct: 0=×, 1=+, 2=+(終), 3=×(終)
          const ct = ef.calc_type ?? 0;
          const pfx = ct === 1 ? '+' : ct === 2 ? '+(終)' : ct === 3 ? '×(終)' : 'x';
          const isAddCt = ct === 1 || ct === 2;
          // inner: 加算は単値、乗算は init〜max 範囲対応
          let inner;
          if (!isAddCt) {
            const lo = ef.bairitu_init,
              hi = ef.bairitu;
            inner = lo != null && lo !== hi ? fmtLarge(lo) + '〜' + fmtLarge(hi) : fmtLarge(hi);
          } else {
            inner = fmtLarge(ef.bairitu);
          }
          // sc あり → 括弧で括って "+(v + sc * 熟度)"。なし → 単に "+v"。
          v = pfx + (sc ? '(' + inner + ' + ' + sc + ' * 熟度)' : inner);
        }
        if (bunrui.includes(7)) {
          const hitStr = fmtHitStages(ef);
          if (hitStr) v += (v ? ' / ' : '') + hitStr;
        }
        return v;

      // scope tag のスタイル/略称は utils.js / soul-render.js と統一（自/全/X/X·自/X·全）。
      export const fmtScopeTag = (ef) => {
        const elStr =
          ef.element != null
            ? []
                .concat(ef.element)
                .map((e) => ELEMENT[e] || e)
                .join('/')
            : '';
        const tyStr =
          ef.weapon != null
            ? []
                .concat(ef.weapon)
                .map((t) => WEAPON[t] || t)
                .join('/')
            : '';
        const parts = [elStr, tyStr].filter(Boolean);
        const lim = parts.join('·');
        if (ef.scope === 0) return '<span class="scope-tag scope-self">自</span>';
        if (ef.scope === 1) return '<span class="scope-tag scope-all">全</span>';
        if (ef.scope === 2) return '<span class="scope-tag scope-lim">' + (lim || '限') + '</span>';
        if (ef.scope === 3)
          return '<span class="scope-tag scope-equip-s">' + (lim || '装') + '·自</span>';
        if (ef.scope === 4)
          return '<span class="scope-tag scope-equip-a">' + (lim || '装') + '·全</span>';
        if (ef.scope === 5) {

          return '<span class="scope-tag scope-lim">' + nm + '限定</span>';
        }
        return '';

      // 把 tr.soul_lv / tr.soul_awakening 夹紧到当前 soul 的 cap（rarity 决定）

        if (!soul) return;
        const awMax = soulAwkMax(soul);
        if (team[si].tr.soul_awakening > awMax) team[si].tr.soul_awakening = awMax;

      export const syncCrystals = (si) => {

      export const _maxOmoideThreshold = (c) => {
        if (!c || !Array.isArray(c.omoide)) return 0;

      export const setChara = (si, id) => {

        if (id === null) {

          team[si].masou = null;
          renderSlot(si);
          refreshAllStats();
          return;
        }
        const other = team.findIndex((s, i) => i !== si && s.chara === id);
        if (other >= 0) {
          // swap entire slot — chara/soul/bg/masou/crystals/tr all move together（保留交换语义）
          [team[si], team[other]] = [team[other], team[si]];
          renderSlot(other);
        } else {
          // 更换魔剣（非 swap）：清空結晶 + 魔装（魔装是 chara 限定），魂 / 心象結晶不动
          team[si].chara = id;
          team[si].masou = null;
          const c = allCharas.find((x) => x.id === id);
          team[si].tr.affinity = _maxOmoideThreshold(c);
          // 重置 tr：默认最高 state（極弐>改造>通常）、awakening=0；SS 特例 38/255，其他 jukudo/lv = state max
          if (c) {
            const r = c.rarity;
            const newState = ['極弐', '改造', '通常'].find((s) => c.states?.[s]) || '通常';
            team[si].tr.state = newState;
            team[si].tr.awakening = 0;
            if (r === 4) {
              team[si].tr.jukudo = 38;
              team[si].tr.level = 255;
            } else {
              team[si].tr.jukudo = JUKUDO_MAX_TBL[r]?.[newState] || 1;
              team[si].tr.level = LEVEL_MAX_TBL[r]?.[newState] || 1;
            }
          }
          if (!team[si].soul) autoAssignSoul(si);
          team[si].crystals = [];

          equipAllOmoide(si);

        renderSlot(si);
        refreshAllStats();

      // 换 soul 时把 tr.soul_lv / tr.soul_awakening 重置：觉醒=0、lv=该觉醒下的 max（不保留上一只魂的进度）
      const _resetSoulTr = (si) => {
        team[si].tr.soul_awakening = 0;

        if (other >= 0) {

          _resetSoulTr(other);
          _resetSoulTr(si);
          renderSlot(other);

      export const setBG = (si, id) => {

      export const setCrystal = (si, ci, id) => {

      // 玩家在 hensei 槽位上调结晶 weight/purity/lv

      export const setCrystalDim = (si, ci, dim, val) => {
        // dim: 'weight' | 'purity' | 'lv'
        const cfg = team[si].crystals[ci];
        if (!cfg) return;
        const n = +val;
        if (!Number.isFinite(n)) return;
        const cr = allCrystals.find((x) => x.id === cfg.id);
        if (dim === 'lv') {
          const maxLv = cryLvMax(cr);
          cfg.lv = Math.max(1, Math.min(maxLv, Math.round(n)));
        } else if (dim === 'weight') {
          const wMin = +cr?.weight_min || 0;
          cfg.weight = Math.max(wMin, Math.min(100, n));
        } else {
          cfg[dim] = Math.max(0, Math.min(100, n));

        // cr-eff-list だけ surgical 更新（renderSlot 全量だと .detail-wrap.open 状態を失う）

      // ===== 結晶 重量/純度 popover（⚙ 触发，浮在 slot-card 正上方）=====
      let _crystalPopEl = null;
      let _crystalPopHandler = null;
      // row 排版：[label][slider][number][unit]、slider/number 双向同步、都触发 setCrystalDim
      const _popRow = (si, ci, kind, opts) => {
        const { label, min, max, step, value, unit, oninp } = opts;
        return `<div class="pop-row" data-kind="${kind}">
    <label>${label}</label>

  </div>`;

      export const openCrystalDimPopover = (si, ci, btnEl) => {
        closeCrystalDimPopover();
        const cfg = team[si]?.crystals?.[ci];
        if (!cfg) return;
        const cr = allCrystals.find((x) => x.id === cfg.id);
        if (!cr) return;
        const wStep = _parseScaling(cr.weight_step);
        const pStep = _parseScaling(cr.purity_step);
        const hasLv = (cr.effects || []).some((e) => e.lv_delta !== undefined);
        const maxLv = cryLvMax(cr);
        if (!wStep && !pStep && !(hasLv && maxLv > 1)) return;
        const wRow =
          wStep > 0
            ? _popRow(si, ci, 'weight', {
                label: '重',
                min: +cr.weight_min || 0,
                max: 100,
                step: wStep,
                value: cfg.weight ?? 100,
                unit: 'g',
                oninp: `setCrystalDim(${si},${ci},'weight',this.value)`,
              })
            : '';
        const pRow =
          pStep > 0
            ? _popRow(si, ci, 'purity', {
                label: '純',
                min: 0,
                max: 100,
                step: pStep,
                value: cfg.purity ?? 100,
                unit: '%',
                oninp: `setCrystalDim(${si},${ci},'purity',this.value)`,
              })
            : '';
        const lvRow =
          hasLv && maxLv > 1
            ? _popRow(si, ci, 'lv', {
                label: 'Lv',
                min: 1,
                max: maxLv,
                step: 1,
                value: cfg.lv ?? maxLv,
                unit: '',
                oninp: `setCrystalDim(${si},${ci},'lv',this.value)`,
              })
            : '';
        const pop = document.createElement('div');
        pop.className = 'crystal-dim-popover';
        pop.innerHTML = `
    <div class="pop-title">${escHtml(cr.name)}</div>
    ${wRow}${pRow}${lvRow}
    <div class="pop-actions">
      <button onclick="resetCrystalDim(${si},${ci})">リセット</button>
      <button onclick="closeCrystalDimPopover()">×</button>
    </div>`;
        document.body.appendChild(pop);
        _crystalPopEl = pop;
        // 定位：「整个結晶 section 的正上方」— anchor 用 ⚙ 所在的 .equip-section（記憶結晶 那一块）；
        // 箭头横向指向 ⚙ 自身。
        const card = btnEl?.closest('.equip-section');
        const cardRect = card ? card.getBoundingClientRect() : btnEl.getBoundingClientRect();
        const btnRect = btnEl.getBoundingClientRect();
        const popW = pop.offsetWidth;
        const popH = pop.offsetHeight;
        // 横向：以 slot-card 中心为基准；防溢出
        let left = cardRect.left + cardRect.width / 2 - popW / 2 + window.scrollX;
        const margin = 8;
        if (left < margin) left = margin;
        if (left + popW > window.innerWidth - margin) left = window.innerWidth - margin - popW;
        pop.style.left = left + 'px';
        // 纵向：卡片**上方**（pop 底边离卡片顶部 12px），箭头朝下指向 ⚙
        pop.style.top = cardRect.top - popH - 12 + window.scrollY + 'px';
        // 箭头 x：指向 ⚙ 按钮中心（不是卡片中心，更明确指向触发点）
        const arrowX = btnRect.left + btnRect.width / 2 - left + window.scrollX;
        pop.style.setProperty('--arrow-x', Math.max(12, Math.min(popW - 12, arrowX)) + 'px');
        setTimeout(() => {
          _crystalPopHandler = (e) => {
            if (!pop.contains(e.target) && e.target !== btnEl) closeCrystalDimPopover();
          };
          document.addEventListener('click', _crystalPopHandler);
        }, 0);
      };
      export const closeCrystalDimPopover = () => {
        if (_crystalPopEl) {

        }

      export const resetCrystalDim = (si, ci) => {

      export const setTrNum = (si, key, val, max) => {
        const minVal = key === 'jukudo' ? 1 : 0;
        team[si].tr[key] = Math.min(max, Math.max(minVal, +val || minVal));

      };
      export const renderTraining = (i, chara) => {

        const stHtml = stOpts

          ['花あり', 2],
        ]
          .map(
            ([l, v]) =>
              `<button class="tr-btn${tr.marriage === v ? ' on' : ''}" onclick="setTrField(${i},'marriage',${v})">${l}</button>`,
          )
          .join('');
        const lpHtml = [
          ['通常', 0],
          ['½↓', 1],
          ['¼↓', 2],
        ]
          .map(
            ([l, v]) =>
              `<button class="tr-btn${tr.lp === v ? ' on' : ''}" onclick="setTrField(${i},'lp',${v})">${l}</button>`,
          )
          .join('');
        // 末尾「好感 + BD」行：仅当 chara 有 omoide 或 bd_skill 时显示
        const hasOmoide = (chara.omoide || []).some((r) => r.slots && r.slots.length);
        const hasBd = !!(chara.bd_skill && chara.bd_skill.name);
        const picks = tr.omoide_picks || {};
        const equipped = Object.keys(picks).filter((k) => picks[k] != null).length;
        const total = (chara.omoide || []).length;
        const aff = Math.floor(+tr.affinity || 0);
        const omoideHtml = hasOmoide
          ? min`

      // ===== STATS CALCULATOR =====
      // _STAT_KEYS / _BUNRUI_TO_STAT / _capLevel / _baseStat import 自 stats-calc.js。

      export const _omoidePicksFor = (chara, tr) => {
        // Returns array of senzai info objects for currently picked icons.
        // Gates by tr.affinity: only thresholds <= affinity contribute.
        const picks = tr.omoide_picks || {};
        const aff = +tr.affinity || 0;
        const result = [];
        (chara.omoide || []).forEach((row) => {
          if ((+row.threshold || 0) > aff) return;
          const pickedIcon = picks[row.threshold];
          if (pickedIcon == null) return;
          const info = SENZAI_TABLE[pickedIcon] || SENZAI_TABLE[String(pickedIcon)];
          if (info) result.push(info);
        });
        return result;
      };

      // _selfAppliesChara / _matchElemType / _buffApplies / SOUL_AWK_MAX / soulMultiplier /
      // _parseHit / _parseAff / soulAwkMax / soulLvCap / _conditionFactor / _parseScaling /
      // _LV2_5_RE / _scaledBairitu 都 import 自 stats-calc.js。
      // ===== ENEMY BAR (敵方/副本/工会信息) =====
      export const renderEnemyBar = () => {
        const eb = document.getElementById('enemy-bar');
        if (!eb) return;
        const isGuild = enemy.mode === 'guildbattle' || enemy.mode === 'guildbattle_special';
        // 1. 元素
        const elemBtns = [1, 2, 3, 4, 5, 6]
          .map(
            (e) =>
              `<button class="eb-btn elem-${e}${enemy.element === e ? ' on' : ''}" onclick="setEnemyElem(${e})">${ELEMENT[e]}</button>`,
          )
          .join('');
        // 2. BK状態（单按钮 toggle：あり/なし）
        const bkLabel = enemy.bk ? 'あり' : 'なし';
        const bkBtns = `<button class="eb-btn${enemy.bk ? ' on' : ''}" onclick="setEnemyBk(${!enemy.bk})">${bkLabel}</button>`;
        // 3. mode
        const modeOpts = [
          ['normal', '普通'],
          ['guildbattle', 'ギルバト'],
          ['guildbattle_special', 'ギルバト特別版'],
          ['other', '他'],
        ]
          .map(
            ([v, l]) => `<option value="${v}"${enemy.mode === v ? ' selected' : ''}>${l}</option>`,
          )
          .join('');
        // 4. BK耐性 (guild only) — 单按钮 toggle：普通/高
        let bkResHtml = '';
        if (isGuild) {
          const isHigh = enemy.bkResistance === 'high';
          bkResHtml = `<div class="eb-group">
      <span class="eb-label">BK耐性</span>
      <button class="eb-btn${isHigh ? ' on' : ''}" onclick="setEnemyBkRes('${isHigh ? 'normal' : 'high'}')">${isHigh ? '高' : '普通'}</button>
    </div>`;
        }
        // 7. 有利武器 (guild only) — 桌面行内 / 移动 6x2 grid
        let advWeapHtml = '';
        if (isGuild) {
          const wbtns = [];
          for (let w = 1; w <= 12; w++) {
            const on = enemy.advantageWeapons.has(w) ? ' on' : '';
            wbtns.push(
              `<button class="eb-btn${on}" onclick="toggleAdvWeapon(${w})">${WEAPON[w]}</button>`,
            );
          }
          advWeapHtml = `<div class="eb-group eb-adv-weapon">
      <span class="eb-label">有利武器</span>
      <div class="adv-weapon-grid">${wbtns.join('')}</div>
    </div>`;
        }
        // 8. difficulty (guild only)
        let diffHtml = '';
        if (isGuild) {
          diffHtml = `<div class="eb-group">
      <span class="eb-label">難易度</span>
      ${['Normal', 'Hard', 'Lunatic'].map((d) => `<button class="eb-btn${enemy.difficulty === d ? ' on' : ''}" onclick="setEnemyDiff('${d}')">${d}</button>`).join('')}
    </div>`;
        }
        // 9. ギルド役職 (guild only)
        let titleHtml = '';
        if (isGuild) {
          const opts = [`<option value="">-- 役職なし --</option>`]
            .concat(
              allGuildTitles.map(
                (g) =>
                  `<option value="${g.id}"${enemy.guildTitle === g.id ? ' selected' : ''}>${escHtml(g.name)} — ${escHtml(g.effect_text || '')}</option>`,
              ),
            )
            .join('');
          titleHtml = `<div class="eb-group">
      <span class="eb-label">ギルド役職</span>
      <select onchange="setEnemyGuildTitle(this.value)">${opts}</select>
    </div>`;
        }
        // 10. エンブレム — 4 槽 icon picker（参考 crystals 槽位风格）
        let emblemHtml = `<div class="eb-group">
    <span class="eb-label">エンブレム</span>
    <div class="emblem-slots">`;
        for (let s = 0; s < 4; s++) {
          const slot = enemy.emblems[s] || { id: null, level: 1 };
          if (slot.id != null) {
            const em = allGuildEmblems.find((g) => g.id === slot.id);
            const lvMax = em ? emblemLvMax(em.rarity) : 1;
            emblemHtml += `<div class="emblem-slot-wrap" onclick="openEmblemModal(${s})">
        <div class="emblem-thumb-wrap">
          <img class="emblem-thumb" src="../${em && em.image ? em.image : 'icon/emblem/' + slot.id + '.png'}" onerror="this.style.opacity='.3'" title="${escHtml(em ? em.name : '')}" alt="">
          <button class="emblem-rm" onclick="event.stopPropagation();setEmblem(${s},'')" title="外す">×</button>
        </div>
        <div class="emblem-slot-meta" onclick="event.stopPropagation()">
          <input type="number" min="1" max="${lvMax}" value="${slot.level || 1}" class="emblem-lv-input" onchange="setEmblemLv(${s},+this.value)">
          <span class="emblem-lv-max">/${lvMax}</span>
        </div>
      </div>`;
          } else {
            emblemHtml += `<div class="emblem-slot-wrap" onclick="openEmblemModal(${s})">
        <div class="emblem-empty" title="エンブレムを選択">+</div>
        <div class="emblem-slot-meta" style="visibility:hidden" aria-hidden="true">
          <input type="number" value="1" class="emblem-lv-input" tabindex="-1">
          <span class="emblem-lv-max">/1</span>
        </div>
      </div>`;
          }
        }
        emblemHtml += `</div></div>`;

        // 11. BDゲージ上限条 — slider + integer input。max は _computeBdCapMax で算出。
        const bdCapMax = _computeBdCapMax();
        if ((+enemy.bd_cap || 0) > bdCapMax) enemy.bd_cap = bdCapMax;
        const bdCap = +enemy.bd_cap || 0;
        const bdCapHtml = `<div class="eb-group">
    <span class="eb-label">BDゲージ上限</span>
    <input type="range" min="0" max="${bdCapMax}" step="1" value="${bdCap}" class="bd-cap-slider" oninput="setEnemyBdCap(+this.value)">
    <input type="number" min="0" max="${bdCapMax}" step="1" value="${bdCap}" class="bd-cap-input" oninput="setEnemyBdCap(this.value)">
    <span class="bd-cap-max">/${bdCapMax}</span>
  </div>`;

        eb.innerHTML = `
    <div class="eb-group"><span class="eb-label">敵属性</span>${elemBtns}</div>
    <div class="eb-group"><span class="eb-label">敵BK状態</span>${bkBtns}</div>
    <div class="eb-group"><span class="eb-label">副本</span><select onchange="setEnemyMode(this.value)">${modeOpts}</select></div>
    ${bkResHtml}
    ${diffHtml}
    ${advWeapHtml}
    ${titleHtml}
    ${emblemHtml}
    ${bdCapHtml}
  `;
      };

      export const setEnemyElem = (e) => {
        enemy.element = e;
        renderEnemyBar();
        refreshAllStats();
      };
      export const setEnemyBk = (b) => {
        enemy.bk = !!b;
        renderEnemyBar();
        refreshAllStats();
      };
      export const setEnemyMode = (m) => {
        enemy.mode = m;
        renderEnemyBar();
        refreshAllStats();
      };
      export const setEnemyBkRes = (r) => {
        enemy.bkResistance = r;
        renderEnemyBar();
        refreshAllStats();
      };
      export const setEnemyDiff = (d) => {
        enemy.difficulty = d;
        renderEnemyBar();
        refreshAllStats();
      };
      export const setEnemyGuildTitle = (v) => {
        enemy.guildTitle = v ? +v : null;
        renderEnemyBar();
        refreshAllStats();
      };
      export const setEnemyBdCap = (v) => {
        let n = parseInt(v, 10);
        if (!Number.isFinite(n)) n = 0;
        // 動的 max：slider の max 属性を信頼する（renderEnemyBar 側で _computeBdCapMax() 拡張済み）
        const sl = document.querySelector('.bd-cap-slider');
        const dynMax = sl ? +sl.max || 9 : 9;
        enemy.bd_cap = Math.max(0, Math.min(dynMax, n));
        if (sl) sl.value = enemy.bd_cap;
        const ip = document.querySelector('.bd-cap-input');
        if (ip) ip.value = enemy.bd_cap;
        refreshAllStats();
      };
      export const toggleAdvWeapon = (w) => {
        if (enemy.advantageWeapons.has(w)) enemy.advantageWeapons.delete(w);
        else enemy.advantageWeapons.add(w);
        renderEnemyBar();
        refreshAllStats();
      };
      export const setEmblem = (slotIdx, v) => {
        if (!enemy.emblems[slotIdx]) enemy.emblems[slotIdx] = { id: null, level: 1 };
        const newId = v ? +v : null;
        enemy.emblems[slotIdx].id = newId;
        const em = newId != null ? allGuildEmblems.find((g) => g.id === newId) : null;
        enemy.emblems[slotIdx].level = em ? emblemLvMax(em.rarity) : 1;
        renderEnemyBar();
        refreshAllStats();
      };
      export const setEmblemLv = (slotIdx, lv) => {
        if (!enemy.emblems[slotIdx]) enemy.emblems[slotIdx] = { id: null, level: 1 };
        const em = allGuildEmblems.find((g) => g.id === enemy.emblems[slotIdx].id);
        const max = em ? emblemLvMax(em.rarity) : 1;
        enemy.emblems[slotIdx].level = Math.max(1, Math.min(max, Math.floor(+lv) || 1));
        renderEnemyBar();
        refreshAllStats();
      };

      // ===== EMBLEM MODAL（rarity 筛选 + icon 列表）=====
      // スロット色固定：0→黄(1) / 1→青(2) / 2→緑(3) / 3→赤(4)
      const SLOT_COLORS = [1, 2, 3, 4];
      const COLOR_LABELS = { 1: '黄', 2: '青', 3: '緑', 4: '赤' };
      const COLOR_HEX = { 1: '#ffd040', 2: '#5b8bff', 3: '#5bd47a', 4: '#ff6b6b' };
      let emblemModalSlot = -1;
      const emblemModalFilter = { rarity: new Set() };

      export const openEmblemModal = (slotIdx) => {
        emblemModalSlot = slotIdx;
        const c = SLOT_COLORS[slotIdx];
        const title = document.querySelector('#emblem-modal .modal-header-title');
        if (title) {
          title.innerHTML = c
            ? `エンブレム選択 <span style="color:${COLOR_HEX[c]};font-size:13px;margin-left:6px">● ${COLOR_LABELS[c]}スロット</span>`
            : 'エンブレム選択';
        }
        document.getElementById('emblem-modal').classList.add('open');
        _renderEmblemModalSidebar();
        _renderEmblemModalList();
      };
      export const closeEmblemModal = () => {
        document.getElementById('emblem-modal').classList.remove('open');
        emblemModalSlot = -1;
      };
      export const _renderEmblemModalSidebar = () => {
        const html = `
    <div class="f-section"><div class="f-label">レア度</div><div class="f-toggles">
      ${[1, 2, 3, 4]
        .map(
          (r) =>
            `<button class="ftog${emblemModalFilter.rarity.has(r) ? ' on' : ''}" onclick="toggleEmblemRarity(${r})">★${r}</button>`,
        )
        .join('')}
    </div></div>
    <div class="f-sort-row"><button class="f-reset-btn" onclick="resetEmblemFilter()" style="flex:1">リセット</button></div>
    <div class="modal-count" id="emblem-count"></div>`;
        document.getElementById('emblem-sidebar').innerHTML = html;
      };
      export const _renderEmblemModalList = () => {
        const list = document.getElementById('emblem-list');
        const isGuildMode = enemy.mode === 'guildbattle' || enemy.mode === 'guildbattle_special';
        const slotColor = SLOT_COLORS[emblemModalSlot];
        const items = (allGuildEmblems || [])
          .filter((em) => {
            if (slotColor && (+em.color || 0) !== slotColor) return false;
            if (emblemModalFilter.rarity.size > 0 && !emblemModalFilter.rarity.has(+em.rarity || 1))
              return false;
            return true;
          })
          .sort(
            (a, b) =>
              (a.guild_only ? 1 : 0) - (b.guild_only ? 1 : 0) ||
              (a.rarity || 1) - (b.rarity || 1) ||
              a.id - b.id,
          );
        const cnt = document.getElementById('emblem-count');
        if (cnt) cnt.textContent = items.length + ' 件';

        let html = `<div class="em-clear sticky" onclick="selectEmblem(null)">— エンブレムを外す</div>`;
        if (!items.length) {
          list.innerHTML = html + '<div class="em-no-results">該当なし</div>';
          return;
        }
        for (const em of items) {
          const cur = (enemy.emblems[emblemModalSlot] || {}).id === em.id ? ' active' : '';
          const dim = em.guild_only && !isGuildMode ? ' style="opacity:.8"' : '';
          const gbTag = em.guild_only
            ? '<span class="badge weapon" style="background:rgba(91,127,255,.18);color:#7b9fff;border-color:rgba(91,127,255,.35)">GB限定</span>'
            : '';
          html += `<div class="em-item em-item-bg${cur}"${dim} onclick="selectEmblem(${em.id})">
      <img class="em-icon" src="../${em.image || 'icon/emblem/' + em.id + '.png'}" onerror="this.style.visibility='hidden'" alt="">
      <div class="em-bg-body">
        <div class="em-bg-header">
          <span class="badge weapon">★${em.rarity || 1}</span>
          <span class="em-bg-name">${escHtml(em.name || '')}</span>
          ${gbTag}
        </div>
        <div class="em-bg-eff">${escHtml(em.effect_text || '')}</div>
      </div>
    </div>`;
        }
        list.innerHTML = html;
      };
      export const toggleEmblemRarity = (r) => {
        if (emblemModalFilter.rarity.has(r)) emblemModalFilter.rarity.delete(r);
        else emblemModalFilter.rarity.add(r);
        _renderEmblemModalSidebar();
        _renderEmblemModalList();
      };
      export const resetEmblemFilter = () => {
        emblemModalFilter.rarity.clear();
        _renderEmblemModalSidebar();
        _renderEmblemModalList();
      };
      export const selectEmblem = (id) => {
        if (emblemModalSlot < 0) return;
        setEmblem(emblemModalSlot, id == null ? '' : id);
        closeEmblemModal();
      };

      // Pick / equip / clear ─────────────────────────────────────
      export const pickOmoide = (si, threshold, iconId) => {
        const tr = team[si].tr;
        if ((+threshold || 0) > (+tr.affinity || 0)) return; // locked
        if (!tr.omoide_picks) tr.omoide_picks = {};
        if (tr.omoide_picks[threshold] === iconId) {
          delete tr.omoide_picks[threshold];
        } else {
          tr.omoide_picks[threshold] = iconId;
        }
        if (omoideModalSlot === si) _renderOmoideModalBody();
        _refreshOmoideCountLabel(si);
        refreshAllStats();
      };

      export const equipAllOmoide = (si) => {
        const c = allCharas.find((x) => x.id === team[si].chara);
        if (!c) return;
        const tr = team[si].tr;
        const aff = +tr.affinity || 0;
        if (!tr.omoide_picks) tr.omoide_picks = {};
        (c.omoide || []).forEach((row) => {
          if ((+row.threshold || 0) > aff) return; // locked
          const opts = row.slots || [];
          let pick = opts.find((id) => {
            const info = SENZAI_TABLE[id] || SENZAI_TABLE[String(id)];
            return info && (info.bunrui || []).includes(1);
          });
          if (pick == null && opts.length === 1) pick = opts[0];
          if (pick != null) tr.omoide_picks[row.threshold] = pick;
        });
        if (omoideModalSlot === si) _renderOmoideModalBody();
        _refreshOmoideCountLabel(si);
        refreshAllStats();
      };

      export const clearAllOmoide = (si) => {
        team[si].tr.omoide_picks = {};
        if (omoideModalSlot === si) _renderOmoideModalBody();
        _refreshOmoideCountLabel(si);
        refreshAllStats();
      };

      let omoideModalSlot = -1;
      export const openOmoideModal = (si) => {
        omoideModalSlot = si;
        const c = allCharas.find((x) => x.id === team[si].chara);
        if (!c) return;
        document.getElementById('omoide-modal-title').textContent = `好感装備 — ${c.name}`;
        _renderOmoideModalBody();
        document.getElementById('omoide-modal').classList.add('open');
      };
      export const closeOmoideModal = () => {
        document.getElementById('omoide-modal').classList.remove('open');
        omoideModalSlot = -1;
      };
      export const _renderOmoideModalBody = () => {
        const si = omoideModalSlot;
        if (si < 0) return;
        const c = allCharas.find((x) => x.id === team[si].chara);
        if (!c) return;
        const tr = team[si].tr;
        const picks = tr.omoide_picks || {};
        const aff = +tr.affinity || 0;
        const rows = (c.omoide || [])
          .map((row) => {
            const locked = (+row.threshold || 0) > aff;
            const opts = (row.slots || [])
              .map((iconId) => {
                const info = SENZAI_TABLE[iconId] || SENZAI_TABLE[String(iconId)] || {};
                const sel = picks[row.threshold] === iconId;
                const lbl = (info.koka || 'icon' + iconId).replace(/UP|\[★+\]/g, (x) =>
                  x.includes('★') ? x : '',
                );
                const bStr =
                  info.bairitu != null && info.bairitu !== 0
                    ? ' (' + ctPfx(info.calc_type) + fmtNum(info.bairitu) + ')'
                    : '';
                const dis = locked ? ' disabled style="cursor:not-allowed"' : '';
                return `<button class="om-opt${sel ? ' on' : ''}"${dis} onclick="pickOmoide(${si},${row.threshold},${iconId})" title="${escHtml(info.koka || '')}${bStr}">${escHtml(lbl + bStr)}</button>`;
              })
              .join('');
            const lockTag = locked
              ? '<span style="font-size:10px;color:#ff7777;margin-left:4px">🔒</span>'
              : '';
            return min`
      <div class="om-row${locked ? ' locked' : ''}">
        <div class="om-thresh">${row.threshold}${lockTag}</div>
        <div class="om-slots">${opts}</div>
      </div>`;

      export const _refreshOmoideCountLabel = (si) => {

      export const _fmtStat = (v) => {
        if (v == null || isNaN(v)) return '-';
        // 超过 13 位数（≥ 1e13）改用科学计数法（小数点后 6 位）
        if (Math.abs(v) >= 1e13) return (+v).toExponential(6);
        return (+v).toLocaleString('en-US');
      };

      export const renderStatsPanel = (i, chara) => {
        if (!chara) return `<div class="stats-panel" id="stats-panel-${i}"></div>`;
        return `<div class="stats-panel" id="stats-panel-${i}">${_statsInner(i, chara)}</div>`;
      };
      // 各 slot の最新 computeStats 結果を保持（trace modal 用、IS_LOCAL_DEV のみ意味あり）
      const _lastTrace = [null, null, null];

      // stats-calc.js computeStats 用 ctx — 数据集 + 队伍状态 + helper / 常量 を 1 つの object に。
      // 函数調用時に fresh build（state mutable のため snapshot）、helper 引用は closure scope 経由。
      // ctx 缩到 14 字段（数据集 + 队伍/敌方 + UI 常量）。helper / 常量都已经在
      // stats-calc.js module scope export、不再 ctx 注入。
      const _buildStatsCtx = () => ({
        allCharas,
        allCrystals,
        allSouls,
        allMasou,
        allBGs,
        allGuildTitles,
        allGuildEmblems,
        SENZAI_TABLE,
        team,
        teamSize,
        enemy,
        SLOT_COLORS,
        COLOR_LABELS,
        IS_LOCAL_DEV,
      });

      export const _statsInner = (i, chara) => {
        if (!chara) {
          _lastTrace[i] = null;
          return '';
        }
        const tr = team[i].tr;
        const r = computeStats(chara, tr, i, _buildStatsCtx());
        if (!r) {
          _lastTrace[i] = null;
          return '';
        }
        _lastTrace[i] = r;
        const dl = +r.damageLimit;
        const aMax = +r.stats['攻撃力'] || 0;
        const aMin = aMax * 0.95;
        const def = +r.stats['防御力'] || 0;
        const hp = +r.stats['HP'] || 0;
        const bk = +r.stats['ブレイク力'] || 0;
        const hits = (r.hits || [0, 0, 0]).map((h) => Math.floor(+h || 0));
        const total_hits = hits.reduce((sum, h) => sum + h, 0);

        const yMax = aMax >= dl ? ' style="color:#ffd040"' : '';
        const yMin = aMin >= dl ? ' style="color:#ffd040"' : '';

        // dev 環境のみ stat cell を clickable に。GitHub Pages では cursor も onclick もなし。
        const ck = IS_LOCAL_DEV
          ? (k) => ` onclick="openStatTrace(${i},'${k}')" style="cursor:pointer"`
          : () => '';

        // 显示顺序：攻撃力max / 攻撃力min / 防御力 / HP / BK / Hit数 / ダメ上限
        // 默认每 cell 1/2 行宽（.stats-grid 的 grid-template-columns 设为 repeat(2,1fr)）。
        const cells = [
          `<div class="stats-cell"${ck('攻撃力')}><span class="stats-key">攻撃力max</span><span class="stats-val"${yMax}>${_fmtStat(Math.ceil(aMax))}</span></div>`,
          `<div class="stats-cell"${ck('攻撃力')}><span class="stats-key">攻撃力min</span><span class="stats-val"${yMin}>${_fmtStat(Math.ceil(aMin))}</span></div>`,
          `<div class="stats-cell"${ck('防御力')}><span class="stats-key">防御力</span><span class="stats-val">${_fmtStat(Math.ceil(def))}</span></div>`,
          `<div class="stats-cell"${ck('HP')}><span class="stats-key">HP</span><span class="stats-val">${_fmtStat(Math.ceil(hp))}</span></div>`,
          `<div class="stats-cell"${ck('ブレイク力')}><span class="stats-key">BK</span><span class="stats-val">${_fmtStat(Math.ceil(bk))}</span></div>`,
          `<div class="stats-cell"${ck('Hit')}><span class="stats-key">Hit数</span><span class="stats-val">[${hits.join(', ')}] 合計 ${total_hits} hit</span></div>`,
          `<div class="stats-cell"${ck('ダメ上限')}><span class="stats-key">ダメ上限</span><span class="stats-val">${_fmtStat(Math.ceil(dl))}</span></div>`,
        ].join('');
        return `<div class="stats-grid">${cells}</div>`;
      };
      export const refreshStatsPanel = (i) => {
        const el = document.getElementById('stats-panel-' + i);
        if (!el) return;
        const c = allCharas.find((x) => x.id === team[i].chara);
        el.innerHTML = _statsInner(i, c);
      };
      // BDゲージ上限 max 算出：各 slot の bdCapMax（computeStats 内で floor((10+Σadd)*(1+Σmul)
      // +ΣfinalAdd)*(1+ΣfinalMul)) - 1 まで完了済み）の最大値を採用。基础 buff 無し = floor(10) - 1 = 9。
      const _computeBdCapMax = () => {
        let bdMax = 9; // baseline (buff 無し時の floor(10)-1)
        for (let si = 0; si < teamSize; si++) {
          const slot = team[si];
          if (!slot) continue;
          const ch = allCharas.find((x) => x.id === slot.chara);
          if (!ch) continue;
          const r = computeStats(ch, slot.tr, si, _buildStatsCtx());
          if (r && (r.bdCapMax || 0) > bdMax) bdMax = r.bdCapMax;
        }
        return bdMax;
      };

      // chara/soul/crystal/bg/masou 切替や 練度 変更で bdCapMax が変わった時、

      const refreshBdCapMax = () => {
        const bdCapMax = _computeBdCapMax();
        if ((+enemy.bd_cap || 0) > bdCapMax) enemy.bd_cap = bdCapMax;
        const sl = document.querySelector('.bd-cap-slider');
        const ip = document.querySelector('.bd-cap-input');
        const lbl = document.querySelector('.bd-cap-max');
        if (sl) {
          sl.max = bdCapMax;
          sl.value = enemy.bd_cap;
        }
        if (ip) {
          ip.max = bdCapMax;
          ip.value = enemy.bd_cap;
        }
        if (lbl) lbl.textContent = `/${bdCapMax}`;
      };

      // Wrap CRYSTAL_SPEC with picker-specific scope match.
      const HENSEI_CRYSTAL_SPEC = Object.assign({}, CRYSTAL_SPEC, {
        filters: Object.assign({}, CRYSTAL_SPEC.filters, {
          scope: {
            match: function (c, set) {
              return (c.effects || []).some(function (ef) {
                if (set.has(0) && ef.scope === 0) return true;
                if (set.has(1) && ef.scope === 1) return true;
                if (set.has(2) && [2, 3, 4, 5].indexOf(ef.scope) >= 0) return true;
                return false;
              });
            },
          },
          // bg-style: any-effect element/type matching (more permissive than primary-derived)
          element: {
            match: function (c, set) {
              return (c.effects || []).some(function (ef) {
                var arr = [].concat(ef.element || []);
                for (var v of set) if (arr.indexOf(v) >= 0) return true;
                return false;

      export const applyEM = () => {
        const type = emType,
          f = mf[type];

          const cid = team[emSlot]?.chara;
          items = cid ? (masouByChara[cid] || []).slice() : [];

            const q = String(f.q).toLowerCase();
            items = items.filter((m) => (m.name || '').toLowerCase().indexOf(q) >= 0);
          }
        } else {
          let spec = null;
          if (type === 'chara') spec = CHARA_SPEC;
          else if (type === 'soul') spec = SOUL_SPEC;
          else if (type === 'bg') spec = HENSEI_BG_SPEC;
          else if (type === 'crystal') spec = HENSEI_CRYSTAL_SPEC;
          if (!spec) {
            renderEMList([]);
            return;
          }
          items = FilterCore.applyFilters(
            allCharas && type === 'chara'
              ? allCharas
              : type === 'soul'
                ? allSouls
                : type === 'bg'
                  ? allBGs
                  : allCrystals,
            {
              q: f.q,
              filters: f,
              sortKey: f.sort,
              sortDesc: f.desc !== false,
            },
            spec,
          );
          if (!f.sort || !spec.sortFns[f.sort]) {
            if (type === 'chara') {
              items.sort((a, b) => (b.sort_id || b.id) - (a.sort_id || a.id));

              items.sort((a, b) => b.rarity - a.rarity || b.id - a.id);

        renderEMList(items);

          type = emType,

        else if (type === 'soul') setSoul(si, id);

        else if (type === 'masou') setMasou(si, id);
      };

      // ===== DETAIL MODAL =====
      let dmCharaId = null,
        dmEntityType = 'chara';

      export const openDetailModal = (id, type = 'chara', showSelect = true) => {
        dmCharaId = id;
        dmEntityType = type;
        const btn = document.getElementById('dm-select-btn');
        btn.style.display = showSelect ? '' : 'none';
        const labels = {
          chara: 'この魔剣を選択',
          soul: 'このソウルを選択',
          bg: 'この心象結晶を選択',
          crystal: 'この記憶結晶を選択',
          masou: 'この魔装を選択',
        };
        btn.textContent = labels[type] || 'この魔剣を選択';
        if (type === 'chara') {
          const c = allCharas.find((x) => x.id === id);

          document.getElementById('dm-title').textContent = c.name;

          document.getElementById('detail-modal').classList.add('open');
          const first = ['極弐', '改造', '通常'].find((s) => c.states?.[s]);
          if (first) switchDMState(first);
        } else if (type === 'soul') {
          const s = allSouls.find((x) => x.id === id);

          document.getElementById('dm-title').textContent = s.name;
          document.getElementById('dm-body').innerHTML = renderDMSoul(s);
          document.getElementById('detail-modal').classList.add('open');
        } else if (type === 'bg') {

          document.getElementById('dm-title').textContent = b.name;
          document.getElementById('dm-body').innerHTML = renderDMBg(b);
          document.getElementById('detail-modal').classList.add('open');
        } else if (type === 'crystal') {
          const c = allCrystals.find((x) => x.id === id);
          if (!c) return;
          document.getElementById('dm-title').textContent = c.name;
          document.getElementById('dm-body').innerHTML = renderDMCrystal(c);
          document.getElementById('detail-modal').classList.add('open');
        } else if (type === 'masou') {
          const m = allMasou.find((x) => x.id === id);

          document.getElementById('detail-modal').classList.add('open');

      export const closeDetailModal = () => {
        document.getElementById('detail-modal').classList.remove('open');

      };
      export const selectFromDetail = () => {
        const id = dmCharaId,
          type = dmEntityType;
        const si = emSlot,
          ci = emCi;
        closeDetailModal();
        closeEM();
        if (type === 'soul') setSoul(si, id);
        else if (type === 'bg') setBG(si, id);
        else if (type === 'crystal') setCrystal(si, ci, id);
        else if (type === 'masou') setMasou(si, id);
        else setChara(si, id);
      };

      // ===== SOUL DETAIL =====
      const _AFF_LABEL = { '-2': '超苦手', '-1': '苦手', 0: '普通', 1: '得意', 2: '超得意' };
      const _AFF_CLR = { '-2': '#ff5555', '-1': '#ffaa44', 0: null, 1: '#88ee99', 2: '#44ee77' };
      const _AFF_BDR = {
        '-2': 'rgba(255,85,85,.35)',
        '-1': 'rgba(255,170,68,.2)',

        2: 'rgba(68,238,119,.35)',

      const _WEAPS_ORDER = [
        '長剣',
        '大剣',
        '太刀',
        '杖棒',
        '弓矢',
        '連弩',
        '戦斧',
        '騎槍',
        '投擲',
        '拳闘',
        '魔典',
        '大鎌',
      ];

      export const renderDMSoul = (s) => {
        const stars = '★'.repeat(s.rarity || 0) || '?';
        function affCell(name, aff) {
          const lv = String(aff?.level ?? 0);
          const label = _AFF_LABEL[lv] || '普通';
          const clr = _AFF_CLR[lv];
          const bdr = _AFF_BDR[lv];
          const atk = fmtAff(aff?.atk_effect);

          return min`
      <div class="sdm-aff-cell"${bdr ? ` style="border-color:${bdr}"` : ''}>

        <span class="sdm-aff-effect">×${atk} / ×${def}</span>
      </div>`;
        }
        const elemCells = _ELEMS_ORDER
          .map((n) => affCell(n, (s.element_affinity || {})[n]))
          .join('');
        const weapCells = _WEAPS_ORDER
          .map((n) => affCell(n, (s.weapon_affinity || {})[n]))
          .join('');
        const skills = _resolveSoulSkills(s);
        const skillCards = skills
          .map((sk) => {
            const tags = dmRightTags(sk);
            const bairitu = fmtBairitu(sk);
            return min`
      <div class="dm-skill-card">
        <div class="dm-skill-name-row">
          <span class="dm-skill-name">${escHtml(sk.name || '')}</span>${tags}
        </div>
        <div class="dm-skill-eff-row">
          <span class="dm-skill-eff">${escHtml(sk.effect_text || '')}</span>
          <span class="dm-skill-bairitu">${bairitu}</span>
        </div>
      </div>`;

          .join('');
        const acqEntries = Object.entries(s.acquisition || {});
        const acqHtml = acqEntries.length
          ? min`
    <div class="dm-section">
      <div class="dm-section-title">入手場所</div>
      <div class="sdm-acq-table">${acqEntries.map(([k, v]) => `<div class="sdm-acq-key">${escHtml(k)}</div><div class="sdm-acq-val">${escHtml(v)}</div>`).join('')}</div>
    </div>`
          : '';
        const tagsHtml = (s.tags || [])
          .map(
            (id) =>
              `<span class="bd-sp-tag" style="color:${SOUL_TAG_COLOR[id] || ''}">${SOUL_TAG[id] || id}</span>`,
          )
          .join('');
        return min`
    <div class="dm-chara-header">
      <img src="https://img.altema.jp/bxb/soul/icon/${s.id}.jpg" onerror="this.style.display='none'"
        style="width:80px;height:auto;border-radius:6px;flex-shrink:0" alt="">
      <div class="dm-chara-info">
        <div class="dm-chara-title">${escHtml(s.name)}</div>
        <div class="dm-chara-meta">
          <span class="dm-meta-chip" style="font-weight:700;letter-spacing:1px">${stars}</span>
          <span class="dm-meta-chip">Lv.${s.max_level || '?'}</span>
          ${s.url ? `<a class="dm-meta-chip" href="${s.url}" target="_blank" style="color:var(--accent);text-decoration:none">Altema ↗</a>` : ''}
        </div>
        ${tagsHtml ? `<div class="dm-chara-tags" style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px">${tagsHtml}</div>` : ''}
      </div>
    </div>
    <div class="dm-section"><div class="dm-section-title">属性相性</div><div class="sdm-aff-grid">${elemCells}</div></div>
    <div class="dm-section"><div class="dm-section-title">得意武器</div><div class="sdm-aff-grid">${weapCells}</div></div>
    ${skills.length ? min`<div class="dm-section"><div class="dm-section-title">スキル構成 (${skills.length})</div><div class="dm-skills-list">${skillCards}</div></div>` : ''}
    ${acqHtml}`;
      };

      // ===== BG DETAIL =====
      export const _bgScopeLabel = (e) => {
        if (e.scope === 3) {
          if (e.element != null) return (ELEMENT[e.element] || e.element) + '属性のみ';
          if (e.weapon != null) {
            const t = [].concat(e.weapon);
            return t.map((v) => WEAPON[v] || v).join('/') + 'のみ';
          }
        }
        if (e.scope === 5) return (e.name || '') + 'のみ';
        return '';
      };
      export const renderDMBg = (b) => {
        const effRows = (b.effects || [])
          .map((ef) => {
            const btags = (ef.bunrui || [])
              .map((bn) => `<span class="bunrui-tag">${BUNRUI_SHORT[bn] || bn}</span>`)
              .join('');
            const cond = ef.condition
              ? `<span class="cond-tag cond-${ef.condition}">${CONDITION[ef.condition] || ''}</span>`
              : '';
            const sl = _bgScopeLabel(ef);
            const scope = sl ? `<span class="scope-tag scope-lim">${escHtml(sl)}</span>` : '';
            const val =
              ef.bairitu != null
                ? `<span class="tag-val">${ef.calc_type === 1 ? '+' : '×'}${fmtLarge(ef.bairitu)}</span>`
                : '';
            return `<div class="bgdm-eff-line">${btags}${cond}${scope}${val}</div>`;
          })
          .join('');
        const fields = [];
        if (b.effect_text) fields.push(['効果', `<span>${escHtml(b.effect_text)}</span>`]);
        if (effRows) fields.push(['効果量', effRows]);
        if (b.time_start) fields.push(['期間', escHtml(b.time_start + '〜' + b.time_end)]);
        if (b.acquisition) fields.push(['入手方法', escHtml(b.acquisition)]);
        if (b.illustrator) fields.push(['イラスト', escHtml(b.illustrator)]);
        const fieldHtml = fields
          .map(
            ([k, v]) =>
              `<div class="bgdm-field-row"><div class="bgdm-field-key">${k}</div><div class="bgdm-field-val">${v}</div></div>`,
          )
          .join('');

    <div class="bgdm-layout">
      <div class="bgdm-fields">${fieldHtml || '<div style="color:var(--text2)">データなし</div>'}</div>
      <div class="bgdm-img-wrap">
        <img src="https://img.altema.jp/bxb/blade_graph/icon/${b.id}.jpg" onerror="this.style.display='none'" alt="">
        <div class="bgdm-img-rarity">★${b.rarity}</div>
      </div>
    </div>`;
      };

      // ===== MASOU DETAIL =====

        const effRows = (m.effects || [])

            const btags = (ef.bunrui || [])
              .map((bn) => `<span class="bunrui-tag">${BUNRUI_SHORT[bn] || bn}</span>`)
              .join('');
            const cond = ef.condition
              ? `<span class="cond-tag cond-${ef.condition}">${CONDITION[ef.condition] || ''}</span>`
              : '';
            const sl = _bgScopeLabel(ef);
            const scope = sl ? `<span class="scope-tag scope-lim">${escHtml(sl)}</span>` : '';
            const val =
              ef.bairitu != null
                ? `<span class="tag-val">${ef.calc_type === 1 ? '+' : '×'}${fmtLarge(ef.bairitu)}</span>`
                : '';
            return `<div class="bgdm-eff-line">${btags}${cond}${scope}${val}</div>`;
          })
          .join('');
        const fields = [];

        if (effRows) fields.push(['効果量', effRows]);

        if (m.chara_name) fields.push(['対応魔剣', escHtml(m.chara_name)]);
        const fieldHtml = fields
          .map(
            ([k, v]) =>
              `<div class="bgdm-field-row"><div class="bgdm-field-key">${k}</div><div class="bgdm-field-val">${v}</div></div>`,

          .join('');
        return min`
    <div class="bgdm-layout">
      <div class="bgdm-fields">${fieldHtml || '<div style="color:var(--text2)">データなし</div>'}</div>
      ${m.image ? `<div class="bgdm-img-wrap"><img src="${escHtml(m.image)}" onerror="this.style.display='none'" alt=""></div>` : ''}
    </div>`;
      };

      // ===== CRYSTAL DETAIL =====
      export const renderDMCrystal = (c) => {
        const fields = [];
        if (c.effect_text) fields.push(['効果', escHtml(c.effect_text)]);
        (c.effects || []).forEach((ef) => {
          if (ef.bairitu != null || ef.bairitu_init != null) {
            const pfx = ef.calc_type === 1 ? '+' : '×';
            const mn = ef.bairitu_init,
              mx = ef.bairitu;
            let range;
            if (mn != null && mx != null && mn !== mx) {
              range = pfx + fmtLarge(mn) + '～' + pfx + fmtLarge(mx);
            } else {
              range = pfx + fmtLarge(mn ?? mx);
            }
            const btags = (ef.bunrui || [])
              .map((b) => `<span class="bunrui-tag">${BUNRUI_SHORT[b] || b}</span>`)
              .join('');
            const scopeTag = fmtScopeTag(ef);
            fields.push([
              '効果量',
              `<div class="bgdm-eff-line">${btags}${scopeTag}<span class="tag-val">${range}</span></div>`,
            ]);
          }
          if (ef.condition)
            fields.push(['発動条件', escHtml(CONDITION[ef.condition] || String(ef.condition))]);
        });
        if (c['特殊条件']) fields.push(['特殊条件', escHtml(c['特殊条件'])]);
        if (c['対象']) fields.push(['対象', escHtml(c['対象'])]);
        if (c['上限値']) fields.push(['上限値', escHtml(c['上限値'])]);
        if (c['入手方法']) fields.push(['入手方法', escHtml(c['入手方法'])]);
        const fieldHtml = fields
          .map(
            ([k, v]) =>
              `<div class="bgdm-field-row"><div class="bgdm-field-key">${k}</div><div class="bgdm-field-val">${v}</div></div>`,
          )
          .join('');

      <div class="bgdm-fields">${fieldHtml || '<div style="color:var(--text2)">データなし</div>'}</div>

      </div>
    </div>`;
      };

          .filter((s) => stateKeys.includes(s))

          </div>`

        }
      </div>
    </div>`
          : '';
        const tagsHtml = (c.tags || [])
          .map((s) => `<span class="bd-sp-tag bd-sp-${s}">${CHARA_TAG[s] || s}</span>`)
          .join('');
        return min`
    <div class="dm-chara-header">
      <img class="dm-chara-icon" src="https://img.altema.jp/bxb/chara/icon/${c.id}.jpg" onerror="this.style.display='none'" alt="">

        <div class="dm-chara-title">${escHtml(c.name)}</div>

          <span class="dm-meta-chip">${wName}</span>

        </div>
        ${tagsHtml ? `<div class="dm-chara-tags" style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px">${tagsHtml}</div>` : ''}
      </div>

    ${contents}`;

      export const switchDMState = (label) => {
        document
          .querySelectorAll('.dm-state-tab')
          .forEach((t) => t.classList.toggle('active', t.dataset.state === label));
        document
          .querySelectorAll('.dm-state-content')
          .forEach((d) => d.classList.toggle('active', d.dataset.state === label));
      };

      export const renderDMState = (state, stateLabel, chara) => {
        const parts = [];
        const dead = new Set(
          chara && Array.isArray(chara._deleted_skills) ? chara._deleted_skills : [],
        );
        const baseSkills = (state.skills || []).filter((sk) => !dead.has(sk.name || ''));
        const addedSkills = (chara && chara._added_skills && chara._added_skills[stateLabel]) || [];
        const allSkills = baseSkills.concat(addedSkills);
        if (allSkills.length) {
          const cards = allSkills
            .map((s) => {
              const tags = dmRightTags(s);
              const bairitu = fmtBairitu(s);
              return min`
        <div class="dm-skill-card">
          <div class="dm-skill-name-row">
            <span class="dm-skill-name">${escHtml(s.name || '')}</span>${tags}
          </div>
          <div class="dm-skill-eff-row">
            <span class="dm-skill-eff">${escHtml(s.effect_text || '')}</span>
            <span class="dm-skill-bairitu">${bairitu}</span>
          </div>
        </div>`;
            })
            .join('');
          parts.push(
            `<div class="dm-section"><div class="dm-section-title">スキル構成 (${allSkills.length})</div><div class="dm-skills-list">${cards}</div></div>`,
          );
        }
        if (state.stats)
          parts.push(
            `<div class="dm-section"><div class="dm-section-title">ステータス</div>${renderDMStats(state.stats)}</div>`,
          );
        if (state.basic_info)
          parts.push(
            `<div class="dm-section"><div class="dm-section-title">基本情報</div>${renderDMBasicInfo(state.basic_info)}</div>`,
          );
        return parts.join('') || '<div style="color:var(--text2);padding:20px">データなし</div>';
      };

      export const dmRightTags = (s) => {
        let tags = '';
        (s.effects || []).forEach((e) => {
          (e.bunrui || []).forEach(
            (b) => (tags += `<span class="bunrui-tag">${BUNRUI_SHORT[b] || b}</span>`),
          );
          if (e.scope === 0) tags += `<span class="scope-tag scope-self">自</span>`;
          else if (e.scope === 1) tags += `<span class="scope-tag scope-all">全</span>`;
          else if (e.scope === 2 || e.scope === 3 || e.scope === 4) {
            const lim =
              e.element != null
                ? ELEMENT[[].concat(e.element)[0]] || '限'
                : e.weapon != null
                  ? WEAPON[[].concat(e.weapon)[0]] || '限'
                  : '限';
            tags += `<span class="scope-tag scope-lim">${lim}</span>`;
          } else if (e.scope === 5) tags += `<span class="scope-tag scope-lim">限</span>`;
          if (e.condition)
            tags += `<span class="cond-tag cond-${e.condition}">${CONDITION[e.condition] || ''}</span>`;
        });
        return `<div class="dm-skill-tags">${tags}</div>`;
      };

      export const renderDMStats = (stats) => {
        const max = stats.max || {},
          init = stats.initial || null;
        const cards = Object.keys(max)
          .map((k) => {
            const lbl =
              {
                HP: 'HP',
                攻撃力: '攻撃力',
                防御力: '防御力',
                ブレイク力: 'ブレイク力',
                フルヒット攻撃力: 'フルヒット',
              }[k] || k;
            const mv = max[k] != null ? Number(max[k]).toLocaleString('ja-JP') : '-';
            const iv = init && init[k] != null ? Number(init[k]).toLocaleString('ja-JP') : null;
            return min`
      <div class="dm-stat-card">
        <div class="dm-stat-label">${escHtml(lbl)}</div>
        <div class="dm-stat-row">
          <span class="dm-stat-row-lbl">最大</span>
          <span class="dm-stat-row-val">${mv}</span>
        </div>
        ${
          iv !== null
            ? min`
          <div class="dm-stat-row">
            <span class="dm-stat-row-lbl">初期</span>
            <span class="dm-stat-row-val init">${iv}</span>
          </div>`
            : ''
        }
      </div>`;

          .join('');

      export const renderDMBasicInfo = (info) => {
        const rows = Object.entries(info)
          .map(([k, v]) => {
            let dv;
            if (k === 'Hit数' && Array.isArray(v)) {
              const phases = v
                .map(
                  (n, i) =>
                    `<span class="dm-hit-phase">${n}</span>${i < v.length - 1 ? '<span class="dm-hit-arrow">-</span>' : ''}`,
                )

              dv = `<div class="dm-hit-phases">${phases}<span style="color:var(--text2);font-size:11px;margin-left:4px">合計${total}hit</span></div>`;
            } else dv = escHtml(String(v ?? '-'));

        document.getElementById('slot-' + i).innerHTML = `

            ${chara ? `<button class="em-detail-btn" onclick="openDetailModal(${chara.id},'chara',false)">詳細</button>` : ''}

      // ===== MOBILE SLOT FLIP =====
      let mobileActiveSlot = 0;
      let _txStart = 0,
        _tyStart = 0;
      const MOB_DUR = 200;

      export const isMob = () => {
        return window.innerWidth <= 760;
      };

      export const msiClick = (idx) => {
        if (idx >= teamSize) return;
        flipMobSlot(idx, idx > mobileActiveSlot ? 1 : -1);
      };

      export const updateMobIndicator = () => {
        document.querySelectorAll('.msi-dot').forEach((d, i) => {
          d.classList.toggle('active', i === mobileActiveSlot);
          d.classList.toggle('mob-disabled', i >= teamSize);
        });
      };

      export const updateMobVisible = () => {
        if (!isMob()) {
          for (let i = 0; i < 3; i++)
            document.getElementById('slot-' + i)?.classList.remove('mob-hidden');
          return;
        }
        for (let i = 0; i < 3; i++)
          document
            .getElementById('slot-' + i)
            ?.classList.toggle('mob-hidden', i !== mobileActiveSlot);
        updateMobIndicator();
      };

      const _MOB_ANIM = ['mob-anim-outL', 'mob-anim-outR', 'mob-anim-inR', 'mob-anim-inL'];
      export const _clearMobAnim = (el) => {
        _MOB_ANIM.forEach((c) => el.classList.remove(c));
      };

      export const flipMobSlot = (nextIdx, dir) => {
        // wrap around within enabled slots
        nextIdx = ((nextIdx % teamSize) + teamSize) % teamSize;
        if (nextIdx === mobileActiveSlot) return;
        const cur = document.getElementById('slot-' + mobileActiveSlot);
        const nxt = document.getElementById('slot-' + nextIdx);
        if (!cur || !nxt) return;
        const outCls = dir > 0 ? 'mob-anim-outL' : 'mob-anim-outR';
        const inCls = dir > 0 ? 'mob-anim-inR' : 'mob-anim-inL';
        _clearMobAnim(cur);
        cur.classList.add(outCls);
        cur.addEventListener('animationend', function h() {
          cur.removeEventListener('animationend', h);
          _clearMobAnim(cur);
          cur.classList.add('mob-hidden');
          _clearMobAnim(nxt);
          nxt.classList.remove('mob-hidden');
          nxt.classList.add(inCls);
          mobileActiveSlot = nextIdx;
          updateMobIndicator();
          nxt.addEventListener('animationend', function h2() {
            nxt.removeEventListener('animationend', h2);
            _clearMobAnim(nxt);
          });
        });
      };

      const _sGrid = document.getElementById('slots-grid');
      let _swipeBlocked = false;
      _sGrid.addEventListener(
        'touchstart',
        (e) => {
          _txStart = e.touches[0].clientX;
          _tyStart = e.touches[0].clientY;
          _swipeBlocked = !!e.target.closest('input[type=range]');
        },
        { passive: true },
      );
      _sGrid.addEventListener(
        'touchend',
        (e) => {
          if (!isMob() || _swipeBlocked) return;
          const dx = _txStart - e.changedTouches[0].clientX;
          const dy = Math.abs(_tyStart - e.changedTouches[0].clientY);
          if (Math.abs(dx) > 50 && Math.abs(dx) > dy * 1.5) {
            if (dx > 0) flipMobSlot(mobileActiveSlot + 1, 1);
            else flipMobSlot(mobileActiveSlot - 1, -1);
          }
        },
        { passive: true },
      );

      window.addEventListener('resize', updateMobVisible);

      // ===== STAT TRACE MODAL（IS_LOCAL_DEV のみ）=====
      // 各 stat の計算 trace を stage 別に展開表示。GitHub Pages では UI 入口無効・本ブロック全部 no-op。
      const _statTraceState = { slot: -1, statKey: '攻撃力', openStages: new Set() };

      const _STAT_TRACE_TABS = ['攻撃力', '防御力', 'HP', 'ブレイク力', 'Hit', 'ダメ上限'];

      const _fmtTraceVal = (v) => {
        if (v == null || !Number.isFinite(v)) return '-';
        if (Math.abs(v) >= 10000 || (Math.abs(v) > 0 && Math.abs(v) < 0.01))
          return v.toExponential(3);
        return (+v.toFixed(4)).toString();
      };
      const _fmtTraceStat = (v) => {
        if (v == null || !Number.isFinite(v)) return '-';
        if (Math.abs(v) >= 1e13) return v.toExponential(4);
        return Math.round(v * 100) / 100 < 1
          ? (+v.toFixed(4)).toString()
          : Math.round(v).toLocaleString('en-US');
      };
      const _opSymbol = (op) => {
        if (op === 'add' || op === 'final-add') return '+';
        if (op === 'mul' || op === 'final-mul') return '×';
        return op;
      };

      // Hit tab は 3 stage hits + total を 1 view に統合表示するため特別扱い。
      const _statTraceMatch = (step, statKey) => {
        if (statKey === 'Hit') return /^Hit[123]$/.test(step.stat);
        return step.stat === statKey;
      };

      const _statTraceFinalValue = (trace, statKey) => {
        if (!trace) return null;
        if (statKey === 'Hit') return null; // hit は array なので別途
        if (statKey === 'ダメ上限') {
          let last = trace.damageLimitBase;
          for (const st of trace.stages)
            for (const s of st.steps) if (s.stat === 'ダメ上限') last = s.after;
          return last;
        }
        let last = trace.base[statKey];
        for (const st of trace.stages)
          for (const s of st.steps) if (s.stat === statKey) last = s.after;
        return last;
      };

      const _statTraceBase = (trace, statKey) => {
        if (!trace) return 0;
        if (statKey === 'Hit') return 0;
        if (statKey === 'ダメ上限') return trace.damageLimitBase;
        return trace.base[statKey] || 0;
      };

      export const openStatTrace = (si, statKey) => {
        if (!IS_LOCAL_DEV) return;
        _statTraceState.slot = si;
        _statTraceState.statKey = statKey;
        _statTraceState.openStages = new Set(); // 全 stage 折りたたみで開始
        const r = _lastTrace[si];
        const c = allCharas.find((x) => x.id === team[si].chara);
        const title = document.getElementById('stat-trace-title');
        if (title) title.textContent = `Slot${si + 1}  ${c?.name || ''} — 計算明細`;
        _renderStatTraceTabs();
        _renderStatTraceBody();
        document.getElementById('stat-trace-modal').classList.add('open');
      };

      export const closeStatTrace = () => {
        const el = document.getElementById('stat-trace-modal');
        if (el) el.classList.remove('open');
      };

      export const setStatTraceTab = (statKey) => {
        _statTraceState.statKey = statKey;
        _statTraceState.openStages = new Set();
        _renderStatTraceTabs();
        _renderStatTraceBody();
      };

      export const toggleStatTraceStage = (key) => {
        if (_statTraceState.openStages.has(key)) _statTraceState.openStages.delete(key);
        else _statTraceState.openStages.add(key);
        _renderStatTraceBody();
      };

      const _renderStatTraceTabs = () => {
        const cur = _statTraceState.statKey;
        const html = _STAT_TRACE_TABS
          .map((k) => {
            const label =
              k === '攻撃力' ? '攻撃力' : k === 'ブレイク力' ? 'BK' : k === 'Hit' ? 'Hit数' : k;
            return `<button class="${cur === k ? 'on' : ''}" onclick="setStatTraceTab('${k}')">${label}</button>`;
          })
          .join('');
        document.getElementById('stat-trace-tabs').innerHTML = html;
      };

      const _renderStatTraceBody = () => {
        const si = _statTraceState.slot;
        const statKey = _statTraceState.statKey;
        const r = _lastTrace[si];
        const body = document.getElementById('stat-trace-body');
        if (!r || !r.trace) {
          body.innerHTML = '<div style="padding:20px;color:var(--text2)">trace なし</div>';
          return;
        }
        const trace = r.trace;

        // Hit tab は 3 stage の hits を並べる
        if (statKey === 'Hit') {
          let html = `<div class="trace-base">Base hits: [${(trace.hitsBase || []).join(', ')}]</div>`;
          for (const stage of trace.stages) {
            const hitSteps = stage.steps.filter((s) => /^Hit[123]$/.test(s.stat));
            if (!hitSteps.length) continue;
            const open = _statTraceState.openStages.has(stage.key);
            html += `<div class="trace-stage">
        <div class="trace-stage-head" onclick="toggleStatTraceStage('${stage.key}')">
          <span><span class="arrow">${open ? '▼' : '▶'}</span> ${escHtml(stage.label)}</span>
          <span class="trace-stage-tot">${hitSteps.length} 件</span>
        </div>`;
            if (open) {
              html += hitSteps
                .map(
                  (s) => `<div class="trace-step">
          <span class="src" title="${escHtml(s.src)}">${escHtml(s.src)} [${s.stat}]</span>
          <span class="op">${_opSymbol(s.op)}</span>
          <span class="val">${_fmtTraceVal(s.val)}</span>
          <span class="after">${s.before} → ${s.after}</span>
        </div>`,
                )
                .join('');
            }
            html += `</div>`;
          }
          const finalHits = r.hits.map((h) => Math.floor(+h || 0));
          html += `<div class="trace-final">最終 hits: [${finalHits.join(', ')}]  合計 ${finalHits.reduce((a, b) => a + b, 0)}</div>`;
          body.innerHTML = html;
          return;
        }

        const base = _statTraceBase(trace, statKey);
        const finalVal = _statTraceFinalValue(trace, statKey);
        let html = `<div class="trace-base">${escHtml(statKey)} base: ${_fmtTraceStat(base)}</div>`;

        for (const stage of trace.stages) {
          const steps = stage.steps.filter((s) => _statTraceMatch(s, statKey));
          const isEmpty = steps.length === 0;
          const open = _statTraceState.openStages.has(stage.key);
          const stageBefore = isEmpty ? null : steps[0].before;
          const stageAfter = isEmpty ? null : steps[steps.length - 1].after;
          const headRight = isEmpty
            ? '<span class="trace-stage-tot">（無し）</span>'
            : `<span class="trace-stage-tot">${_fmtTraceStat(stageBefore)} → ${_fmtTraceStat(stageAfter)}</span>`;
          html += `<div class="trace-stage${isEmpty ? ' empty' : ''}">
      <div class="trace-stage-head" onclick="toggleStatTraceStage('${stage.key}')">
        <span><span class="arrow">${open ? '▼' : '▶'}</span> ${escHtml(stage.label)}</span>
        ${headRight}
      </div>`;
          if (open && !isEmpty) {
            html += steps
              .map(
                (s) => `<div class="trace-step">
        <span class="src" title="${escHtml(s.src)}">${escHtml(s.src)}</span>
        <span class="op">${_opSymbol(s.op)}</span>
        <span class="val">${_fmtTraceVal(s.val)}</span>
        <span class="after">${_fmtTraceStat(s.before)} → ${_fmtTraceStat(s.after)}</span>
      </div>`,
              )
              .join('');
          }
          html += `</div>`;
        }

        // 最終 + sanity check
        const displayed =
          statKey === '攻撃力'
            ? r.stats['攻撃力']
            : statKey === 'ダメ上限'
              ? r.damageLimit
              : r.stats[statKey];
        const mismatch =
          displayed != null && finalVal != null && Math.abs(displayed - finalVal) > 1e-3;
        html += `<div class="trace-final">最終: ${_fmtTraceStat(finalVal)}${mismatch ? '  ⚠ 表示値 ' + _fmtTraceStat(displayed) + ' と不一致' : '  ✓'}</div>`;
        if (statKey === '攻撃力') {
          html += `<div class="trace-final" style="opacity:.7;font-weight:400">攻撃力 min = max × 0.95 = ${_fmtTraceStat(finalVal * 0.95)}</div>`;
        }
        body.innerHTML = html;
      };

      // IS_LOCAL_DEV のみ stat-trace modal を body 末尾に注入
      if (IS_LOCAL_DEV) {
        document.body.insertAdjacentHTML(
          'beforeend',

    <div class="stat-trace-body" id="stat-trace-body"></div>
  </div>
</div>`,
        );
      }
