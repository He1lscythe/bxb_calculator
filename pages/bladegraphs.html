  <script type="module">
    import { loadBladegraphs } from '../shared/data-loader.js';
    import { RARITY_LABEL, ELEMENT_LABEL, WEAPON_LABEL } from '../shared/constants.js';
    import * as fc from '../shared/filter-core.js';
    import { bgIcon, imgWithFallback } from '../shared/image-paths.js';

    const state = { rarity: new Set(), search: '' };
    let all = []; let selected = null;
    const $ = (id) => document.getElementById(id);

    async function init() {
      all = await loadBladegraphs();
      fc.renderToggles($('f-rarity'), 'rarity', fc.rarityOptions(), state, render);
      $('search').oninput = (e) => { state.search = e.target.value; render(); };
      render();
    }
    function render() {
      const filtered = fc.applyFilterSort(all, state, { rarity: 'rarity' }, 'rarity', 'desc');
      $('count').textContent = filtered.length;
      $('list').innerHTML = filtered.map((b) => `<div class="item ${selected===b.id?'selected':''}" data-id="${b.id}">
        ${imgWithFallback(bgIcon(b.id), b.name)}
        <div><span class="rarity-${b.rarity}">${RARITY_LABEL[b.rarity]}</span><br><b>${b.name}</b><br>

      </div>`).join('');
      $('list').onclick = (e) => {
        const el = e.target.closest('.item'); if (!el) return;
        selected = +el.dataset.id;
        renderDetail(all.find((x) => x.id === selected)); render();
      };
    }
    function renderDetail(b) {
      if (!b) return;
      const skills = (b.skills||[]).map(s => `<li>${s.parameter}/${s.math_type}/${s.value} range=${s.range} ${s.element_id?'/elem='+ELEMENT_LABEL[s.element_id]:''}${s.weapon_type_id?'/weapon='+WEAPON_LABEL[s.weapon_type_id]:''}<br><small>${s.description||''}</small></li>`).join('');
      $('detail').innerHTML = `${imgWithFallback(bgIcon(b.id), b.name)}
        <h2>${b.name}</h2><p>${RARITY_LABEL[b.rarity]} / id=${b.id} / by ${b.author_name||'-'}</p>
        <p style="font-size:11px;opacity:0.7">${b.description||''}</p>
        <h3>スキル (${(b.skills||[]).length})</h3><ul style="font-size:11px">${skills}</ul>`;
    }
