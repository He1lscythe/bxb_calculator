<style>
  body { margin:0; background:#efe6d2; font-family:"Meiryo","Segoe UI",sans-serif; }
  #bar { position:fixed; top:10px; left:50%; transform:translateX(-50%); z-index:5;
          background:#c9bfa3; border:2px solid #8a7d5c; border-radius:10px; padding:6px 16px;
          box-shadow:0 2px 6px rgba(0,0,0,.2); display:flex; align-items:center; gap:10px; }
  #bar b { color:#3b2f17; font-size:16px; }
  #sel { font-size:16px; font-weight:bold; color:#3b2f17; background:#fdf6e3;
          border:1.5px solid #8a7d5c; border-radius:7px; padding:5px 10px; cursor:pointer; }
  #bar button { font-size:13px; font-weight:bold; color:#3b2f17; background:#fdf6e3;
          border:1.5px solid #8a7d5c; border-radius:7px; padding:5px 9px; cursor:pointer; }
  #bar button:hover { background:#fff; }
  #modebtn.on { background:#27ae60; color:#fff; border-color:#1e8449; }
  .ibtn { display:none; }
  body.imode .ibtn { display:inline-block; }
  #wrap { overflow:auto; height:100vh; }
  .page svg { display:block; }
  .node { cursor:pointer; }
  .stub { cursor:default; }
  .stub.exit { cursor:pointer; }
  .stub.exit:hover rect { stroke:#2980ff !important; stroke-width:2.5 !important; }
  .copied rect { stroke:#27ae60 !important; stroke-width:4.5 !important; filter:drop-shadow(0 0 5px #27ae60); }
  #tip { position:fixed; display:none; z-index:10; background:#2c3e50; color:#fff;
          padding:6px 9px; border-radius:6px; font-size:12.5px; box-shadow:0 2px 8px rgba(0,0,0,.3);
          white-space:pre; width:max-content; max-width:560px;
          font-family:"Consolas","MS Gothic",monospace; line-height:1.45; }   /* 等宽 → 多行 id 前缀对齐, 关名首字对齐 */
  .tiphead { font-weight:bold; opacity:.85; margin-bottom:4px; }
  .tipq { cursor:pointer; padding:2px 5px; border-radius:4px; white-space:pre; }
  .tipq:hover { background:#16a085; }
  .node rect, .stub rect, .stub circle { transition:all .12s; }
  .hl rect, .hl circle { stroke:#e74c3c !important; stroke-width:4 !important; filter:drop-shadow(0 0 6px #e74c3c); }
  .dim { opacity:.25; }
  .land rect { animation:land 1.6s ease-out; }
  @keyframes land { 30%,60%{ stroke:#2980ff; stroke-width:5; filter:drop-shadow(0 0 9px #2980ff); } }
  /* 交互模式:未解锁关整体变灰;已通关关绿光 */
  body.imode .node.ilock { opacity:.85; }
  body.imode .node.ilock > text:not(.imk-lock) { opacity:1; }   /* 文字保持清晰,压过身后的锁水印(不含锁本身) */
  body.imode .node.idone rect { filter:drop-shadow(0 0 3px #27ae60); }
  .imark, .imk-lock { display:none; }
  body.imode .imark { display:block; }

<script>
const sel=document.getElementById('sel');
const wrap=document.getElementById('wrap');
const pages=[...document.querySelectorAll('.page')];
const layerIdx={"\u7b2c\u96f6\u5c64\u30e6\u30b0\u30c9\u30e9\u30b7\u30eb\u7981\u5fcc\u9818\u57df":0,"\u7b2c\u58f1\u5c64\u30a2\u30d6\u30bd\u30ea\u30e5\u30fc\u30c8\u5236\u5fa1\u533a\u753b":1,"\u7b2c\u5f10\u5c64\u30e2\u30ce\u30ea\u30b9\u7ba1\u7406\u03b1\u533a\u753b":2,"\u7b2c\u5f10\u5c64\u30e2\u30ce\u30ea\u30b9\u7ba1\u7406\u03b2\u533a\u753b":3,"\u7b2c\u5f10\u5c64\u30e2\u30ce\u30ea\u30b9\u7ba1\u7406\u03a9\u533a\u753b":4,"\u7b2c\u53c2\u5c64\u30da\u30b7\u30a7\u5ec3\u68c4\u57f9\u990a\u5ba4":5,"\u7b2c\u53c2\u5c64\u30da\u30b7\u30a7A\u7a2e\u57f9\u990a\u5ba4":6,"\u7b2c\u53c2\u5c64\u30da\u30b7\u30a7\u8a66\u4f5c\u5b9f\u9a13\u5ba4":7,"\u7b2c\u53c2\u5c64\u30da\u30b7\u30a7B\u7a2e\u57f9\u990a\u5ba4":8,"\u7b2c\u53c2\u5c64\u30da\u30b7\u30a7C\u7a2e\u57f9\u990a\u5ba4":9,"\u9b54\u9375\u4e2d\u67a2\u7a7a\u9593":10};
const BWh=105.0, BHh=25.0;
function show(i){ pages.forEach((p,k)=>p.style.display = (k==i?'block':'none')); wrap.scrollTo(0,0); }
sel.addEventListener('change',()=>show(+sel.value));
sel.selectedIndex=0; show(0);            // 刷新时下拉框与页面都归到第 1 个地图(浏览器会记忆 select 值)

// 跨页跳转:切到目标页(按层名或页索引),并滚动+高亮目标副本
function gotoPageIdx(i, qid){
  if(i===undefined || i<0) return;
  sel.value=i; show(i);
  if(!qid) return;
  const node=document.querySelector('#page'+i+' [data-qid="'+qid+'"]');
  if(!node) return;
  const r=node.querySelector('rect');
  const x=parseFloat(r.getAttribute('x')), y=parseFloat(r.getAttribute('y'));
  wrap.scrollTo({left:x-wrap.clientWidth/2+BWh, top:y-wrap.clientHeight/2+BHh, behavior:'smooth'});
  node.classList.add('land'); setTimeout(()=>node.classList.remove('land'),1600);
}
function gotoLayer(layer, qid){ gotoPageIdx(layerIdx[layer], qid); }
document.querySelectorAll('.stub.exit').forEach(el=>{
  el.addEventListener('click',()=>gotoLayer(el.dataset.gotoLayer, el.dataset.gotoQid));
});

// 点击 node → 复制它的 id/名称/魂/称号(SVG 文字 Ctrl+C 复制不可靠,故用点击复制)
function copyText(s){
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(s).catch(()=>fbCopy(s)); }
  else fbCopy(s);
}
function fbCopy(s){
  const ta=document.createElement('textarea'); ta.value=s;
  ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta);
  ta.select(); try{ document.execCommand('copy'); }catch(e){} document.body.removeChild(ta);
}
document.querySelectorAll('.node').forEach(el=>{
  el.addEventListener('click',()=>{
    const c=el.dataset.copy; if(!c) return;
    copyText(c);
    el.classList.add('copied'); setTimeout(()=>el.classList.remove('copied'),800);
  });
});

function rel(el){
  const root=el.closest('.page')||document;
  const out=new Set();
  const u=el.dataset.unlock; if(u) u.split(' ').forEach(s=>{ if(s) root.querySelectorAll('[data-qid="'+s+'"]').forEach(t=>out.add(t)); });
  const ub=el.dataset.unlockedBy; if(ub) ub.split(' ').forEach(s=>{ if(s) root.querySelectorAll('[data-qid="'+s+'"]').forEach(t=>out.add(t)); });
  // 同页回环高亮只单向:hover 跳转格(.stub[data-ref]) → 高亮目标字母 node;hover 字母 node 不反向高亮跳转格。
  const rf=el.dataset.ref; if(rf) root.querySelectorAll('[data-letter="'+rf+'"]').forEach(t=>out.add(t));
  return out;
}
const tip=document.getElementById('tip'); let tipT=null;
document.querySelectorAll('.stub').forEach(el=>{      // node 不再整体 hover 高亮;解锁互动只在锁标上(见下方 .lockicon)
  el.addEventListener('mouseenter',()=>{
    const hot=rel(el); hot.add(el);
    const sib=[...(el.closest('.page')||document).querySelectorAll('.node,.stub')];
    if(hot.size>1) sib.forEach(t=>{ if(!hot.has(t)) t.classList.add('dim'); });
    hot.forEach(t=>t.classList.add('hl'));
    const tt=el.dataset.tip;
    if(tt){ tipT=setTimeout(()=>{                       // 300ms 后显示自定义 tooltip
      const r=el.querySelector('rect').getBoundingClientRect();
      tip.textContent=tt; tip.style.left=r.left+'px'; tip.style.top=(r.bottom+6)+'px'; tip.style.display='block';
    },300); }
  });
  el.addEventListener('mouseleave',()=>{
    document.querySelectorAll('.hl').forEach(t=>t.classList.remove('hl'));
    document.querySelectorAll('.dim').forEach(t=>t.classList.remove('dim'));
    clearTimeout(tipT); tip.style.display='none';
  });
});
// ソウル/称号:点击对应文字才显示名称(不触发 node 复制);点别处关闭。
document.querySelectorAll('.kv').forEach(el=>{
  el.addEventListener('click',(e)=>{ e.stopPropagation();
    const r=el.getBoundingClientRect();
    tip.textContent=el.dataset.kv; tip.style.left=r.left+'px'; tip.style.top=(r.bottom+6)+'px'; tip.style.display='block';
  });
});
function clearHL(){
  document.querySelectorAll('.hl').forEach(t=>t.classList.remove('hl'));
  document.querySelectorAll('.dim').forEach(t=>t.classList.remove('dim'));
}
// 点击页面任意其他位置 → 关闭弹框 + 清高亮(kv / 锁标 / 框内条目 click 均 stopPropagation,不会被这条误关)
document.addEventListener('click',()=>{ tip.style.display='none'; tipOwner=null; clearHL(); });
function escHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
// 同页:高亮「开门人 node ↔ 目标关」一对关系,并滚到目标
function highlightPair(owner, qid){
  const root=owner.closest('.page')||document;
  clearHL();
  const tgt=root.querySelector('[data-qid="'+qid+'"]');
  const hot=new Set([owner]); if(tgt) hot.add(tgt);
  root.querySelectorAll('.node,.stub').forEach(t=>{ if(!hot.has(t)) t.classList.add('dim'); });
  hot.forEach(t=>t.classList.add('hl'));
  if(tgt){ const rc=tgt.querySelector('rect');
    const x=parseFloat(rc.getAttribute('x')), y=parseFloat(rc.getAttribute('y'));
    wrap.scrollTo({left:x-wrap.clientWidth/2+BWh, top:y-wrap.clientHeight/2+BHh, behavior:'smooth'}); }
}
// 锁标 🔑(开门人侧)/🔓(被开侧):点击弹出条件框;框内每一关可点击 —— 同页高亮关系,跨页跳转。
let tipOwner=null;
function showCondTip(el){
  if(tipOwner===el && tip.style.display==='block'){ tip.style.display='none'; tipOwner=null; clearHL(); return; }  // 再点同一个=收起
  clearHL();
  const owner=el.closest('.node');
  const curPage=pages.findIndex(p=>p.style.display!=='none');
  let entries=[]; try{ entries=JSON.parse(el.dataset.entries||'[]'); }catch(e){}
  let h='<div class="tiphead">'+escHtml(el.dataset.head||'')+'</div>';
  if(!entries.length) h+='<div class="tipq" style="cursor:default">（なし）</div>';
  entries.forEach(en=>{
    const cross=(en.p!==curPage);
    h+='<div class="tipq" data-q="'+en.q+'" data-p="'+(en.p===null?'':en.p)+'">'
       +(cross?'⇥ ':'• ')+escHtml(en.t)+(cross?'　▶他ページへ':'')+'</div>';
  });
  tip.innerHTML=h;
  const r=el.getBoundingClientRect();
  tip.style.left=r.left+'px'; tip.style.top=(r.bottom+6)+'px'; tip.style.display='block';
  tipOwner=el;
  tip.querySelectorAll('.tipq[data-q]').forEach(row=>{
    row.addEventListener('click',(e)=>{
      e.stopPropagation();
      const q=row.dataset.q, p=(row.dataset.p===''?undefined:+row.dataset.p);
      if(p===curPage){ highlightPair(owner, q); }                              // 同页:高亮关系,框保留以便连点
      else { gotoPageIdx(p, q); tip.style.display='none'; tipOwner=null; }     // 跨页:跳转(换页→收起框)
    });
  });
}
document.querySelectorAll('.lockicon').forEach(el=>{
  el.addEventListener('click',(e)=>{ e.stopPropagation(); showCondTip(el); });
});

function refreshAll(){ ALLNODES.forEach(renderBadge);
  const u=ALLNODES.filter(n=>cleared.has(+n.dataset.qid)).length;
  document.getElementById('cnt').textContent='済 '+u+' / '+ALLNODES.length; }
function onBadge(node){
  const q=+node.dataset.qid;
  if(cleared.has(q)) cleared.delete(q);
  else if(isUnlocked(q)) cleared.add(q);
  else return;                                  // 🔒 锁着,不可点
  save(); refreshAll();
}
function save(){ try{ localStorage.setItem(STORE, JSON.stringify([...cleared])); }catch(e){} }
function load(){ try{ cleared=new Set((JSON.parse(localStorage.getItem(STORE)||'[]')).map(Number)); }catch(e){ cleared=new Set(); } }
const modebtn=document.getElementById('modebtn');
function setMode(on){
  IMODE=on; document.body.classList.toggle('imode', on);
  modebtn.classList.toggle('on', on);
  modebtn.textContent = on ? '🗺 表示モードへ' : '✏ 編集モード';
  if(on){ ALLNODES.forEach(ensureBadge); refreshAll(); }
  else { ALLNODES.forEach(n=>n.classList.remove('ilock','idone'));
          document.querySelectorAll('.imk-lock').forEach(b=>b.style.display='none'); }   // 退出编辑→隐藏水印
}
modebtn.addEventListener('click',()=>setMode(!IMODE));
document.getElementById('rstbtn').addEventListener('click',()=>{
  if(confirm('進捗を全てリセットしますか?')){ cleared=new Set(); save(); refreshAll(); }
});
document.getElementById('expbtn').addEventListener('click',()=>{
  const data=JSON.stringify([...cleared].sort((a,b)=>a-b));
  const blob=new Blob([data],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='bxb_dungeon_progress.json'; document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
});
document.getElementById('impbtn').addEventListener('click',()=>{
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; const rd=new FileReader();
    rd.onload=()=>{ try{ cleared=new Set((JSON.parse(rd.result)).map(Number)); save(); refreshAll(); }
                    catch(e){ alert('JSON 解析に失敗しました'); } };
    rd.readAsText(f); };
  inp.click();
});
load();   // 启动读取上次进度(編集モードに入った時に反映)
</script></body></html>
