<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>記憶結晶 — v2</title>
  <link rel="stylesheet" href="../css/v2.css" />
</head>
<body>
  <header>
    <a href="characters.html">魔剣</a>
    <a href="souls.html">ソウル</a>
    <a href="crystals.html">記憶結晶</a>
    <a href="bladegraphs.html">心象結晶</a>
    <a href="hensei.html">編成</a>
    <span style="float:right;font-size:11px;opacity:0.6">v2 / master_tables</span>
  </header>
  <main>
    <aside>
      <h3>検索</h3><input type="text" id="search" placeholder="名前..." />
      <div id="filters"></div>
      <p style="font-size:11px;opacity:0.6"><span id="count">-</span> 件</p>
    </aside>
    <section id="list"></section>
    <article id="detail"><p style="opacity:0.6">結晶を選択</p></article>
  </main>
  <script type="module">
    import { loadCrystals } from '../shared/data-loader.js';
    import { RARITY_LABEL, ELEMENT_LABEL, WEAPON_LABEL } from '../shared/constants.js';
    import { applySpec, renderSpecFilters } from '../shared/filter-core.js';
    import { crystalSpec } from '../shared/crystal-spec.js';
    import { crystalIcon, imgWithFallback } from '../shared/image-paths.js';

    const state = { search: '', sort: 'rarity', dir: 'desc' };
    let all = []; let selected = null;
    const $ = (id) => document.getElementById(id);

    async function init() {
      all = await loadCrystals();
      renderSpecFilters($('filters'), crystalSpec, state, render);
      $('search').oninput = (e) => { state.search = e.target.value; render(); };
      render();
    }
    function render() {
      const filtered = applySpec(all, crystalSpec, state);
      $('count').textContent = filtered.length;
      $('list').innerHTML = filtered.slice(0, 500).map((c) => `<div class="item ${selected===c.id?'selected':''}" data-id="${c.id}">
        ${imgWithFallback(crystalIcon(c.id), c.name)}
        <div><span class="rarity-${c.rarity}">${RARITY_LABEL[c.rarity]}</span> ${ELEMENT_LABEL[c.element_id]||''}${WEAPON_LABEL[c.weapon_type_id]||''}<br><b>${c.name}</b></div>
      </div>`).join('') + (filtered.length > 500 ? `<p style="opacity:0.6">+${filtered.length-500} more (絞り込んでください)</p>` : '');
      $('list').onclick = (e) => {
        const el = e.target.closest('.item'); if (!el) return;
        selected = +el.dataset.id;
        renderDetail(all.find((x) => x.id === selected)); render();
      };
    }
    function renderDetail(c) {
      if (!c) return;
      const mx = c.max_value !== null ? `${c.initial_value} ~ ${c.max_value}` : `${c.initial_value} ~ <i style="opacity:0.5">(max 未取得)</i>`;
      // 同名「隠し」拆分技能 (user 决策: 保持单 bunrui per skill bar、隠し 半透明)
      const sameName = all.filter(x => x.name === c.name);
      const sub = sameName.filter(x => x.id !== c.id).slice(0, 5);
      const subH = sub.length ? `<h3>同名 (隠し)</h3><ul style="font-size:11px;opacity:0.5">
        ${sub.map(x => `<li>${x.parameter} / ${x.math_type} / ${x.initial_value}${x.max_value?'→'+x.max_value:''}</li>`).join('')}
        </ul>` : '';
      $('detail').innerHTML = `${imgWithFallback(crystalIcon(c.id), c.name)}
        <h2>${c.name}</h2>
        <p>${RARITY_LABEL[c.rarity]} / ${ELEMENT_LABEL[c.element_id]||''}${WEAPON_LABEL[c.weapon_type_id]||''} / id=${c.id}</p>
        <p><b>${c.parameter}</b> / ${c.math_type||'(NoEffect)'} / lv max ${c.max_level}</p>
        <p>倍率: ${mx} (rank ${c.initial_value_rank||'-'})</p>
        <p style="font-size:11px;opacity:0.6">weight_step: <i>解包未提供、Phase 7 edit 时手动添加</i></p>
        <p style="font-size:11px;opacity:0.6">purity_step: <i>同上</i></p>
        <p style="font-size:11px;opacity:0.8">${c.description||''}</p>
        ${subH}`;
    }
    init();
  </script>
</body>
</html>
