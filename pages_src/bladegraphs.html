<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>BxB 心象結晶データベース</title>
    {{include _head.html}}
    <link rel="stylesheet" href="../css/bladegraphs.css" />
  </head>
  <body>
    {{include _loading.html}}

    <div id="page-wrap">
      <div id="content">
        <div id="filters">
          <div class="mob-search-row">
            <input
              type="text"
              id="search"
              placeholder="🔍 心象結晶名で検索..."
              oninput="applyFilters()"
            />
            <span id="bg-count-mob"></span>
          </div>
          <div class="mob-toolbar">
            <button class="filter-toggle-btn" id="filter-toggle-btn" onclick="toggleFilters()">
              ▼ 絞り込み
            </button>
            <button class="toolbar-btn" onclick="expandAll()">全展開</button>
            <button class="toolbar-btn" onclick="collapseAll()">全収起</button>
            <button class="toolbar-btn" onclick="resetFilters()">リセット</button>
          </div>
          <div id="filters-body">
            <div class="filter-row2">
              <div class="filter-section">
                <div class="filter-label">レア度</div>
                <div class="filter-toggles" id="f-rarity"></div>
              </div>

              <div class="filter-section">
                <div class="filter-label">属性</div>
                <div class="filter-toggles" id="f-element"></div>
              </div>
            </div>

            <div class="filter-section">
              <div class="filter-label">武器</div>
              <div class="filter-toggles" id="f-weapon"></div>
            </div>

            <div class="filter-section">
              <div class="filter-label">効果</div>
              <div class="filter-toggles" id="f-effect"></div>
            </div>

            <div class="filter-section">
              <div class="filter-label">条件（対象）</div>
              <div class="filter-toggles" id="f-scope"></div>
            </div>

            <div class="filter-section">
              <div class="filter-label">条件（発動）</div>
              <div class="filter-toggles" id="f-condition_trigger"></div>
            </div>
          </div>
          <!-- #filters-body -->
          <div class="desktop-bottom">
            <div id="bg-count"></div>
            <div style="display: flex; gap: 6px">
              <button onclick="expandAll()" class="toolbar-btn">全展開</button>
              <button onclick="collapseAll()" class="toolbar-btn">全収起</button>
              <button onclick="resetFilters()" class="toolbar-btn">リセット</button>
            </div>
          </div>
        </div>
        <div id="bg-list"></div>
      </div>
    </div>

    <script type="module">
      import { Nav, updateReviseBar } from '../js/nav.js';
      import { state } from '../js/bg-state.js';
      import { escHtml, parseBairituVal, hideLoading } from '../js/utils.js';
      import { deepApply } from '../shared/revise-core.js';
      import {
        initFilterToggles,
        toggleFilters,
        collapseFiltersOnScroll,
        toggleFilter,
        expandAll,
        collapseAll,
        resetFilters,
        applyFilters,
        toggleExpand,
      } from '../js/bg-list.js';
      // Phase 7 Session 1: 删 js/bg-edit.js import、Phase 7 不复活 bg edit (master 数据 100% 准确、无 server-fold 字段需补)
      import { adaptBgList } from '../shared/bg-adapter.js';

      Nav.init();

      // ===== DATA LOAD (master schema → wiki adapter) =====
      document.addEventListener('DOMContentLoaded', () => {
        initFilterToggles();
        Promise.all([
          fetch('../data/bladegraphs.json').then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }),
          fetch('../data/bg_revise.json').then((r) => r.ok ? r.json() : []).catch(() => []),
        ])
          .then(([arr, revise]) => {
            state.allBG = adaptBgList(arr, revise);
            state.allBG.forEach((c) => {
              if (!state.originalData[c.id])
                state.originalData[c.id] = JSON.parse(JSON.stringify(c));
            });
            applyFilters();
            hideLoading();
          })
          .catch(() => { applyFilters(); hideLoading(); });
      });

      // 「絞り込み」展開中の user-initiated scroll でのみ collapse — touchmove (mobile) / wheel (desktop)。
      // scroll 事件は使わない：filter 操作後の list 高さ変化による浏览器 auto-clamp scrollY を user スクロールと誤判するため。
      window.addEventListener('touchmove', collapseFiltersOnScroll, { passive: true });
      window.addEventListener('wheel', collapseFiltersOnScroll, { passive: true });

      window.state = state;
      Object.assign(window, {
        applyFilters,
        toggleFilter,
        expandAll,
        collapseAll,
        resetFilters,
        toggleFilters,
        toggleExpand,
        // Phase 7 Session 1: 删 edit 函数引用、view-only 期靠下方 _noop stub
        updateReviseBar,
        escHtml,
        parseBairituVal,
      });

      // ===== Phase 6 view-only: edit 操作全 no-op =====
      const _noop = () => {};
      Object.assign(window, {
        enterEditMode: _noop, cancelEdit: _noop, saveEdit: _noop, saveRevise: _noop,
        reRenderBgEdit: _noop,
        toggleBladeBunrui: _noop, toggleBladeElement: _noop, toggleBladeType: _noop,
        setBladeHitStage: _noop, setBladeHitStageScaling: _noop,
        setBladeScope: _noop, addBladeEffect: _noop, removeBladeEffect: _noop,
      });
    </script>
  </body>
</html>
