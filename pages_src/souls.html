<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ソウル — v2</title>
  <link rel="stylesheet" href="../css/v2.css" />
</head>
<body>
  <header>
    <a href="characters.html">魔剣</a>
    <a href="souls.html">ソウル</a>
    <a href="crystals.html">記憶結晶</a>
    <a href="bladegraphs.html">心象結晶</a>
    <a href="hensei.html">編成</a>
    <span style="float:right;font-size:11px;opacity:0.6">v2 / master_tables</span>
  </header>
  <main>
    <aside>
      <h3>検索</h3><input type="text" id="search" placeholder="名前..." />
      <h3>★</h3><div id="f-rarity"></div>
      <p style="font-size:11px;opacity:0.6"><span id="count">-</span> 件</p>
    </aside>
    <section id="list"></section>
    <article id="detail"><p style="opacity:0.6">ソウルを選択</p></article>
  </main>
  <script type="module">
    import { loadSouls } from '../shared/data-loader.js';
    import { RARITY_LABEL, ELEMENT_LABEL, WEAPON_LABEL } from '../shared/constants.js';
    import * as fc from '../shared/filter-core.js';
    import { soulIcon, imgWithFallback } from '../shared/image-paths.js';

    const state = { rarity: new Set(), search: '' };
    let all = []; let selected = null;
    const $ = (id) => document.getElementById(id);

    async function init() {
      all = await loadSouls();
      fc.renderToggles($('f-rarity'), 'rarity', fc.rarityOptions(), state, render);
      $('search').oninput = (e) => { state.search = e.target.value; render(); };
      render();
    }
    function render() {
      const filtered = fc.applyFilterSort(all, state, { rarity: 'rarity' }, 'rarity', 'desc');
      $('count').textContent = filtered.length;
      $('list').innerHTML = filtered.map((s) => `<div class="item ${selected===s.id?'selected':''}" data-id="${s.id}">
        ${s.texture_id ? imgWithFallback(soulIcon(s.texture_id), s.name) : ''}
        <div><span class="rarity-${s.rarity}">${RARITY_LABEL[s.rarity]}</span> <b>${s.name}</b><br><small>${s.code || ''}</small></div>
      </div>`).join('');
      $('list').onclick = (e) => {
        const el = e.target.closest('.item'); if (!el) return;
        selected = +el.dataset.id;
        renderDetail(all.find((x) => x.id === selected)); render();
      };
    }
    function renderDetail(s) {
      if (!s) return;
      const ea = Object.entries(s.element_affinity || {}).map(([eid, r]) =>
        `${ELEMENT_LABEL[eid]||eid}: +${r.positive_value}/-${r.negative_value} (${r.rank_string})`).join('  ');
      const wa = Object.entries(s.weapon_affinity || {}).map(([wid, r]) =>
        `${WEAPON_LABEL[wid]||wid}: +${r.positive_value}/-${r.negative_value} (${r.rank_string})`).join('  ');
      const skills = (s.skills || []).map((sk) =>
        `<li><b>${sk.name}</b>: ${sk.parameter}/${sk.math_type}/${sk.value} range=${sk.range}<br><small>${sk.description||''}</small></li>`).join('');
      $('detail').innerHTML = `${s.texture_id ? imgWithFallback(soulIcon(s.texture_id), s.name) : ''}
        <h2>${s.name}</h2><p>${RARITY_LABEL[s.rarity]} / ${s.code} / id=${s.id}</p>
        <h3>属性相性</h3><p style="font-size:11px">${ea}</p>
        <h3>武器相性</h3><p style="font-size:11px">${wa}</p>
        <h3>スキル (${(s.skills||[]).length})</h3><ul style="font-size:11px">${skills}</ul>`;
    }
    init();
  </script>
</body>
</html>
