<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BxB ソウルデータベース</title>
    <link rel="icon" href="../favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/nav.css" />
    <link rel="stylesheet" href="../css/shared.css" />
    <link rel="stylesheet" href="../css/souls.css" />
  </head>
  <body>
    {{include _loading.html}}

    <div id="page-wrap">
      <div id="layout">
        <!-- SIDEBAR -->
        <div id="sidebar">
          <div id="filters">
            <div class="mob-search-row">
              <input
                type="text"
                id="search"
                placeholder="🔍 ソウル名で検索..."
                style="
                  padding: 6px 10px;
                  border-radius: 6px;
                  border: 1px solid var(--border);
                  background: var(--bg3);
                  color: var(--text);
                  font-size: 13px;
                  outline: none;
                "
                oninput="applyFilters()"
              />
              <span id="soul-count-mob"></span>
            </div>
            <div class="actions-row">
              <button class="filter-toggle-btn" id="filter-toggle-btn" onclick="toggleFilters()">
                ▼ 絞り込み
              </button>
              <select id="f-sort" onchange="applyFilters()">
                <option value="sort_order">並び順 (推奨)</option>
                <option value="id">ID順</option>
                <option value="rarity">レア度順</option>
              </select>
              <button id="sort-dir" onclick="toggleSortDir()">↓</button>
              <button class="btn-reset" onclick="resetFilters()">リセット</button>
            </div>
            <div id="filters-body">
              <div class="filter-section">
                <div class="filter-label">レア度</div>
                <div class="filter-toggles" id="f-rarity"></div>
              </div>

              <div class="filter-section">
                <div class="filter-label">得意属性</div>
                <div class="filter-toggles" id="f-element"></div>
              </div>

              <div class="filter-section">
                <div class="filter-label">得意武器</div>
                <div class="filter-toggles grid-6" id="f-weapon"></div>
              </div>

              <div class="filter-section">
                <div class="filter-label">魂特性</div>
                <div class="filter-toggles" id="f-tags"></div>
              </div>
            </div>
            <!-- #filters-body -->
            <div id="soul-count"></div>
          </div>
          <div id="soul-list"></div>
        </div>

        <!-- DETAIL -->
        <div id="detail">
          <div id="detail-mob-bar">
            <button id="detail-mob-prev" onclick="navSoul(-1)" aria-label="前へ">‹</button>
            <span class="nav-label" id="detail-mob-label"></span>
            <button onclick="closeDetailMob()" aria-label="閉じる">✕</button>
            <button id="detail-mob-next" onclick="navSoul(1)" aria-label="次へ">›</button>
          </div>
          <div id="placeholder">
            <svg
              width="64"
              height="64"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1"
            >
              <circle cx="12" cy="8" r="5" />
              <path d="M3 21c0-4.4 4-8 9-8s9 3.6 9 8" />
            </svg>
            <p>左の一覧からソウルを選択してください</p>
          </div>
          <div id="soul-detail" style="display: none"></div>
        </div>
      </div>
    </div>

    <script type="module">
      import { Nav, updateReviseBar } from '../js/nav.js';
      import { state } from '../js/soul-state.js';
      import { escHtml, fmtBairitu, parseBairituVal, hideLoading } from '../js/utils.js';
      import { deepApply } from '../js/diff.js';
      import {
        initFilterToggles,
        toggleFilter,
        toggleFilters,
        collapseFiltersOnScroll,
        toggleSortDir,
        resetFilters,
        applyFilters,
      } from '../js/soul-filter.js';
      import {
        selectSoul,
        closeDetailMob,
        navSoul,
        setupStickyHeights,
      } from '../js/soul-render.js';
      // Phase 7 Session 3: v2-soul-edit (tags only)
      import { adaptSoulList } from '../shared/v2-soul-adapter.js';
      import {
        enterEditMode,
        cancelEdit,
        saveEdit,
        saveRevise,
        cancelRevise,
        toggleSoulTag,
      } from '../js/v2-soul-edit.js';

      Nav.init();

      // ===== DATA LOAD (v2 schema → wiki adapter) =====
      // Phase 6.2 view-only: souls.json 来自 master_tables (v2 schema)、
      // 通过 adapter 转成旧 wiki shape 喂给 soul-render/soul-filter/utils module、UI 1:1 wiki 不变。
      // souls_extra / souls_revise / souls_check 在 v2 仓库不再维护、fetch 失败 fallback []。
      // Phase 7 Session 2: 同时 fetch soul_revise.json (含 tags 等 user 编辑字段)
      document.addEventListener('DOMContentLoaded', () => {
        initFilterToggles();
        Promise.all([
          fetch('../data/souls.json').then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }),
          fetch('../data/soul_revise.json').then((r) => (r.ok ? r.json() : [])).catch(() => []),
        ])
          .then(([arr, revise]) => {
            state.allSouls = adaptSoulList(arr, revise);
            state.allSouls.forEach((s) => {
              if (!state.originalData[s.id])
                state.originalData[s.id] = JSON.parse(JSON.stringify(s));
            });
            applyFilters();
            hideLoading();
          })
          .catch(() => { applyFilters(); hideLoading(); });
      });

      // 「絞り込み」展開中の user-initiated scroll でのみ collapse — touchmove (mobile) / wheel (desktop)。
      // scroll 事件は使わない：filter 操作後の list 高さ変化による浏览器 auto-clamp scrollY を user スクロールと誤判するため。
      window.addEventListener('touchmove', collapseFiltersOnScroll, { passive: true });
      window.addEventListener('wheel', collapseFiltersOnScroll, { passive: true });
      window.addEventListener('resize', setupStickyHeights, { passive: true });

      // Expose globals for inline HTML onclick handlers
      window.state = state;
      Object.assign(window, {
        toggleFilter,
        toggleSortDir,
        applyFilters,
        resetFilters,
        toggleFilters,
        selectSoul,
        closeDetailMob,
        navSoul,
        updateReviseBar,
        escHtml,
        fmtBairitu,
        parseBairituVal,
        // Phase 7 Session 3: v2-soul-edit active (tags only)
        enterEditMode,
        cancelEdit,
        saveEdit,
        saveRevise,
        cancelRevise,
        toggleSoulTag,
      });

      // 旧 wiki soul-edit inline-onclick stub — v2 master 这些字段不可编辑、UI 渲染遗留 onclick 不让报错
      const _noop = () => {};
      Object.assign(window, {
        toggleBunrui: _noop, toggleElem: _noop, toggleType: _noop,
        setHitStage: _noop, setHitStageScaling: _noop, toggleSkillTombstone: _noop,
        addNewSkill: _noop, removeAddedSkill: _noop,
        addSkillEffect: _noop, removeSkillEffect: _noop,
        reRenderEditSkills: _noop, renderSoulTagToggles: _noop,
      });
    </script>
  </body>
</html>
