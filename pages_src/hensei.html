      };

      // ===== STATS CALCULATOR (用 shared/stats-calc.js 4-stage) =====

      // ===== ENEMY BAR (敵方/副本/工会信息) =====
      export const renderEnemyBar = () => {
        const eb = document.getElementById('enemy-bar');
        if (!eb) return;
        const isGuild = enemy.mode === 'guildbattle' || enemy.mode === 'guildbattle_special';
        // 1. 元素
        const elemBtns = [1, 2, 3, 4, 5, 6]
          .map(
            (e) =>
              `<button class="eb-btn elem-${e}${enemy.element === e ? ' on' : ''}" onclick="setEnemyElem(${e})">${ELEMENT[e]}</button>`,
          )
          .join('');
        // 2. BK状態（单按钮 toggle：あり/なし）
        const bkLabel = enemy.bk ? 'あり' : 'なし';
        const bkBtns = `<button class="eb-btn${enemy.bk ? ' on' : ''}" onclick="setEnemyBk(${!enemy.bk})">${bkLabel}</button>`;
        // 3. mode
        const modeOpts = [
          ['normal', '普通'],
          ['guildbattle', 'ギルバト'],
          ['guildbattle_special', 'ギルバト七罪王'],
          ['other', '他'],
        ]
          .map(
            ([v, l]) => `<option value="${v}"${enemy.mode === v ? ' selected' : ''}>${l}</option>`,
          )
          .join('');
        // 4. BK耐性 (guild only) — 单按钮 toggle：普通/高
        let bkResHtml = '';
        if (isGuild) {
          const isHigh = enemy.bkResistance === 'high';
          bkResHtml = `<div class="eb-group">
      <span class="eb-label">BK耐性</span>
      <button class="eb-btn${isHigh ? ' on' : ''}" onclick="setEnemyBkRes('${isHigh ? 'normal' : 'high'}')">${isHigh ? '高' : '普通'}</button>
    </div>`;
        }
        // 7. 有利武器 (guild only) — 桌面行内 / 移动 6x2 grid
        let advWeapHtml = '';
        if (isGuild) {
          const wbtns = [];
          for (let w = 1; w <= 12; w++) {
            const on = enemy.advantageWeapons.has(w) ? ' on' : '';
            wbtns.push(
              `<button class="eb-btn${on}" onclick="toggleAdvWeapon(${w})">${WEAPON[w]}</button>`,
            );
          }
          advWeapHtml = `<div class="eb-group eb-adv-weapon">
      <span class="eb-label">有利武器</span>
      <div class="adv-weapon-grid">${wbtns.join('')}</div>
    </div>`;
        }
        // 8. difficulty (guild only)
        let diffHtml = '';
        if (isGuild) {
          diffHtml = `<div class="eb-group">
      <span class="eb-label">難易度</span>
      ${['Normal', 'Hard', 'Lunatic'].map((d) => `<button class="eb-btn${enemy.difficulty === d ? ' on' : ''}" onclick="setEnemyDiff('${d}')">${d}</button>`).join('')}
    </div>`;
        }
        // 9. ギルド役職 (guild only)
        let titleHtml = '';
        if (isGuild) {
          const opts = [`<option value="">-- 役職なし --</option>`]
            .concat(
              allGuildTitles.map(
                (g) =>
                  `<option value="${g.id}"${enemy.guildTitle === g.id ? ' selected' : ''}>${escHtml(g.name)} — ${escHtml(g.effect_text || '')}</option>`,
              ),
            )
            .join('');
          titleHtml = `<div class="eb-group">
      <span class="eb-label">ギルド役職</span>
      <select onchange="setEnemyGuildTitle(this.value)">${opts}</select>
    </div>`;
        }
        // 10. エンブレム — 4 槽 icon picker（参考 crystals 槽位风格）
        let emblemHtml = `<div class="eb-group">
    <span class="eb-label">エンブレム</span>
    <div class="emblem-slots">`;
        for (let s = 0; s < 4; s++) {
          const slot = enemy.emblems[s] || { id: null, level: 1 };
          if (slot.id != null) {
            const em = allGuildEmblems.find((g) => g.id === slot.id);
            const lvMax = em ? emblemLvMax(em.rarity) : 1;
            emblemHtml += `<div class="emblem-slot-wrap" onclick="openEmblemModal(${s})">
        <div class="emblem-thumb-wrap">
          <img class="emblem-thumb" loading="lazy" src="../${em && em.image ? em.image : 'icons/emblem/' + slot.id + '.png'}" onerror="this.style.opacity='.3'" title="${escHtml(em ? em.name : '')}" alt="">
          <button class="emblem-rm" onclick="event.stopPropagation();setEmblem(${s},'')" title="外す">×</button>
        </div>
        <div class="emblem-slot-meta" onclick="event.stopPropagation()">
          <input type="number" min="1" max="${lvMax}" value="${slot.level || 1}" class="emblem-lv-input" onchange="setEmblemLv(${s},+this.value)">
          <span class="emblem-lv-max">/${lvMax}</span>
        </div>
      </div>`;
          } else {
            emblemHtml += `<div class="emblem-slot-wrap" onclick="openEmblemModal(${s})">
        <div class="emblem-empty" title="エンブレムを選択">+</div>
        <div class="emblem-slot-meta" style="visibility:hidden" aria-hidden="true">
          <input type="number" value="1" class="emblem-lv-input" tabindex="-1">
          <span class="emblem-lv-max">/1</span>
        </div>
      </div>`;
          }
        }
        emblemHtml += `</div></div>`;

        // 11. BDゲージ上限条 — slider + integer input。max は _computeBdCapMax で算出。
        const bdCapMax = _computeBdCapMax();
        if ((+enemy.bd_cap || 0) > bdCapMax) enemy.bd_cap = bdCapMax;
        const bdCap = +enemy.bd_cap || 0;
        const bdCapHtml = `<div class="eb-group">
    <span class="eb-label">BDゲージ上限</span>
    <input type="range" min="0" max="${bdCapMax}" step="0.01" value="${bdCap}" class="bd-cap-slider" oninput="setEnemyBdCap(+this.value)">
    <input type="text" inputmode="decimal" pattern="[0-9]*\\.?[0-9]*" value="${bdCap.toFixed(2)}" class="bd-cap-input" oninput="setEnemyBdCap(this.value)">
    <span class="bd-cap-max" style="cursor:pointer;text-decoration:underline dotted" onclick="openBdCapMaxPopup()" title="クリックで各レベルの BlazeGauge 必要量を表示">/ ${bdCapMax}</span>
  </div>`;

        eb.innerHTML = `
    <div class="eb-group"><span class="eb-label">敵属性</span>${elemBtns}</div>
    <div class="eb-group"><span class="eb-label">敵BK状態</span>${bkBtns}</div>
    <div class="eb-group"><span class="eb-label">副本</span><select onchange="setEnemyMode(this.value)">${modeOpts}</select></div>
    ${bkResHtml}
    ${diffHtml}
    ${advWeapHtml}
    ${titleHtml}
    ${emblemHtml}
    ${bdCapHtml}
  `;
      };

      export const setEnemyElem = (e) => {
        enemy.element = e;
        renderEnemyBar();
        refreshAllStats();
      };
      export const setEnemyBk = (b) => {
        enemy.bk = !!b;
        renderEnemyBar();
        refreshAllStats();
      };
      export const setEnemyMode = (m) => {
        enemy.mode = m;
        renderEnemyBar();
        refreshAllStats();
      };
      export const setEnemyBkRes = (r) => {
        enemy.bkResistance = r;
        renderEnemyBar();
        refreshAllStats();
      };
      export const setEnemyDiff = (d) => {
        enemy.difficulty = d;
        renderEnemyBar();
        refreshAllStats();
      };
      export const setEnemyGuildTitle = (v) => {
        enemy.guildTitle = v ? +v : null;
        renderEnemyBar();
        refreshAllStats();
      };
      export const setEnemyBdCap = (v) => {
        // 接受 float string (text inputmode=decimal)、parseFloat 解析
        // 容许 user 正在输入半成品 (例 "5." / "12.")、不强制覆盖 input 显示
        let n = parseFloat(v);
        if (!Number.isFinite(n)) n = 0;
        const sl = document.querySelector('.bd-cap-slider');
        const dynMax = sl ? +sl.max || 9 : 9;
        enemy.bd_cap = Math.max(0, Math.min(dynMax, Math.round(n * 100) / 100));
        if (sl) sl.value = enemy.bd_cap;
        // 不在 oninput 时覆盖 input value (user 可能正在输入 "5." 类半成品)
        // 仅在超出 max 时回填 clamp 后值
        const ip = document.querySelector('.bd-cap-input');
        if (ip && n > dynMax) ip.value = (+enemy.bd_cap).toFixed(2);
        refreshAllStats();
      };
      export const toggleAdvWeapon = (w) => {
        if (enemy.advantageWeapons.has(w)) enemy.advantageWeapons.delete(w);
        else enemy.advantageWeapons.add(w);
        renderEnemyBar();
        refreshAllStats();
      };
      export const setEmblem = (slotIdx, v) => {
        if (!enemy.emblems[slotIdx]) enemy.emblems[slotIdx] = { id: null, level: 1 };
        const newId = v ? +v : null;
        enemy.emblems[slotIdx].id = newId;
        const em = newId != null ? allGuildEmblems.find((g) => g.id === newId) : null;
        enemy.emblems[slotIdx].level = em ? emblemLvMax(em.rarity) : 1;
        renderEnemyBar();
        refreshAllStats();
      };
      export const setEmblemLv = (slotIdx, lv) => {
        if (!enemy.emblems[slotIdx]) enemy.emblems[slotIdx] = { id: null, level: 1 };
        const em = allGuildEmblems.find((g) => g.id === enemy.emblems[slotIdx].id);
        const max = em ? emblemLvMax(em.rarity) : 1;
        enemy.emblems[slotIdx].level = Math.max(1, Math.min(max, Math.floor(+lv) || 1));
        renderEnemyBar();
        refreshAllStats();
      };

      // ===== EMBLEM MODAL（rarity 筛选 + icon 列表）=====
      // スロット色固定：0→黄(1) / 1→青(2) / 2→緑(3) / 3→赤(4)
      const SLOT_COLORS = [1, 2, 3, 4];
      const COLOR_LABELS = { 1: '黄', 2: '青', 3: '緑', 4: '赤' };
      const COLOR_HEX = { 1: '#ffd040', 2: '#5b8bff', 3: '#5bd47a', 4: '#ff6b6b' };
      let emblemModalSlot = -1;
      const emblemModalFilter = { rarity: new Set() };

      export const openEmblemModal = (slotIdx) => {
        emblemModalSlot = slotIdx;
        const c = SLOT_COLORS[slotIdx];
        const title = document.querySelector('#emblem-modal .modal-header-title');
        if (title) {
          title.innerHTML = c
            ? `エンブレム選択 <span style="color:${COLOR_HEX[c]};font-size:13px;margin-left:6px">● ${COLOR_LABELS[c]}スロット</span>`
            : 'エンブレム選択';
        }
        document.getElementById('emblem-modal').classList.add('open');
        _renderEmblemModalSidebar();
        _renderEmblemModalList();
      };
      export const closeEmblemModal = () => {
        document.getElementById('emblem-modal').classList.remove('open');
        emblemModalSlot = -1;
      };
      export const _renderEmblemModalSidebar = () => {
        const html = `
    <div class="f-section"><div class="f-label">レア度</div><div class="f-toggles">
      ${[1, 2, 3, 4]
        .map(
          (r) =>
            `<button class="ftog${emblemModalFilter.rarity.has(r) ? ' on' : ''}" onclick="toggleEmblemRarity(${r})">★${r}</button>`,
        )
        .join('')}
    </div></div>
    <div class="f-sort-row"><button class="f-reset-btn" onclick="resetEmblemFilter()" style="flex:1">リセット</button></div>
    <div class="modal-count" id="emblem-count"></div>`;
        document.getElementById('emblem-sidebar').innerHTML = html;
      };
      export const _renderEmblemModalList = () => {
        const list = document.getElementById('emblem-list');
        const isGuildMode = enemy.mode === 'guildbattle' || enemy.mode === 'guildbattle_special';
        const slotColor = SLOT_COLORS[emblemModalSlot];
        const items = (allGuildEmblems || [])
          .filter((em) => {
            if (slotColor && (+em.color || 0) !== slotColor) return false;
            if (emblemModalFilter.rarity.size > 0 && !emblemModalFilter.rarity.has(+em.rarity || 1))
              return false;
            return true;
          })
          .sort(
            (a, b) =>
              (a.guild_only ? 1 : 0) - (b.guild_only ? 1 : 0) ||
              (a.rarity || 1) - (b.rarity || 1) ||
              a.id - b.id,
          );
        const cnt = document.getElementById('emblem-count');
        if (cnt) cnt.textContent = items.length + ' 件';

        let html = `<div class="em-clear sticky" onclick="selectEmblem(null)">— エンブレムを外す</div>`;
        if (!items.length) {
          list.innerHTML = html + '<div class="em-no-results">該当なし</div>';
          return;
        }
        for (const em of items) {
          const cur = (enemy.emblems[emblemModalSlot] || {}).id === em.id ? ' active' : '';
          const dim = em.guild_only && !isGuildMode ? ' style="opacity:.8"' : '';
          const gbTag = em.guild_only
            ? '<span class="badge weapon" style="background:rgba(91,127,255,.18);color:#7b9fff;border-color:rgba(91,127,255,.35)">GB限定</span>'
            : '';
          html += `<div class="em-item em-item-bg${cur}"${dim} onclick="selectEmblem(${em.id})">
      <img class="em-icon" data-src="../${em.image || 'icons/emblem/' + em.id + '.png'}" onerror="this.style.visibility='hidden'" alt="">
      <div class="em-bg-body">
        <div class="em-bg-header">
          <span class="badge weapon">★${em.rarity || 1}</span>
          <span class="em-bg-name">${escHtml(em.name || '')}</span>
          ${gbTag}
        </div>
        <div class="em-bg-eff">${escHtml(em.effect_text || '')}</div>
      </div>
    </div>`;
        }
        list.innerHTML = html;
        setupLazyImg(list);
      };
      export const toggleEmblemRarity = (r) => {
        if (emblemModalFilter.rarity.has(r)) emblemModalFilter.rarity.delete(r);
        else emblemModalFilter.rarity.add(r);
        _renderEmblemModalSidebar();
        _renderEmblemModalList();
      };
      export const resetEmblemFilter = () => {
        emblemModalFilter.rarity.clear();
        _renderEmblemModalSidebar();
        _renderEmblemModalList();
      };
      export const selectEmblem = (id) => {
        if (emblemModalSlot < 0) return;
        setEmblem(emblemModalSlot, id == null ? '' : id);
        closeEmblemModal();
      };

      // Pick / equip / clear (索引 slot_idx → skillId、不依赖 SENZAI_TABLE) ─────────
      // 候选 skill 短 label: param + math + value (例 'Attack ×1.20' / 'Defense +240')
      const _omoideSkillLabel = (sk) => {
        if (!sk) return '';
        const v = sk.value;
        const math = sk.math_type;
        const op = math === 'Multiply' ? '×' : math === 'Addition' ? _addP(v) : '?';
        return `${sk.parameter || '?'} ${op}${v != null ? fmtNum(v) : '?'}`;
      };

      export const pickOmoide = (si, slotIdx, skillId) => {
        const tr = team[si].tr;
        const c = allCharas.find((x) => x.id === team[si].chara);
        const slots = c?._omoide_slots || [];
        const slot = slots[slotIdx];
        if (!slot) return;
        if ((+slot.affection_threshold || 0) > (+tr.affinity || 0)) return; // locked
        if (!tr.omoide_picks) tr.omoide_picks = {};
        if (tr.omoide_picks[slotIdx] === skillId) {
          delete tr.omoide_picks[slotIdx];
        } else {
          tr.omoide_picks[slotIdx] = skillId;
        }
        if (omoideModalSlot === si) _renderOmoideModalBody();
        _refreshOmoideCountLabel(si);
        refreshAllStats();
      };

      // 好感装備の優先属性 [master parameter, ラベル] — equipAllOmoide / モーダルのボタンで共用
      const _OMOIDE_PRIO = [
        ['Attack', '攻撃'], ['Defense', '防御'], ['HP', 'HP'], ['GuardBreak', 'BK'],
        ['BlazeAttack', 'BD攻撃'], ['MotionSpeed', '攻速'], ['Speed', '転速'],
      ];
      export const equipAllOmoide = (si, prio = 'Attack') => {
        // 各 unlocked slot に prio 属性の候補を優先選択 (なければ第一候補)
        const c = allCharas.find((x) => x.id === team[si].chara);
        if (!c) return;
        const tr = team[si].tr;
        const aff = +tr.affinity || 0;
        if (!tr.omoide_picks) tr.omoide_picks = {};
        (c._omoide_slots || []).forEach((slot, idx) => {
          if ((+slot.affection_threshold || 0) > aff) return;
          const cands = slot.weapon_skills || [];
          if (!cands.length) return;
          // prio 属性優先 (HP-curve prefix は baseParameter で吸収: Vitality_Attack → Attack)
          let pick = cands.find((sk) => baseParameter(sk.parameter) === prio);
          if (!pick) pick = cands[0];
          tr.omoide_picks[idx] = pick.id;
        });
        if (omoideModalSlot === si) _renderOmoideModalBody();
        _refreshOmoideCountLabel(si);
        refreshAllStats();
      };

      export const clearAllOmoide = (si) => {
        team[si].tr.omoide_picks = {};
        if (omoideModalSlot === si) _renderOmoideModalBody();
        _refreshOmoideCountLabel(si);
        refreshAllStats();
      };

      let omoideModalSlot = -1;
      export const openOmoideModal = (si) => {
        omoideModalSlot = si;
        const c = allCharas.find((x) => x.id === team[si].chara);
        if (!c) return;
        document.getElementById('omoide-modal-title').textContent = `好感装備 — ${c.name}`;
        _renderOmoideModalBody();
        document.getElementById('omoide-modal').classList.add('open');
      };
      export const closeOmoideModal = () => {
        document.getElementById('omoide-modal').classList.remove('open');
        omoideModalSlot = -1;
      };
      export const _renderOmoideModalBody = () => {
        const si = omoideModalSlot;
        if (si < 0) return;
        const c = allCharas.find((x) => x.id === team[si].chara);
        if (!c) return;
        const tr = team[si].tr;
        const picks = tr.omoide_picks || {};
        const aff = +tr.affinity || 0;
        const slots = c._omoide_slots || [];
        const rows = slots
          .map((slot, idx) => {
            const threshold = +slot.affection_threshold || 0;
            const locked = threshold > aff;
            const cands = slot.weapon_skills || [];
            const opts = cands
              .map((sk) => {
                const sel = !locked && picks[idx] === sk.id;   // 锁定槽 (好感不足) 不显示勾选
                const dis = locked ? ' disabled style="cursor:not-allowed"' : '';
                const lbl = _omoideSkillLabel(sk);
                const tooltip = `${sk.name || ''}${sk.description ? ' — ' + sk.description : ''}`;
                return `<button class="om-opt${sel ? ' on' : ''}"${dis} onclick="pickOmoide(${si},${idx},${sk.id})" title="${escHtml(tooltip)}">${escHtml(lbl)}</button>`;
              })
              .join('');
            const lockTag = locked
              ? '<span style="font-size:10px;color:#ff7777;margin-left:4px">🔒</span>'
              : '';
            return min`
      <div class="om-row${locked ? ' locked' : ''}">
        <div class="om-thresh">${threshold}${lockTag}</div>
        <div class="om-slots">${opts}</div>
      </div>`;
          })
          .join('');
        document.getElementById('omoide-modal-body').innerHTML = `
    <div class="om-toolbar">
      <span style="font-size:13px;color:var(--text2);font-weight:600">好感:</span>
      <input type="number" min="0" step="1" value="${aff}" onchange="setAffinity(${si},+this.value)"
        style="width:80px;padding:4px 6px;border-radius:4px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:13px;outline:none;text-align:right">
      ${_OMOIDE_PRIO.map(([p, lbl]) => `<button class="om-btn" onclick="equipAllOmoide(${si},'${p}')">${lbl}優先</button>`).join('')}
      <button class="om-btn" onclick="clearAllOmoide(${si})">全解除</button>
    </div>
    ${rows}
  `;
      };
      export const _refreshOmoideCountLabel = (si) => {
        const c = allCharas.find((x) => x.id === team[si].chara);
        if (!c) return;
        const equipped = _omoideEquippedCount(c, team[si].tr);
        const lbl = document.getElementById('om-count-' + si);
        if (lbl) lbl.textContent = `(${equipped}/${(c._omoide_slots || []).length})`;
      };

      export const _fmtStat = (v) => {
        if (v == null || isNaN(v)) return '-';
        // 超过 13 位数（≥ 1e13）改用科学计数法（小数点后 6 位）
        if (Math.abs(v) >= 1e13) return (+v).toExponential(6);
        return (+v).toLocaleString('en-US');
      };

      export const renderStatsPanel = (i, chara) => {
        if (!chara) return `<div class="stats-panel" id="stats-panel-${i}"></div>`;
        return `<div class="stats-panel" id="stats-panel-${i}">${_statsInner(i, chara)}</div>`;
      };
      // 各 slot の最新 computeStats 結果を保持（trace modal 用、IS_LOCAL_DEV のみ意味あり）
      const _lastTrace = [null, null, null];

      // stats-calc.js computeStats 用 ctx — 数据集 + 队伍状态 + helper / 常量 を 1 つの object に。
      // 函数調用時に fresh build（state mutable のため snapshot）、helper 引用は closure scope 経由。
      // ctx 缩到 14 字段（数据集 + 队伍/敌方 + UI 常量）。helper / 常量都已经在
      // stats-calc.js module scope export、不再 ctx 注入。
      const _buildStatsCtx = () => ({
        allCharas,
        allCrystals,
        allSouls,
        allMasou,
        allBGs,
        allGuildTitles,
        allGuildEmblems,
        SENZAI_TABLE,
        team,
        teamSize,
        enemy,
        SLOT_COLORS,
        COLOR_LABELS,
        IS_LOCAL_DEV,
        traceEnabled: IS_LOCAL_DEV,   // dev 才生成 trace (stat-trace modal 用)、Pages 0 开销
      });

      export const _statsInner = (i, chara) => {
        if (!chara) {
          _lastTrace[i] = null;
          return '';
        }
        const tr = team[i].tr;
        const r = computeStats(chara, tr, i, _buildStatsCtx());
        if (!r) {
          _lastTrace[i] = null;
          return '';
        }
        // DEBUG: slot i 收集到多少 effect
        if (window.__DEBUG_STATS) {
          console.log(`[stats slot ${i}]`, chara?.name, 'effects:', r.effects?.length,
            'sources:', [...new Set((r.effects||[]).map(e=>e._source))],
            'stats:', r.stats);
        }
        _lastTrace[i] = r;
        const dl = +r.damageLimit;
        const aMax = +r.stats['攻撃力'] || 0;
        const aMin = aMax * 0.95;
        const def = +r.stats['防御力'] || 0;
        const hp = +r.stats['HP'] || 0;
        const bk = +r.stats['ブレイク力'] || 0;
        const hits = (r.hits || [0, 0, 0]).map((h) => Math.floor(+h || 0));
        const total_hits = hits.reduce((sum, h) => sum + h, 0);
        // r.speed = { latestRecover, cooldownFrames, setFrames }
        const spdRecover = +r.speed?.latestRecover || 0;
        const spdFrames = +r.speed?.cooldownFrames || 0;
        const spdSet = +r.speed?.setFrames || 0;
        // r.motionSpeed = { speeds: [m1, m2, m3], durationsFrames: [fr1, fr2, fr3] }
        const msFrames = Array.isArray(r.motionSpeed?.durationsFrames) ? r.motionSpeed.durationsFrames : [0, 0, 0];
        const msSpeeds = Array.isArray(r.motionSpeed?.speeds) ? r.motionSpeed.speeds : [0, 0, 0];
        // motion_durations 全空 (data/_npc_motions.json 缺该 motion_id) → fallback 显示倍率
        const msMissing = msFrames.every((v) => !v);

        const yMax = aMax >= dl ? ' style="color:#ffd040"' : '';
        const yMin = aMin >= dl ? ' style="color:#ffd040"' : '';
        // 転速 / 攻速 が上限(最速)に到達したら攻撃力と同じ黄 #ffd040 で表示:
        //   転速: cooldown(下限 1fr) + set(1fr) = 最小 2fr → 到顶
        //   攻速: 各有効段が 2fr 下限 (3 段攻撃 = 計 6fr「2+2+2」) → 到顶
        const ySpd = (spdFrames + spdSet) > 0 && (spdFrames + spdSet) <= 2 ? ' style="color:#ffd040"' : '';
        const _msActive = msFrames.filter((v) => v > 0);
        const yMs = !msMissing && _msActive.length > 0 && _msActive.every((v) => v <= 2) ? ' style="color:#ffd040"' : '';
        // 攻速 per-stage: 各段到 2fr 下限(最速)标黄;总 fr 仅当全段到下限时标黄
        const _msSeg = msFrames.map((v) => (!v ? '—' : v <= 2 ? `<span style="color:#ffd040">${v}</span>` : String(v))).join(', ');
        const _msTotal = msFrames.reduce((a, b) => a + b, 0);

        // dev 環境のみ stat cell を clickable に。GitHub Pages では cursor も onclick もなし。
        const ck = IS_LOCAL_DEV
          ? (k) => ` onclick="openStatTrace(${i},'${k}')" style="cursor:pointer"`
          : () => '';

        // 显示顺序：攻撃力max / 攻撃力min / 防御力 / HP / BK / Hit数 / 転速 / 攻速 / ダメ上限
        // 默认每 cell 1/2 行宽（.stats-grid 的 grid-template-columns 设为 repeat(2,1fr)）。
        const cells = [
          `<div class="stats-cell"${ck('攻撃力')}><span class="stats-key">攻撃力max</span><span class="stats-val"${yMax}>${_fmtStat(Math.ceil(aMax))}</span></div>`,
          `<div class="stats-cell"${ck('攻撃力')}><span class="stats-key">攻撃力min</span><span class="stats-val"${yMin}>${_fmtStat(Math.ceil(aMin))}</span></div>`,
          `<div class="stats-cell"${ck('防御力')}><span class="stats-key">防御力</span><span class="stats-val">${_fmtStat(Math.ceil(def))}</span></div>`,
          `<div class="stats-cell"${ck('HP')}><span class="stats-key">HP</span><span class="stats-val">${_fmtStat(Math.ceil(hp))}</span></div>`,
          `<div class="stats-cell"${ck('ブレイク力')}><span class="stats-key">BK</span><span class="stats-val">${_fmtStat(Math.ceil(bk))}</span></div>`,
          `<div class="stats-cell"${ck('Hit')}><span class="stats-key">Hit数</span><span class="stats-val">[${hits.join(', ')}] 計 ${total_hits}</span></div>`,
          `<div class="stats-cell"${ck('転速')}><span class="stats-key">転速</span><span class="stats-val"${ySpd}>${spdRecover.toFixed(1)} · ${spdFrames + spdSet}fr</span></div>`,
          `<div class="stats-cell"${ck('攻速')}><span class="stats-key">攻速</span><span class="stats-val">${msMissing ? `×[${msSpeeds.map((v) => v.toFixed(2)).join(', ')}] (時間データ不明)` : `[${_msSeg}] <span${yMs}>計 ${_msTotal}fr</span>`}</span></div>`,
          `<div class="stats-cell"${ck('ダメ上限')}><span class="stats-key">ダメ上限</span><span class="stats-val">${_fmtStat(Math.ceil(dl))}</span></div>`,
        ].join('');
        return `<div class="stats-grid">${cells}</div>`;
      };
      export const refreshStatsPanel = (i) => {
        const el = document.getElementById('stats-panel-' + i);
        if (!el) return;
        const c = allCharas.find((x) => x.id === team[i].chara);
        el.innerHTML = _statsInner(i, c);
      };
      // BDゲージ上限 max 算出：各 slot の bdCapMax（computeStats 内で floor((10+Σadd)*(1+Σmul)
      // +ΣfinalAdd)*(1+ΣfinalMul)) - 1 まで完了済み）の最大値を採用。基础 buff 無し = floor(10) - 1 = 9。
      const _computeBdCapMax = () => {
        let bdMax = 9; // baseline (buff 無し時の floor(10)-1)
        for (let si = 0; si < teamSize; si++) {
          const slot = team[si];
          if (!slot) continue;
          const ch = allCharas.find((x) => x.id === slot.chara);
          if (!ch) continue;
          const r = computeStats(ch, slot.tr, si, _buildStatsCtx());
          if (r && (r.bdCapMax || 0) > bdMax) bdMax = r.bdCapMax;
        }
        return bdMax;
      };

      // 初始 BD ゲージ自动算: chara skill parameter=BlazeGauge (mode 1 直接 / mode 2 队伍属性 count)
      // 取 3 slot 中 r.initialBdCap 最大值 (跟 bdCapMax 同 pattern)
      const _computeInitialBdCap = () => {
        let init = 0;
        for (let si = 0; si < teamSize; si++) {
          const slot = team[si];
          if (!slot) continue;
          const ch = allCharas.find((x) => x.id === slot.chara);
          if (!ch) continue;
          const r = computeStats(ch, slot.tr, si, _buildStatsCtx());
          if (r && (r.initialBdCap || 0) > init) init = r.initialBdCap;
        }
        return init;
      };

      // 装备/练度变化时调用、把 bd_cap **重置**成 initialBdCap (slider 初始值、不是下限)
      // user 之后拉低于 initialBdCap 也保留、refreshBdCapMax 不再强制 ≥ initialBdCap
      const resetBdCapToInitial = () => {
        const bdCapMax = _computeBdCapMax();
        const initialBdCap = _computeInitialBdCap();
        enemy.bd_cap = Math.min(bdCapMax, initialBdCap);
      };

      // chara/soul/crystal/bg/masou 切替や 練度 変更で bdCapMax が変わった時、
      // renderEnemyBar 全体は重いので slider/input/label の max 属性だけ更新する。
      // 注: 只 clamp 到 bdCapMax 上限、不再强制 ≥ initialBdCap (initialBdCap 仅作初始值、不作下限)
      const refreshBdCapMax = () => {
        const bdCapMax = _computeBdCapMax();
        if ((+enemy.bd_cap || 0) > bdCapMax) enemy.bd_cap = bdCapMax;
        const sl = document.querySelector('.bd-cap-slider');
        const ip = document.querySelector('.bd-cap-input');
        const lbl = document.querySelector('.bd-cap-max');
        if (sl) {
          sl.max = bdCapMax;
          sl.value = enemy.bd_cap;
        }
        if (ip) {
          ip.value = (+enemy.bd_cap).toFixed(2);
        }
        if (lbl) lbl.textContent = `/ ${bdCapMax}`;
      };

      export const refreshAllStats = () => {
        for (let i = 0; i < 3; i++) refreshStatsPanel(i);
        refreshBdCapMax();
      };

      // bdCapMax popup: 点 /N label 弹小窗显示 blaze_gauge_points 数组 (BD level i 升级需要的 points)
      // 数组按 unpacking §1.3.3.5 pipeline 算 (有 BlazeGaugePointRate soul → IDEAL 表、否则 A 表)
      // 取 slot 0 的 r.blazeGaugePoints (3 slot 同 team 上下文、结果一样)
      export const openBdCapMaxPopup = () => {
        const bdCapMax = _computeBdCapMax();
        // 找第一个有 chara 的 slot、拿 r.blazeGaugePoints
        let pts = BLAZE_GAUGE_POINTS_BASE_A;
        for (let si = 0; si < teamSize; si++) {
          const slot = team[si];
          const ch = slot && allCharas.find((x) => x.id === slot.chara);
          if (!ch) continue;
          const r = computeStats(ch, slot.tr, si, _buildStatsCtx());
          if (r?.blazeGaugePoints) { pts = r.blazeGaugePoints; break; }
        }
        const n = Math.min(pts.length, Math.ceil(bdCapMax) + 1);
        const items = pts.slice(0, n);
        const rows = items
          .map((p, i) => `<div style="display:flex;justify-content:space-between;padding:2px 8px;font-size:12px"><span>Lv ${i + 1}</span><span>${p} pt</span></div>`)
          .join('');
        // 简单 overlay (跟 omoide modal 同 pattern)
        let el = document.getElementById('bdcap-popup');
        if (!el) {
          el = document.createElement('div');
          el.id = 'bdcap-popup';
          el.className = 'modal-overlay';
          el.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000';
          el.onclick = (e) => { if (e.target === el) el.remove(); };
          document.body.appendChild(el);
        }
        el.innerHTML = `
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:14px;min-width:200px;max-height:80vh;overflow-y:auto">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <strong>BDゲージ Lv 必要 BlazeGauge</strong>
        <button onclick="document.getElementById('bdcap-popup').remove()" style="margin:0 8px;background:none;border:none;color:var(--text);cursor:pointer;font-size:18px">×</button>
      </div>
      ${rows}
    </div>`;
      };

      // ===== ENTITY MODAL =====
      let emSlot = -1,
        emType = null,
        emCi = -1;
      const mf = {
        chara: {
          q: '',
          rarity: new Set(),
          element: new Set(),
          weapon: new Set(),
          state: new Set(),
          tags: new Set(),
          omoideRarity: new Set(),

          desc: true,
        },
        soul: {

          rarity: new Set(),

          weapon: new Set(),
          tags: new Set(),
          sort: '',
          desc: true,
        },
        // Phase 7 Session 3 patch: bg / crystal facet 用 master schema (effect / condition_trigger / scope)
        // 跟 crystals.html / bladegraphs.html viewer 一致 (问题 4)
        bg: {
          q: '',
          rarity: new Set(),
          element: new Set(),
          weapon: new Set(),
          effect: new Set(),
          condition_trigger: new Set(),
          scope: new Set(),
        },
        crystal: {
          q: '',
          rarity: new Set(),
          element: new Set(),
          weapon: new Set(),

          scope: new Set(),

        masou: { q: '' },
      };

      export const fsec = (label, key, opts, activeSet) => {

          })
          .join('');
        return `<div class="f-section"><div class="f-label">${label}</div><div class="f-toggles">${btns}</div></div>`;
      };
      export const resetEM = () => {
        const f = mf[emType];
        Object.keys(f).forEach((k) => {
          if (f[k] instanceof Set) f[k].clear();
          else if (k === 'q') f[k] = '';
          else if (k === 'desc') f[k] = true;
          else f[k] = '';
        });
        buildEMSidebar(emType);
        applyEM();
      };

      // Phase 7 Session 3 patch (问题 4): em-picker filter 直接用 CRYSTAL_SPEC / BG_SPEC
      // (跟 crystals.html / bladegraphs.html viewer 1:1 一致)、不再 wrap。
      // 旧 wiki bunrui/scope/condition wrap 已废、effect/condition_trigger/scope 走 spec extract。

      export const applyEM = () => {
        const type = emType,
          f = mf[type];
        let items = [];
        if (type === 'masou') {
          const cid = team[emSlot]?.chara;   // variant_id (6位)
          const charaObj = cid ? allCharas.find((x) => x.id === cid) : null;
          const baseId = charaObj?._master?.id ?? cid;   // masouByChara 索引用 base_id (4位)
          items = baseId ? (masouByChara[baseId] || []).slice() : [];
          if (f.q) {
            const q = String(f.q).toLowerCase();
            items = items.filter((m) => (m.name || '').toLowerCase().indexOf(q) >= 0);
          }
        } else {
          let spec = null;
          if (type === 'chara') spec = CHARA_SPEC;
          else if (type === 'soul') spec = SOUL_SPEC;
          else if (type === 'bg') spec = BG_SPEC;
          else if (type === 'crystal') spec = CRYSTAL_SPEC;
          if (!spec) {
            renderEMList([]);
            return;
          }
          items = FilterCore.applyFilters(
            allCharas && type === 'chara'
              ? allCharas
              : type === 'soul'
                ? allSouls
                : type === 'bg'
                  ? allBGs
                  : allCrystals,
            {
              q: f.q,
              filters: f,
              sortKey: f.sort,
              sortDesc: f.desc !== false,
            },
            spec,
          );
          if (!f.sort || !spec.sortFns[f.sort]) {
            if (type === 'chara') {
              items.sort((a, b) => (b.sort_id || b.id) - (a.sort_id || a.id));
            } else {
              items.sort((a, b) => b.rarity - a.rarity || b.id - a.id);
            }
          }
        }
        const cnt = document.getElementById('em-count');
        if (cnt) cnt.textContent = items.length + ' 件';
        renderEMList(items);
      };

      export const _fmtSortVal = (v) => {
        if (v == null) return '—';
        if (typeof v !== 'number') return String(v);
        return Number.isInteger(v) ? v.toLocaleString('en-US') : String(v);
      };
      export const renderSortBadge = (c, key) => {
        const fn = CHARA_SPEC && CHARA_SPEC.sortFns && CHARA_SPEC.sortFns[key];
        return `<span class="sort-val">${_fmtSortVal(fn ? fn(c) : null)}</span>`;
      };

      export const renderEMList = (items) => {
        const list = document.getElementById('em-list');
        const type = emType;
        let h = '';
        const clearTxt = {
          chara: '魔剣を外す',
          soul: 'ソウルを外す',
          bg: '心象結晶を外す',
          crystal: '結晶を外す',
          masou: '魔装を外す',
        };
        // 4 种选择列表的 "外す" 行都 sticky 在顶部
        h += `<div class="em-clear sticky" onclick="selectEM(null)">— ${clearTxt[type] || '外す'}</div>`;
        if (!items.length) {
          list.innerHTML = h + '<div class="em-no-results">該当なし</div>';
          return;
        }

        if (type === 'chara') {
          const sortKey = mf.chara.sort;
          h += items
            .map((c) => {
              const cur = team[emSlot]?.chara === c.id;
              const sortBadge = sortKey ? renderSortBadge(c, sortKey) : '';
              const rLabel = RARITY[c.rarity] || c.rarity || '?';
              return min`
        <div class="em-item em-item-bg${cur ? ' active' : ''}" onclick="selectEM(${c.id})">
          ${charaIconStack({ variantId: c.id, name: c.name, elementId: c.element, weaponTypeId: c.weapon, marriageLevel: 2, className: 'em-thumb', lazy: 'io' })}
          <div class="em-bg-body">
            <div class="em-bg-header">
              <span class="badge ${rLabel}" style="flex-shrink:0">${rLabel}</span>
              <span class="badge elem-${c.element}" style="flex-shrink:0">${ELEMENT[c.element] || ''}</span>
              <span class="badge weapon" style="flex-shrink:0">${WEAPON[c.weapon] || ''}</span>
              ${sortBadge}
            </div>
            <span class="em-bg-name">${escHtml(c.name)}</span>
          </div>
          <button class="em-detail-btn" onclick="event.stopPropagation();openDetailModal(${c.id})">詳細</button>
        </div>`;
            })
            .join('');
        } else if (type === 'soul') {
          h += items
            .map((s) => {
              const cur = team[emSlot]?.soul === s.id;
              const eb = (s.element || [])
                .map((e) => `<span class="badge elem-${e}">${ELEMENT[e] || ''}</span>`)
                .join('');
              const wb = (s.weapon || [])
                .map((t) => `<span class="badge weapon">${WEAPON[t] || ''}</span>`)
                .join('');
              return min`
        <div class="em-item em-item-bg${cur ? ' active' : ''}" onclick="selectEM(${s.id})">
          <img class="em-icon soul" data-src="../icons/soul/${s.id}.png" onerror="this.style.visibility='hidden'" alt="">
          <div class="em-bg-body">
            <div class="em-bg-header">
              <span class="badge weapon" style="flex-shrink:0">★${s.rarity}</span>
              <span class="em-bg-name">${escHtml(s.name)}</span>
            </div>
            <div class="em-bg-tags">${eb}${wb}</div>
          </div>
          <button class="em-detail-btn" onclick="event.stopPropagation();openDetailModal(${s.id},'soul')">詳細</button>
        </div>`;
            })
            .join('');
        } else if (type === 'bg') {
          h += items
            .map((b) => {
              const cur = team[emSlot]?.bg === b.id;
              return min`
        <div class="em-item em-item-bg${cur ? ' active' : ''}" onclick="selectEM(${b.id})">
          <img class="em-icon" data-src="../icons/bg/${b.id}.png" onerror="this.style.visibility='hidden'" alt="">
          <div class="em-bg-body">
            <div class="em-bg-header">
              <span class="badge weapon" style="flex-shrink:0">★${b.rarity}</span>
              <span class="em-bg-name">${escHtml(b.name)}</span>
            </div>
            <span class="em-bg-eff">${escHtml(b.effect_text || '')}</span>
          </div>
          <button class="em-detail-btn" onclick="event.stopPropagation();openDetailModal(${b.id},'bg')">詳細</button>
        </div>`;
            })
            .join('');
        } else if (type === 'crystal') {
          h += items
            .map((c) => {
              const cur = team[emSlot]?.crystals[emCi]?.id === c.id;
              return min`
        <div class="em-item em-item-bg${cur ? ' active' : ''}" onclick="selectEM(${c.id})">
          <img class="em-icon" data-src="${crystalImageSrc(c)}" onerror="this.style.visibility='hidden'" alt="">
          <div class="em-bg-body">
            <div class="em-bg-header">
              <span class="badge weapon" style="flex-shrink:0">★${c.rarity}</span>
              <span class="em-bg-name">${escHtml(c.name)}</span>
            </div>
            <span class="em-bg-eff">${escHtml(c.effect_text || '')}</span>
          </div>
          <button class="em-detail-btn" onclick="event.stopPropagation();openDetailModal(${c.id},'crystal')">詳細</button>
        </div>`;
            })
            .join('');
        } else if (type === 'masou') {
          h += items
            .map((m) => {
              const cur = team[emSlot]?.masou === m.id;
              return min`
        <div class="em-item em-item-bg${cur ? ' active' : ''}" onclick="selectEM(${m.id})">
          <img class="em-icon" data-src="../icons/masou/${m.id}.png" onerror="this.style.visibility='hidden'" alt="">
          <div class="em-bg-body">
            <div class="em-bg-header">
              <span class="em-bg-name">${escHtml(m.name || '')}</span>
            </div>
            <span class="em-bg-eff">${escHtml((m.effects || []).map((e) => e?.effect_text).filter(Boolean).join(' / '))}</span>
          </div>
          <button class="em-detail-btn" onclick="event.stopPropagation();openDetailModal(${m.id},'masou')">詳細</button>
        </div>`;
            })
            .join('');
        }
        list.innerHTML = h;
        // IO-based lazy: list 自己 scroll、native lazy 失效、按内部 scroll 进度按需 fetch
        setupLazyImg(list);
      };

      export const selectEM = (id) => {
        const si = emSlot,
          type = emType,
          ci = emCi;
        closeEM();
        if (type === 'chara') setChara(si, id);
        else if (type === 'soul') setSoul(si, id);
        else if (type === 'bg') setBG(si, id);
        else if (type === 'crystal') setCrystal(si, ci, id);
        else if (type === 'masou') setMasou(si, id);
      };

      // ===== DETAIL MODAL =====
      let dmCharaId = null,
        dmEntityType = 'chara';

      export const openDetailModal = (id, type = 'chara', showSelect = true) => {
        dmCharaId = id;
        dmEntityType = type;
        const modal = document.getElementById('detail-modal');
        // 清旧 dm-type class、加新的 (CSS 按 type 控 panel height: chara/soul/masou 默认、crystal 1/3、bg 1/2)
        modal.classList.remove('dm-chara', 'dm-soul', 'dm-bg', 'dm-crystal', 'dm-masou');
        modal.classList.add('dm-' + type);
        const btn = document.getElementById('dm-select-btn');
        btn.style.display = showSelect ? '' : 'none';
        const labels = {
          chara: 'この魔剣を選択',
          soul: 'このソウルを選択',
          bg: 'この心象結晶を選択',
          crystal: 'この記憶結晶を選択',
          masou: 'この魔装を選択',
        };
        btn.textContent = labels[type] || 'この魔剣を選択';
        if (type === 'chara') {
          const c = allCharas.find((x) => x.id === id);
          if (!c) return;
          document.getElementById('dm-title').textContent = c.name;
          document.getElementById('dm-body').innerHTML = renderDMChara(c);
          document.getElementById('detail-modal').classList.add('open');
          const first = ['極弐', '改造', '通常'].find((s) => c.states?.[s]);
          if (first) switchDMState(first);
        } else if (type === 'soul') {
          const s = allSouls.find((x) => x.id === id);
          if (!s) return;
          document.getElementById('dm-title').textContent = s.name;
          document.getElementById('dm-body').innerHTML = renderDMSoul(s);
          document.getElementById('detail-modal').classList.add('open');
        } else if (type === 'bg') {
          const b = allBGs.find((x) => x.id === id);
          if (!b) return;
          document.getElementById('dm-title').textContent = b.name;
          document.getElementById('dm-body').innerHTML = renderDMBg(b);
          document.getElementById('detail-modal').classList.add('open');
        } else if (type === 'crystal') {
          const c = allCrystals.find((x) => x.id === id);
          if (!c) return;
          document.getElementById('dm-title').textContent = c.name;
          document.getElementById('dm-body').innerHTML = renderDMCrystal(c);
          document.getElementById('detail-modal').classList.add('open');
        } else if (type === 'masou') {
          const m = allMasou.find((x) => x.id === id);
          if (!m) return;
          document.getElementById('dm-title').textContent = m.name;
          document.getElementById('dm-body').innerHTML = renderDMMasou(m);
          document.getElementById('detail-modal').classList.add('open');
        }
      };
      export const closeDetailModal = () => {
        document.getElementById('detail-modal').classList.remove('open');
        dmCharaId = null;
      };
      export const selectFromDetail = () => {
        const id = dmCharaId,
          type = dmEntityType;
        const si = emSlot,
          ci = emCi;
        closeDetailModal();
        closeEM();
        if (type === 'soul') setSoul(si, id);
        else if (type === 'bg') setBG(si, id);
        else if (type === 'crystal') setCrystal(si, ci, id);
        else if (type === 'masou') setMasou(si, id);
        else setChara(si, id);
      };

      // ===== SOUL DETAIL =====
      const _AFF_LABEL = { '-2': '超苦手', '-1': '苦手', 0: '普通', 1: '得意', 2: '超得意' };
      const _AFF_CLR = { '-2': '#ff5555', '-1': '#ffaa44', 0: null, 1: '#88ee99', 2: '#44ee77' };
      const _AFF_BDR = {
        '-2': 'rgba(255,85,85,.35)',
        '-1': 'rgba(255,170,68,.2)',
        0: null,
        1: 'rgba(136,238,153,.2)',
        2: 'rgba(68,238,119,.35)',
      };
      const _ELEMS_ORDER = ['火', '水', '風', '光', '闇', '無'];
      const _WEAPS_ORDER = [
        '長剣',
        '大剣',
        '太刀',
        '杖棒',
        '弓矢',
        '連弩',
        '戦斧',
        '騎槍',
        '投擲',
        '拳闘',
        '魔典',
        '大鎌',
      ];

      export const renderDMSoul = (s) => {
        const stars = '★'.repeat(s.rarity || 0) || '?';
        function affCell(name, aff) {
          const lv = String(aff?.level ?? 0);
          const label = _AFF_LABEL[lv] || '普通';
          const clr = _AFF_CLR[lv];
          const bdr = _AFF_BDR[lv];
          const atk = fmtAff(aff?.atk_effect);
          const def = fmtAff(aff?.def_effect);
          return min`
      <div class="sdm-aff-cell"${bdr ? ` style="border-color:${bdr}"` : ''}>
        <span class="sdm-aff-name">${escHtml(name)}</span>
        <span class="sdm-aff-level"${clr ? ` style="color:${clr}"` : ''}>${label}</span>
        <span class="sdm-aff-effect">×${atk} / ×${def}</span>
      </div>`;
        }
        const elemCells = _ELEMS_ORDER
          .map((n) => affCell(n, (s.element_affinity || {})[n]))
          .join('');
        const weapCells = _WEAPS_ORDER
          .map((n) => affCell(n, (s.weapon_affinity || {})[n]))
          .join('');
        // detail modal soul skills — 用 wiki adapter 输出 (含 effects[]、effect_text、_displayable)
        // 不用 _resolveSoulSkills 因为它返 master schema (无 effects[]、fmtBairitu/dmRightTags 不识别)
        const skills = s.skills || [];
        const skillCards = skills
          .map((sk) => {
            const tags = dmRightTags(sk);
            const bairitu = fmtBairitu(sk);
            const dim = sk._displayable === false ? ' style="opacity:0.8"' : '';
            return min`
      <div class="dm-skill-card"${dim}>
        <div class="dm-skill-name-row">
          <span class="dm-skill-name">${escHtml(sk.name || '')}</span>${tags}
        </div>
        <div class="dm-skill-eff-row">
          <span class="dm-skill-eff">${escHtml(sk.effect_text || '')}</span>
          <span class="dm-skill-bairitu">${bairitu}</span>
        </div>
      </div>`;
          })
          .join('');
        const acqEntries = Object.entries(s.acquisition || {});
        const acqHtml = acqEntries.length
          ? min`
    <div class="dm-section">
      <div class="dm-section-title">入手場所</div>
      <div class="sdm-acq-table">${acqEntries.map(([k, v]) => `<div class="sdm-acq-key">${escHtml(k)}</div><div class="sdm-acq-val">${escHtml(v)}</div>`).join('')}</div>
    </div>`
          : '';
        const tagsHtml = (s.tags || [])
          .map(
            (id) =>
              `<span class="bd-sp-tag" style="color:${SOUL_TAG_COLOR[id] || ''}">${SOUL_TAG[id] || id}</span>`,
          )
          .join('');
        return min`
    <div class="dm-chara-header">
      <img loading="lazy" src="../icons/soul/${s.id}.png" onerror="this.style.display='none'"
        style="width:80px;height:auto;border-radius:6px;flex-shrink:0" alt="">
      <div class="dm-chara-info">
        <div class="dm-chara-title">${escHtml(s.name)}</div>
        <div class="dm-chara-meta">
          <span class="dm-meta-chip" style="font-weight:700;letter-spacing:1px">${stars}</span>
          <span class="dm-meta-chip">Lv.${s.max_level || '?'}</span>
          ${s.url ? `<a class="dm-meta-chip" href="${s.url}" target="_blank" style="color:var(--accent);text-decoration:none">Altema ↗</a>` : ''}
        </div>
        ${tagsHtml ? `<div class="dm-chara-tags" style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px">${tagsHtml}</div>` : ''}
      </div>
    </div>
    <div class="dm-section"><div class="dm-section-title">属性相性</div><div class="sdm-aff-grid">${elemCells}</div></div>
    <div class="dm-section"><div class="dm-section-title">得意武器</div><div class="sdm-aff-grid">${weapCells}</div></div>
    ${skills.length ? min`<div class="dm-section"><div class="dm-section-title">スキル構成 (${skills.length})</div><div class="dm-skills-list">${skillCards}</div></div>` : ''}
    ${acqHtml}`;
      };

      // ===== BG DETAIL =====
      export const _bgScopeLabel = (e) => {
        // 直读 element / weapon (adapter 已不再注入 eff.scope)
        if (e.element != null) return (ELEMENT[e.element] || e.element) + '属性のみ';
        if (e.weapon != null) {
          const t = [].concat(e.weapon);
          return t.map((v) => WEAPON[v] || v).join('/') + 'のみ';
        }
        return '';
      };
      export const renderDMBg = (b) => {
        const effRows = (b.effects || [])
          .map((ef) => {
            const btags = _efBadges(ef);
            const cond = ef.condition
              ? `<span class="cond-tag cond-${ef.condition}">${CONDITION[ef.condition] || ''}</span>`
              : '';
            const sl = _bgScopeLabel(ef);
            const scope = sl ? `<span class="scope-tag scope-lim">${escHtml(sl)}</span>` : '';
            const val =
              ef.bairitu != null
                ? `<span class="tag-val">${ef.calc_type === 1 ? _addP(ef.bairitu) : '×'}${fmtLarge(ef.bairitu)}</span>`
                : '';
            return `<div class="bgdm-eff-line">${btags}${cond}${scope}${val}</div>`;
          })
          .join('');
        const fields = [];
        if (b.effect_text) fields.push(['効果', `<span>${escHtml(b.effect_text)}</span>`]);
        if (effRows) fields.push(['効果量', effRows]);
        if (b.time_start) fields.push(['期間', escHtml(b.time_start + '〜' + b.time_end)]);
        if (b.acquisition) fields.push(['入手方法', escHtml(b.acquisition)]);
        if (b.illustrator) fields.push(['イラスト', escHtml(b.illustrator)]);
        const fieldHtml = fields
          .map(
            ([k, v]) =>
              `<div class="bgdm-field-row"><div class="bgdm-field-key">${k}</div><div class="bgdm-field-val">${v}</div></div>`,
          )
          .join('');
        return min`
    <div class="bgdm-layout">
      <div class="bgdm-fields">${fieldHtml || '<div style="color:var(--text2)">データなし</div>'}</div>
      <div class="bgdm-img-wrap">
        <img loading="lazy" src="../icons/bg/${b.id}.png" onerror="this.style.display='none'" alt="">
        <div class="bgdm-img-rarity">★${b.rarity}</div>
      </div>
    </div>`;
      };

      // ===== MASOU DETAIL =====
      export const renderDMMasou = (m) => {
        // masou.effects 是 master shape ({parameter, math_type, value, value_scaling, effect_text})
        const effRows = (m.effects || [])
          .map((e) => {
            if (!e || e.parameter === 'NoEffect') return '';
            const ef = { _parameter: e.parameter, bairitu: e.value, calc_type: e.math_type === 'Addition' ? 1 : 0 };
            const btags = _efBadges(ef);
            const sc = e.value_scaling
              ? `<span style="color:var(--text2);font-size:11px"> (+${e.value_scaling}×熟度)</span>`
              : '';
            const val =
              ef.bairitu != null
                ? `<span class="tag-val">${ef.calc_type === 1 ? _addP(ef.bairitu) : '×'}${fmtLarge(ef.bairitu)}</span>${sc}`
                : '';
            return `<div class="bgdm-eff-line">${btags}${val}</div>`;
          })
          .filter(Boolean)
          .join('');
        const effTexts = (m.effects || []).map((e) => e?.effect_text).filter(Boolean).join(' / ');
        const fields = [];
        if (effTexts) fields.push(['効果', `<span>${escHtml(effTexts)}</span>`]);
        if (effRows) fields.push(['効果量', effRows]);
        const baseChara = m.weapon_base_id ? allCharas.find((c) => c._master?.id === m.weapon_base_id) : null;
        if (baseChara) fields.push(['対応魔剣', escHtml(baseChara.name)]);
        const fieldHtml = fields
          .map(
            ([k, v]) =>
              `<div class="bgdm-field-row"><div class="bgdm-field-key">${k}</div><div class="bgdm-field-val">${v}</div></div>`,
          )
          .join('');
        return min`
    <div class="bgdm-layout">
      <div class="bgdm-fields">${fieldHtml || '<div style="color:var(--text2)">データなし</div>'}</div>
      <div class="bgdm-img-wrap"><img loading="lazy" src="../icons/masou/${m.id}.png" onerror="this.parentElement.style.display='none'" alt=""></div>
    </div>`;
      };

      // ===== CRYSTAL DETAIL =====
      export const renderDMCrystal = (c) => {
        const fields = [];
        if (c.effect_text) fields.push(['効果', escHtml(c.effect_text)]);
        if (c.description) fields.push(['説明', escHtml(c.description).replace(/\n/g, '<br>')]); // 効果量 上方
        (c.effects || []).forEach((ef) => {
          if (ef.bairitu != null || ef.bairitu_init != null) {
            const mn = ef.bairitu_init,
              mx = ef.bairitu;
            const pfx = ef.calc_type === 1 ? _addP(mn != null ? mn : mx) : '×';
            let range;
            if (mn != null && mx != null && mn !== mx) {
              range = pfx + fmtLarge(mn) + '～' + pfx + fmtLarge(mx);
            } else {
              range = pfx + fmtLarge(mn ?? mx);
            }
            const btags = _efBadges(ef);
            const scopeTag = fmtScopeTag(ef);
            fields.push([
              '効果量',
              `<div class="bgdm-eff-line">${btags}${scopeTag}<span class="tag-val">${range}</span></div>`,
            ]);
          }
          if (ef.condition)
            fields.push(['発動条件', escHtml(CONDITION[ef.condition] || String(ef.condition))]);
        });

      export const switchDMState = (label) => {
        document
          .querySelectorAll('.dm-state-tab')
          .forEach((t) => t.classList.toggle('active', t.dataset.state === label));
        document
          .querySelectorAll('.dm-state-content')
          .forEach((d) => d.classList.toggle('active', d.dataset.state === label));

      export const renderDMState = (state, stateLabel, chara) => {
        const parts = [];
        const dead = new Set(
          chara && Array.isArray(chara._deleted_skills) ? chara._deleted_skills : [],
        );
        const baseSkills = (state.skills || []).filter((sk) => !dead.has(sk.name || ''));
        const addedSkills = (chara && chara._added_skills && chara._added_skills[stateLabel]) || [];
        const allSkills = baseSkills.concat(addedSkills);
        if (allSkills.length) {
          const cards = allSkills
            .map((s) => {
              const tags = dmRightTags(s);
              const bairitu = fmtBairitu(s);
              return min`
        <div class="dm-skill-card">
          <div class="dm-skill-name-row">
            <span class="dm-skill-name">${escHtml(s.name || '')}</span>${tags}
          </div>
          <div class="dm-skill-eff-row">
            <span class="dm-skill-eff">${escHtml(s.effect_text || '')}</span>
            <span class="dm-skill-bairitu">${bairitu}</span>
          </div>
        </div>`;

            .join('');

            `<div class="dm-section"><div class="dm-section-title">スキル構成 (${allSkills.length})</div><div class="dm-skills-list">${cards}</div></div>`,

          parts.push(
            `<div class="dm-section"><div class="dm-section-title">基本情報</div>${renderDMBasicInfo(state.basic_info)}</div>`,

      export const dmRightTags = (s) => {
        let tags = '';
        (s.effects || []).forEach((e) => {
          tags += _efBadges(e);
          // 直读 master range / element / weapon / weapon_base_id (adapter 已不再注入 eff.scope)
          if (e.weapon_base_id) {
            tags += `<span class="scope-tag scope-lim">キャラ限</span>`;
          } else if (e.element != null || e.weapon != null) {
            const lim =
              e.element != null
                ? ELEMENT[[].concat(e.element)[0]] || '限'
                : WEAPON[[].concat(e.weapon)[0]] || '限';
            tags += `<span class="scope-tag scope-lim">${lim}</span>`;
          } else if (e.range === 'All') {
            tags += `<span class="scope-tag scope-all">全</span>`;
          } else {
            tags += `<span class="scope-tag scope-self">自</span>`;
          }
          if (e.condition)
            tags += `<span class="cond-tag cond-${e.condition}">${CONDITION[e.condition] || ''}</span>`;

      // ===== MOBILE SLOT FLIP =====
      let mobileActiveSlot = 0;
      let _txStart = 0,
        _tyStart = 0;
      const MOB_DUR = 200;

      export const isMob = () => {
        return window.innerWidth <= 760;
      };

      export const msiClick = (idx) => {
        if (idx >= teamSize) return;
        flipMobSlot(idx, idx > mobileActiveSlot ? 1 : -1);
      };

      export const updateMobIndicator = () => {
        document.querySelectorAll('.msi-dot').forEach((d, i) => {
          d.classList.toggle('active', i === mobileActiveSlot);
          d.classList.toggle('mob-disabled', i >= teamSize);
        });
      };

      export const updateMobVisible = () => {
        if (!isMob()) {
          for (let i = 0; i < 3; i++)
            document.getElementById('slot-' + i)?.classList.remove('mob-hidden');
          return;
        }
        for (let i = 0; i < 3; i++)
          document
            .getElementById('slot-' + i)
            ?.classList.toggle('mob-hidden', i !== mobileActiveSlot);
        updateMobIndicator();
      };

      const _MOB_ANIM = ['mob-anim-outL', 'mob-anim-outR', 'mob-anim-inR', 'mob-anim-inL'];
      export const _clearMobAnim = (el) => {
        _MOB_ANIM.forEach((c) => el.classList.remove(c));
      };

      export const flipMobSlot = (nextIdx, dir) => {
        // wrap around within enabled slots
        nextIdx = ((nextIdx % teamSize) + teamSize) % teamSize;
        if (nextIdx === mobileActiveSlot) return;
        const cur = document.getElementById('slot-' + mobileActiveSlot);
        const nxt = document.getElementById('slot-' + nextIdx);
        if (!cur || !nxt) return;
        const outCls = dir > 0 ? 'mob-anim-outL' : 'mob-anim-outR';
        const inCls = dir > 0 ? 'mob-anim-inR' : 'mob-anim-inL';
        _clearMobAnim(cur);
        cur.classList.add(outCls);
        cur.addEventListener('animationend', function h() {
          cur.removeEventListener('animationend', h);
          _clearMobAnim(cur);
          cur.classList.add('mob-hidden');
          _clearMobAnim(nxt);
          nxt.classList.remove('mob-hidden');
          nxt.classList.add(inCls);
          mobileActiveSlot = nextIdx;
          updateMobIndicator();
          nxt.addEventListener('animationend', function h2() {
            nxt.removeEventListener('animationend', h2);
            _clearMobAnim(nxt);
          });
        });
      };

      const _sGrid = document.getElementById('slots-grid');
      let _swipeBlocked = false;
      _sGrid.addEventListener(
        'touchstart',
        (e) => {
          _txStart = e.touches[0].clientX;
          _tyStart = e.touches[0].clientY;
          _swipeBlocked = !!e.target.closest('input[type=range]');
        },
        { passive: true },
      );
      _sGrid.addEventListener(
        'touchend',
        (e) => {
          if (!isMob() || _swipeBlocked) return;
          const dx = _txStart - e.changedTouches[0].clientX;
          const dy = Math.abs(_tyStart - e.changedTouches[0].clientY);
          if (Math.abs(dx) > 50 && Math.abs(dx) > dy * 1.5) {
            if (dx > 0) flipMobSlot(mobileActiveSlot + 1, 1);
            else flipMobSlot(mobileActiveSlot - 1, -1);
          }
        },
        { passive: true },
      );

      window.addEventListener('resize', updateMobVisible);

      // ===== STAT TRACE MODAL（IS_LOCAL_DEV のみ）=====
      // 各 stat の計算 trace を stage 別に展開表示。GitHub Pages では UI 入口無効・本ブロック全部 no-op。
      const _statTraceState = { slot: -1, statKey: '攻撃力', openStages: new Set() };

      const _STAT_TRACE_TABS = ['攻撃力', '防御力', 'HP', 'ブレイク力', 'Hit', '転速', '攻速', 'ダメ上限'];

      const _fmtTraceVal = (v) => {
        if (v == null || !Number.isFinite(v)) return '-';
        if (Math.abs(v) >= 10000 || (Math.abs(v) > 0 && Math.abs(v) < 0.01))
          return v.toExponential(3);
        return (+v.toFixed(4)).toString();
      };
      const _fmtTraceStat = (v) => {
        if (v == null || !Number.isFinite(v)) return '-';
        if (Math.abs(v) >= 1e13) return v.toExponential(4);
        return Math.round(v * 100) / 100 < 1
          ? (+v.toFixed(4)).toString()
          : Math.round(v).toLocaleString('en-US');
      };
      const _opSymbol = (op, val) => {
        if (op === 'add' || op === 'final-add') return +val < 0 ? '' : '+'; // addition 负值不前缀 '+'
        if (op === 'mul' || op === 'final-mul') return '×';
        return op;
      };

      // Hit / 攻速 tab は 3 stage を 1 view に統合表示するため特別扱い。
      const _statTraceMatch = (step, statKey) => {
        if (statKey === 'Hit') return /^Hit[123]$/.test(step.stat);
        if (statKey === '攻速') return /^攻速[123]$/.test(step.stat);
        return step.stat === statKey;
      };

      const _statTraceFinalValue = (trace, statKey) => {
        if (!trace) return null;
        if (statKey === 'Hit' || statKey === '攻速') return null; // array なので別途
        if (statKey === 'ダメ上限') {
          let last = trace.damageLimitBase;
          for (const st of trace.stages)
            for (const s of st.steps) if (s.stat === 'ダメ上限') last = s.after;
          return last;
        }
        if (statKey === '転速') {
          let last = trace.speedBase;
          for (const st of trace.stages)
            for (const s of st.steps) if (s.stat === '転速') last = s.after;
          return last;
        }
        let last = trace.base[statKey];
        for (const st of trace.stages)
          for (const s of st.steps) if (s.stat === statKey) last = s.after;
        return last;
      };

      const _statTraceBase = (trace, statKey) => {
        if (!trace) return 0;
        if (statKey === 'Hit' || statKey === '攻速') return 0;
        if (statKey === 'ダメ上限') return trace.damageLimitBase;
        if (statKey === '転速') return trace.speedBase || 0;
        return trace.base[statKey] || 0;
      };

      export const openStatTrace = (si, statKey) => {
        if (!IS_LOCAL_DEV) return;
        _statTraceState.slot = si;
        _statTraceState.statKey = statKey;
        _statTraceState.openStages = new Set(); // 全 stage 折りたたみで開始
        const r = _lastTrace[si];
        const c = allCharas.find((x) => x.id === team[si].chara);
        const title = document.getElementById('stat-trace-title');
        if (title) title.textContent = `Slot${si + 1}  ${c?.name || ''} — 計算明細`;
        _renderStatTraceTabs();
        _renderStatTraceBody();
        document.getElementById('stat-trace-modal').classList.add('open');
      };

      export const closeStatTrace = () => {
        const el = document.getElementById('stat-trace-modal');
        if (el) el.classList.remove('open');
      };

      export const setStatTraceTab = (statKey) => {
        _statTraceState.statKey = statKey;
        _statTraceState.openStages = new Set();
        _renderStatTraceTabs();
        _renderStatTraceBody();
      };

      export const toggleStatTraceStage = (key) => {
        if (_statTraceState.openStages.has(key)) _statTraceState.openStages.delete(key);
        else _statTraceState.openStages.add(key);
        _renderStatTraceBody();
      };

      const _renderStatTraceTabs = () => {
        const cur = _statTraceState.statKey;
        const html = _STAT_TRACE_TABS
          .map((k) => {
            const label =
              k === '攻撃力' ? '攻撃力' : k === 'ブレイク力' ? 'BK' : k === 'Hit' ? 'Hit数' : k;
            return `<button class="${cur === k ? 'on' : ''}" onclick="setStatTraceTab('${k}')">${label}</button>`;
          })
          .join('');
        document.getElementById('stat-trace-tabs').innerHTML = html;
      };

      const _renderStatTraceBody = () => {
        const si = _statTraceState.slot;
        const statKey = _statTraceState.statKey;
        const r = _lastTrace[si];
        const body = document.getElementById('stat-trace-body');
        if (!r || !r.trace) {
          body.innerHTML = '<div style="padding:20px;color:var(--text2)">trace なし</div>';
          return;
        }
        const trace = r.trace;

        // 攻速 tab: 3 段 (攻速1/2/3) 並べ、Hit と同 pattern
        if (statKey === '攻速') {
          let html = `<div class="trace-base">Base motion_speed: [${(trace.motionBase || []).map((v) => _fmtTraceVal(v)).join(', ')}]</div>`;
          for (const stage of trace.stages) {
            const msSteps = stage.steps.filter((s) => /^攻速[123]$/.test(s.stat));
            if (!msSteps.length) continue;
            const open = _statTraceState.openStages.has(stage.key);
            html += `<div class="trace-stage">
        <div class="trace-stage-head" onclick="toggleStatTraceStage('${stage.key}')">
          <span><span class="arrow">${open ? '▼' : '▶'}</span> ${escHtml(stage.label)}</span>
          <span class="trace-stage-tot">${msSteps.length} 件</span>
        </div>`;
            if (open) {
              html += msSteps
                .map(
                  (s) => `<div class="trace-step">
          <span class="src" title="${escHtml(s.src)}">${escHtml(s.src)} [${s.stat}]</span>
          <span class="op">${_opSymbol(s.op, s.val)}</span>
          <span class="val">${_fmtTraceVal(s.val)}</span>
          <span class="after">${_fmtTraceVal(s.before)} → ${_fmtTraceVal(s.after)}</span>
        </div>`,
                )
                .join('');
            }
            html += `</div>`;
          }
          const spds = (r.motionSpeed?.speeds || []).map((v) => _fmtTraceVal(v));
          const frs = r.motionSpeed?.durationsFrames || [];
          html += `<div class="trace-final">最終 speeds: [${spds.join(', ')}]  frames: [${frs.map((v) => v || '—').join(', ')}] 計 ${frs.reduce((a, b) => a + (b || 0), 0)}fr</div>`;
          body.innerHTML = html;
          return;
        }

        // Hit tab は 3 stage の hits を並べる
        if (statKey === 'Hit') {
          let html = `<div class="trace-base">Base hits: [${(trace.hitsBase || []).join(', ')}]</div>`;
          for (const stage of trace.stages) {
            const hitSteps = stage.steps.filter((s) => /^Hit[123]$/.test(s.stat));
            if (!hitSteps.length) continue;
            const open = _statTraceState.openStages.has(stage.key);
            html += `<div class="trace-stage">
        <div class="trace-stage-head" onclick="toggleStatTraceStage('${stage.key}')">
          <span><span class="arrow">${open ? '▼' : '▶'}</span> ${escHtml(stage.label)}</span>
          <span class="trace-stage-tot">${hitSteps.length} 件</span>
        </div>`;
            if (open) {
              html += hitSteps
                .map(
                  (s) => `<div class="trace-step">
          <span class="src" title="${escHtml(s.src)}">${escHtml(s.src)} [${s.stat}]</span>
          <span class="op">${_opSymbol(s.op, s.val)}</span>
          <span class="val">${_fmtTraceVal(s.val)}</span>
          <span class="after">${s.before} → ${s.after}</span>
        </div>`,
                )
                .join('');
            }
            html += `</div>`;
          }
          const finalHits = r.hits.map((h) => Math.floor(+h || 0));
          html += `<div class="trace-final">最終 hits: [${finalHits.join(', ')}]  合計 ${finalHits.reduce((a, b) => a + b, 0)}</div>`;
          body.innerHTML = html;
          return;
        }

        const base = _statTraceBase(trace, statKey);
        const finalVal = _statTraceFinalValue(trace, statKey);
        let html = `<div class="trace-base">${escHtml(statKey)} base: ${_fmtTraceStat(base)}</div>`;

        // tab 只显示自己相关的 stage (其他属性専用 stage 不渲染、即便空也不显示 無し)
        const _SPECIAL_STAGES = { 'ダメ上限': 's10_damage_limit', '転速': 's11_speed', 'HP': 's_hp_fold' };
        const _NON_CALC = new Set(['s9_hits', 's10_damage_limit', 's11_speed', 's12_motion', 's_hp_fold']);
        const _stageRelevant = (stage) => {
          const special = _SPECIAL_STAGES[statKey];
          if (special) return stage.key === special;
          return !_NON_CALC.has(stage.key);   // 攻撃力/防御力/HP/BK → calc stages のみ
        };

        for (const stage of trace.stages) {
          if (!_stageRelevant(stage)) continue;
          const steps = stage.steps.filter((s) => _statTraceMatch(s, statKey));
          const isEmpty = steps.length === 0;
          const open = _statTraceState.openStages.has(stage.key);
          const stageBefore = isEmpty ? null : steps[0].before;
          const stageAfter = isEmpty ? null : steps[steps.length - 1].after;
          const headRight = isEmpty
            ? '<span class="trace-stage-tot">（無し）</span>'
            : `<span class="trace-stage-tot">${_fmtTraceStat(stageBefore)} → ${_fmtTraceStat(stageAfter)}</span>`;
          html += `<div class="trace-stage${isEmpty ? ' empty' : ''}">
      <div class="trace-stage-head" onclick="toggleStatTraceStage('${stage.key}')">
        <span><span class="arrow">${open ? '▼' : '▶'}</span> ${escHtml(stage.label)}</span>
        ${headRight}
      </div>`;
          if (open && !isEmpty) {
            html += steps
              .map(
                (s) => `<div class="trace-step">
        <span class="src" title="${escHtml(s.src)}">${escHtml(s.src)}</span>
        <span class="op">${_opSymbol(s.op, s.val)}</span>
        <span class="val">${_fmtTraceVal(s.val)}</span>
        <span class="after">${_fmtTraceStat(s.before)} → ${_fmtTraceStat(s.after)}</span>
      </div>`,
              )
              .join('');
          }
          html += `</div>`;
        }

        // 最終 + sanity check
        const displayed =
          statKey === '攻撃力'
            ? r.stats['攻撃力']
            : statKey === 'ダメ上限'
              ? r.damageLimit
              : statKey === '転速'
                ? r.speed?.latestRecover
                : r.stats[statKey];
        const mismatch =
          displayed != null && finalVal != null && Math.abs(displayed - finalVal) > 1e-3;
        html += `<div class="trace-final">最終: ${_fmtTraceStat(finalVal)}${mismatch ? '  ⚠ 表示値 ' + _fmtTraceStat(displayed) + ' と不一致' : '  ✓'}</div>`;
        if (statKey === '攻撃力') {
          html += `<div class="trace-final" style="opacity:.7;font-weight:400">攻撃力 min = max × 0.95 = ${_fmtTraceStat(finalVal * 0.95)}</div>`;
        }
        if (statKey === '転速') {
          const cf = r.speed?.cooldownFrames || 0;
          const sf = r.speed?.setFrames || 0;
          html += `<div class="trace-final" style="opacity:.7;font-weight:400">cooldown = ceil(6000 / recover) = ${cf}fr (+set ${sf}fr = ${cf + sf}fr)</div>`;
        }
        body.innerHTML = html;
      };

      // IS_LOCAL_DEV のみ stat-trace modal を body 末尾に注入
      if (IS_LOCAL_DEV) {
        document.body.insertAdjacentHTML(
          'beforeend',
          `
<div id="stat-trace-modal">
  <div class="modal-overlay" onclick="closeStatTrace()"></div>
  <div class="modal-panel stat-trace-panel">
    <div class="modal-header">
      <span class="modal-header-title" id="stat-trace-title">計算明細</span>
      <button class="modal-close" onclick="closeStatTrace()">✕</button>
    </div>
    <div class="stat-trace-tabs" id="stat-trace-tabs"></div>
    <div class="stat-trace-body" id="stat-trace-body"></div>
  </div>
</div>`,
        );
      }

      // === expose public API to window for inline handlers ===
      // 用 getter 保持 module-scope 变量重新赋值后能反映到 window.state (data fetch 完才填 allCharas)
      window.state = {
        get team() { return team; },
        get enemy() { return enemy; },
        get allCharas() { return allCharas; },
        get allSouls() { return allSouls; },
        get allCrystals() { return allCrystals; },
        get allBGs() { return allBGs; },
        get allMasou() { return allMasou; },
      };
      window.mf = mf;
      Object.assign(window, {
        emblemLvMax,
        elementMatchupMult,
        mkTr,
        crystalSlotCount,
        fmtVal,
        fmtScopeTag,
        renderEfRow,
        renderSkillsPanel,
        renderBgPanel,
        renderMasouPanel,
        renderCrystalEffList,
        autoAssignSoul,
        syncCrystals,
        setTeamSize,
        openIoModal,
        closeIoModal,
        copyIoString,
        copyIoUrl,
        ioDownloadJson,
        ioImportString,
        triggerImportHensei,
        importHenseiFile,
        setBdCount,
        setChara,
        setSoul,
        setBG,
        setCrystal,
        setCrystalDim,
        setMasou,
        clearSlot,
        cryLvMax,
        openCrystalDimPopover,
        closeCrystalDimPopover,
        resetCrystalDim,
        setTrField,
        setJukudoSlider,
        setAwakeningSlider,
        setTrNum,
        setLevel,
        setLevelInput,
        setHpSlider,
        setHpInput,
        setMpSlider,
        setMpInput,
        setAffinity,
        setSoulLv,
        setSoulAwk,
        renderSoulTraining,
        renderTraining,
        soulMultiplier,
        soulLvCap,
        computeStats,
        renderEnemyBar,
        setEnemyElem,
        setEnemyBk,
        setEnemyMode,
        setEnemyBkRes,
        setEnemyDiff,
        setEnemyGuildTitle,
        setEnemyBdCap,
        openBdCapMaxPopup,
        toggleAdvWeapon,
        setEmblem,
        setEmblemLv,
        openEmblemModal,
        closeEmblemModal,
        toggleEmblemRarity,
        resetEmblemFilter,
        selectEmblem,
        pickOmoide,
        equipAllOmoide,
        clearAllOmoide,
        openOmoideModal,
        closeOmoideModal,
        renderStatsPanel,
        refreshStatsPanel,
        refreshAllStats,
        openEM,
        closeEM,
        buildEMSidebar,
        fsec,
        resetEM,
        applyEM,
        renderSortBadge,
        renderEMList,
        selectEM,
        openDetailModal,
        closeDetailModal,
        selectFromDetail,
        renderDMSoul,
        renderDMBg,
        renderDMMasou,
        renderDMCrystal,
        renderDMChara,
        switchDMState,
        renderDMState,
        dmRightTags,
        renderDMStats,
        renderDMBasicInfo,
        toggleDetail,
        renderAll,
        renderSlot,
        isMob,
        msiClick,
        updateMobIndicator,
        updateMobVisible,
        flipMobSlot,
        openStatTrace,
        closeStatTrace,
        setStatTraceTab,
        toggleStatTraceStage,
      });
    </script>
  </body>
