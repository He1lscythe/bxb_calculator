<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BxB 編成</title>
    <link rel="icon" href="../icons/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/nav.css" />
    <link rel="stylesheet" href="../css/shared.css" />
    <link rel="stylesheet" href="../css/hensei.css" />
  </head>
  <body>
    {{include _loading.html}}

    <div id="page-wrap">
      <div id="team-size-bar">
        <span class="ts-label">編成</span>
        <button class="size-btn" data-n="1" onclick="setTeamSize(1)">1体</button>
        <button class="size-btn" data-n="2" onclick="setTeamSize(2)">2体</button>
        <button class="size-btn on" data-n="3" onclick="setTeamSize(3)">3体</button>
        <button class="io-btn" style="margin-left: auto" onclick="openIoModal()" title="編成を コード/URL/.json で書き出し">export</button>
        <button class="io-btn" onclick="openIoModal()" title="編成を コード/ファイル から読み込み">import</button>
        <input type="file" id="hensei-import-file" accept="application/json,.json" style="display: none" onchange="importHenseiFile(this)" />
      </div>

      <!-- 敌方 / 副本 / 工会 信息（影响最终乘算）— 内容由 renderEnemyBar() 生成 -->
      <div id="enemy-bar"></div>

      <div id="mobile-slot-indicator">
        <div class="msi-dot" onclick="msiClick(0)"></div>
        <div class="msi-dot" onclick="msiClick(1)"></div>
        <div class="msi-dot" onclick="msiClick(2)"></div>
      </div>

      <div id="loading">データを読み込んでいます...</div>

      <div id="slots-grid" style="display: none">
        <div class="slot-card" id="slot-0"></div>
        <div class="slot-card" id="slot-1"></div>
        <div class="slot-card" id="slot-2"></div>
      </div>
    </div>
    <!-- page-wrap -->

    <!-- ===== ENTITY PICKER MODAL ===== -->
    <div id="entity-modal">
      <div class="modal-overlay" onclick="closeEM()"></div>
      <div class="modal-panel">
        <div class="modal-header">
          <span class="modal-header-title" id="em-title">選択</span>
          <button class="modal-close" onclick="closeEM()">✕</button>
        </div>
        <div class="modal-body">
          <div class="modal-sidebar" id="em-sidebar"></div>
          <div class="em-list" id="em-list"></div>
        </div>
      </div>
    </div>

    <!-- ===== EMBLEM MODAL（敵 enemy.emblems 4 槽位选择）===== -->
    <div id="emblem-modal">
      <div class="modal-overlay" onclick="closeEmblemModal()"></div>
      <div class="modal-panel">
        <div class="modal-header">
          <span class="modal-header-title">エンブレム選択</span>
          <button class="modal-close" onclick="closeEmblemModal()">✕</button>
        </div>
        <div class="modal-body">
          <div class="modal-sidebar" id="emblem-sidebar"></div>
          <div class="em-list" id="emblem-list"></div>
        </div>
      </div>
    </div>

    <!-- ===== OMOIDE MODAL ===== -->
    <div id="omoide-modal">
      <div class="modal-overlay" onclick="closeOmoideModal()"></div>
      <div class="modal-panel">
        <div class="modal-header">
          <span class="modal-header-title" id="omoide-modal-title">好感装備</span>
          <button class="modal-close" onclick="closeOmoideModal()">✕</button>
        </div>
        <div class="modal-body" id="omoide-modal-body"></div>
      </div>
    </div>

    <!-- ===== EXPORT / IMPORT MODAL ===== -->
    <div id="io-modal">
      <div class="modal-overlay" onclick="closeIoModal()"></div>
      <div class="modal-panel">
        <div class="modal-header">
          <span class="modal-header-title">編成 export / import</span>
          <button class="modal-close" onclick="closeIoModal()">✕</button>
        </div>
        <div class="modal-body io-body">
          <div class="io-sec">
            <div class="io-label">export</div>
            <textarea id="io-export-str" class="io-ta" rows="3" readonly></textarea>
            <div class="io-btns">
              <button class="io-btn" onclick="copyIoUrl()">copy url</button>
              <button class="io-btn" onclick="copyIoString()">copy code</button>
              <button class="io-btn" onclick="ioDownloadJson()">.json</button>
            </div>
          </div>
          <div class="io-sec">
            <div class="io-label">import</div>
            <textarea id="io-import-str" class="io-ta" rows="3" placeholder="paste code (bxb1:...) here"></textarea>
            <div class="io-btns">
              <button class="io-btn" onclick="ioImportString()">read code</button>
              <button class="io-btn" onclick="triggerImportHensei()">file</button>
            </div>
          </div>
          <div id="io-msg" class="io-msg"></div>
        </div>
      </div>
    </div>

    <!-- ===== DETAIL MODAL (stacked) ===== -->
    <div id="detail-modal">
      <div class="modal-overlay" onclick="closeDetailModal()"></div>
      <div class="modal-panel">
        <div class="modal-header">
          <span class="modal-header-title" id="dm-title"></span>
          <div style="display: flex; gap: 8px; align-items: center; flex-shrink: 0">
            <button class="dm-select-btn" id="dm-select-btn" onclick="selectFromDetail()">
              この魔剣を選択
            </button>
            <button class="modal-close" onclick="closeDetailModal()">✕</button>
          </div>
        </div>
        <div class="dm-body" id="dm-body"></div>
      </div>
    </div>

    <script type="module">
      import { Nav } from '../js/nav.js';
      import {
        ELEMENT,
        WEAPON,
        RARITY,
        CONDITION,
        CHARA_TAG,
        CHARA_TAG_COLOR,
        SOUL_TAG,
        SOUL_TAG_COLOR,
        ELEM_COLOR,
      } from '../shared/constants.js';
      import { FilterCore } from '../shared/filter-core.js';
      import { CHARA_SPEC } from '../shared/chara-spec.js';
      import { SOUL_SPEC } from '../shared/soul-spec.js';
      import { CRYSTAL_SPEC, crystalImageSrc } from '../shared/crystal-spec.js';
      import { BG_SPEC } from '../shared/bg-spec.js';
      import { PARAMETER_CLASS_LABEL, PARAMETER_CLASS_SHORT, COND_TRIGGER_LABEL, SCOPE_LABEL, classifyParameter } from '../shared/parameter-class.js';
      // hensei badge helper: _parameter(s) → PARAMETER_CLASS_SHORT
      const _efBadges = (ef) => {
        const paramList = Array.isArray(ef._parameters)
          ? ef._parameters
          : (ef._parameter ? [ef._parameter] : []);
        return paramList.map((p) => {
          const cls = classifyParameter(p);
          return `<span class="bunrui-tag">${PARAMETER_CLASS_SHORT[cls] || cls}</span>`;
        }).join('');
      };
      import {
        escHtml,
        fmtLarge,
        fmtBairitu,
        fmtHitStages,
        fmtAff,
        hideLoading,
        min,
        fmtNum,
        ctPfx,
      } from '../js/utils.js';
      import { deepApply } from '../shared/revise-core.js';
      // omoide_templates 已删除 (用户决策: omoide 数据走 Frida 抓包、走 chara._omoide_slots、不用 templates)
      import { adaptCharaList } from '../shared/chara-adapter.js';
      import { charaIconStack } from '../shared/image-paths.js';
      import { setupLazyImg } from '../shared/lazy-img.js';
      import { adaptSoulList } from '../shared/soul-adapter.js';
      import { adaptCrystalList } from '../shared/crystal-adapter.js';
      import { adaptMasouList } from '../shared/masou-adapter.js';
      import { adaptBgList } from '../shared/bg-adapter.js';
      // ===== stats-calc (Phase 6.1 4-stage) =====
      import {
        computeStats,
        baseStats,
        collectEffects,
        applyStaged,
        conditionFactor,
        baseParameter,
        repelRate,
        mkTr,
        AWAKENING_MAX as AWAKENING_MAX_TBL,
        AWAKENING_FULL_MULT as AWAKENING_MULT_TBL,
        _STAT_KEYS,
      } from '../shared/stats-calc.js';
      import {
        SOUL_AWK_MAX,
        EMBLEM_RARITY_LV_MAX,
        CRYSTAL_RARITY_LV_MAX,
        JUKUDO_MAX_TBL,
        LEVEL_MAX_TBL,
        LEVEL_1JUK_TBL,
        cryLvMax,
        crystalDimAvailability,
        crystalSliderStep,
        emblemLvMax,
        elementMatchupMult,
        soulAwkMax,
        soulLvCap,
        soulMultiplier,
        crystalEffectiveValue,
        resolveCharaSkills as _resolveCharaSkills,
        resolveSoulSkills as _resolveSoulSkills,
        parseHit as _parseHit,
        parseAff as _parseAff,
        BLAZE_GAUGE_POINTS_BASE_A,
      } from '../shared/hensei-helpers.js';
      // weight_step / purity_step: master 不含、revise 注入 (走 cr-edit dropdown)、缺省 null = slider 不显示
      const _parseScaling = () => 0;
      // addition 倍率显示: 负值不再前缀 '+' (避免 '+-x');非负才加 '+'。乘算/终乘符号照旧。
      const _addP = (v) => (+v < 0 ? '' : '+');
      const _crystalEffectiveBairitu = (cr, cfg) => crystalEffectiveValue(cr, cfg);
      // popover 实时倍率串: crystalEffectiveValue (随 lv/weight/purity 联动)、round 到 3 位小数 + calc_type 前缀
      const _crBairituStr = (cr, cfg) => {
        const v = Math.round(crystalEffectiveValue(cr, cfg) * 1000) / 1000;
        return (cr?.effects?.[0]?.calc_type === 1 ? _addP(v) : '×') + v;
      };

      Nav.init();

      // 仅本地 dev 環境で stats 計算 trace を表示。GitHub Pages 上では UI 入口無効・生成も no-op。
      // 判定対象：localhost / 127.0.0.1 / file:// / LAN IP (192.168.x.x / 10.x.x.x / 172.16-31.x.x) / *.local
      // （スマホ実機テスト時は LAN IP 経由でアクセスするため、これらも dev 扱い）。
      const IS_LOCAL_DEV = (() => {
        if (typeof location === 'undefined') return false;
        const h = location.hostname;
        if (!h || h === 'localhost' || h === '127.0.0.1' || location.protocol === 'file:')
          return true;
        if (h.endsWith('.local')) return true;
        if (/^192\.168\.\d+\.\d+$/.test(h)) return true;
        if (/^10\.\d+\.\d+\.\d+$/.test(h)) return true;
        if (/^172\.(1[6-9]|2\d|3[01])\.\d+\.\d+$/.test(h)) return true;
        return false;
      })();

      // 短链 API (编成 #hash → #s:<key>):local → start.py /share、否则 → Vercel /api/share
      const _SHARE_API = 'https://bxb-calculator.vercel.app/api/share';
      const _shareEndpoint = () => (IS_LOCAL_DEV ? '/share' : _SHARE_API);

      // ELEMENT / ELEM_COLOR / WEAPON / RARITY / BUNRUI / BUNRUI_SHORT / CONDITION /
      // CHARA_TAG 来自 shared/constants.js

      let allCharas = [],
        allSouls = [],
        allBGs = [],
        allCrystals = [],
        allMasou = [],
        masouByChara = {};
      let allGuildTitles = [],
        allGuildEmblems = [];
      let teamSize = 3;

      // ===== 敌方/副本/工会信息（影响最终乘算）=====
      // 默认 element=6 (無)、mode='normal' → 元素克制全 0、mult=1，不影响默认计算
      let enemy = {
        element: 6, // 1-6（攻击方=魔剣 element，被攻击方=enemy.element）
        bk: false, // BK状態 false=なし true=あり
        mode: 'normal', // 'normal' | 'guildbattle' | 'guildbattle_special' | 'other'
        bkResistance: 'normal', // 'normal' | 'high'（仅 ギルバト/特別版 时有效）
        advantageWeapons: new Set(), // 1-12 武器 ID 集合（仅 ギルバト/特別版 有效）
        difficulty: 'Normal', // 'Normal' | 'Hard' | 'Lunatic'（仅 ギルバト/特別版 有效）
        guildTitle: null, // guildtitles.json 中的 id
        // 默认 4 槽: 攻撃力アップⅠ(id1) / 攻撃力アップⅡ(id4) / タキサイキア(id16) / マスタープラン(id17)、均满级
        emblems: [
          { id: 1, level: 25 },
          { id: 4, level: 40 },
          { id: 16, level: 55 },
          { id: 17, level: 55 },
        ],
        bd_cap: 0, // 副本 BD 上限（0-9 整数）。倍率 = 1 + (bd_cap // 2) * 0.25
      };

      // ELEMENT_K_* / EMBLEM_RARITY_LV_MAX / CRYSTAL_RARITY_LV_MAX / emblemLvMax /
      // cryLvMax / elementMatchupMult / mkTr / JUKUDO_MAX_TBL / LEVEL_MAX_TBL /
      // LEVEL_1JUK_TBL / AWAKENING_MAX_TBL / AWAKENING_MULT_TBL 都 import 自 stats-calc.js。
      let team = [0, 1, 2].map(() => ({
        chara: null,
        soul: null,
        bg: null,
        masou: null,
        crystals: [],
        tr: mkTr(),
      }));

      let SENZAI_TABLE = {};
      fetch('../data/senzai_table.json')
        .then((r) => (r.ok ? r.json() : {}))
        .then((d) => {
          SENZAI_TABLE = d;
        })
        .catch(() => {});

      export const _applyRevise = (arr, revise) => {
        if (!Array.isArray(revise)) return;
        const idx = new Map(arr.map((c, i) => [c.id, i]));
        revise.forEach((r) => {
          const i = idx.get(r.id);
          if (i != null) deepApply(arr[i], r);
        });
      };

      Promise.all([
        fetch('../data/characters.json').then((r) => r.json()),
        fetch('../data/souls.json').then((r) => r.json()),
        fetch('../data/bladegraphs.json').then((r) => r.json()),
        fetch('../data/crystals.json').then((r) => r.json()),
        fetch('../data/masou.json')
          .then((r) => (r.ok ? r.json() : []))
          .catch(() => []),
        fetch('../data/chara_revise.json')
          .then((r) => (r.ok ? r.json() : []))
          .catch(() => []),
        fetch('../data/soul_revise.json')
          .then((r) => (r.ok ? r.json() : []))
          .catch(() => []),
        fetch('../data/crystal_revise.json')
          .then((r) => (r.ok ? r.json() : []))
          .catch(() => []),
        fetch('../data/masou_revise.json')
          .then((r) => (r.ok ? r.json() : []))
          .catch(() => []),
        fetch('../data/bg_revise.json')
          .then((r) => (r.ok ? r.json() : []))
          .catch(() => []),
        fetch('../data/guildtitles.json')
          .then((r) => (r.ok ? r.json() : []))
          .catch(() => []),
        fetch('../data/guildemblems.json')
          .then((r) => (r.ok ? r.json() : []))
          .catch(() => []),
      ])
        .then(
          ([
            ch,
            so,
            bg,
            cr,
            ms,
            chRev,
            soRev,
            crRev,
            msRev,
            bgRev,
            gt,
            ge,
          ]) => {
            // master schema → wiki shape via adapter (Phase 6.2)
            // Phase 7 Session 2: 4 adapter 都接 revise (deepApply patch 到 master 再转 wiki shape)
            // 2026-06-09: bg-adapter 也接 revise (acquisition 走 revise)
            ch = adaptCharaList(ch, chRev);
            so = adaptSoulList(so, soRev);
            bg = adaptBgList(bg, bgRev);
            cr = adaptCrystalList(cr, crRev);
            ms = adaptMasouList(ms, msRev);
            allCharas = ch.sort((a, b) => (b.sort_id || b.id) - (a.sort_id || a.id));
            allSouls = so.sort((a, b) => b.rarity - a.rarity || b.id - a.id);
            allBGs = bg.sort((a, b) => b.rarity - a.rarity || b.id - a.id);
            allCrystals = cr
              .filter((c) => !c.tombstone)
              .sort((a, b) => b.rarity - a.rarity || b.id - a.id);
            allMasou = Array.isArray(ms) ? ms : [];
            masouByChara = {};
            allMasou.forEach((m) => {
              // masou.json 用 weapon_base_id (chara base_id 4位) 关联、不再叫 chara_id
              if (m.weapon_base_id != null)
                (masouByChara[m.weapon_base_id] = masouByChara[m.weapon_base_id] || []).push(m);
            });
            allGuildTitles = Array.isArray(gt) ? gt : [];
            allGuildEmblems = Array.isArray(ge) ? ge : [];
            document.getElementById('loading').style.display = 'none';
            document.getElementById('slots-grid').style.display = 'grid';
            renderEnemyBar();
            renderAll();
            updateMobVisible();
            hideLoading();
            // URL #hash 分享码 → 自动载入配置 (用完清掉 hash、避免 reload 重复应用)
            const _h = decodeURIComponent((location.hash || '').replace(/^#/, ''));
            const _clearHash = () => history.replaceState(null, '', location.pathname + location.search);
            const _sm = _h.match(/^s:([A-Za-z0-9_-]{1,16})$/);
            if (_sm) {
              // 短链 #s:<key> → GET 反查回 bxb1 串再解码;失败留住 hash、静默
              fetch(_shareEndpoint() + '?k=' + encodeURIComponent(_sm[1]))
                .then((r) => (r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status))))
                .then((j) => _decodeHensei(j.hash))
                .then((o) => { _applyHenseiConfig(o); _clearHash(); })
                .catch(() => {});
            } else if (/^bxb[01]:/.test(_h)) {
              _decodeHensei(_h)
                .then((o) => { _applyHenseiConfig(o); _clearHash(); })
                .catch(() => {});
            }
          },
        )
        .catch(() => {
          hideLoading();
          document.getElementById('loading').textContent =
            'データ読み込み失敗。start.py を起動してください。';
        });

      // ===== HELPERS =====
      const getBestState = (c) => {
        for (const s of ['極弐', '改造', '通常']) if (c?.states?.[s]) return c.states[s];
        return null;
      };

      // 秘録記憶 (desc [結晶枠+1(上限1)]): weapon_base_id が自分の base_id と一致する
      // 秘録記憶を装備中 → 結晶枠 +1。複数装備でも +1 のみ (上限1、some で自然に cap)
      const _hasOwnHiroku = (c, crystals) => {
        const baseId = c?._master?.id;
        if (!baseId || !Array.isArray(crystals)) return false;
        return crystals.some((cfg) => {
          if (!cfg?.id) return false;
          const cr = allCrystals.find((x) => x.id === cfg.id);
          return !!(cr && (cr.name || '').includes('秘録記憶') && cr.weapon_base_id === baseId);
        });
      };
      export const crystalSlotCount = (c, slotIdx) => {
        if (!c) return 0;
        const trState = slotIdx != null ? team[slotIdx]?.tr?.state : null;
        const st = trState && c.states?.[trState] ? c.states[trState] : getBestState(c);
        let n = parseInt(st?.basic_info?.['結晶スロット'] ?? 0) || 0;
        // 結婚（marriage != 0）→ 結晶スロット +1
        if (slotIdx != null && team[slotIdx]?.tr?.marriage) {
          n += 1;
        }
        // 自分の秘録記憶 装備中 → 結晶枠 +1 (上限1)
        if (slotIdx != null && _hasOwnHiroku(c, team[slotIdx]?.crystals)) {
          n += 1;
        }
        return n;
      };

      export const fmtVal = (ef) => {
        const bunrui = ef.bunrui || [];
        const isHitOnly = bunrui.length === 1 && bunrui[0] === 7;
        if (isHitOnly) return fmtHitStages(ef);
        let v = '';
        if (ef.bairitu != null && ef.bairitu !== 0) {
          const sc = ef.bairitu_scaling;
          // ct: 0=×, 1=+, 2=+(終), 3=×(終)
          const ct = ef.calc_type ?? 0;
          const pfx = ct === 1 ? _addP(ef.bairitu) : ct === 2 ? (ef.bairitu < 0 ? '(終)' : '+(終)') : ct === 3 ? '×(終)' : 'x';
          const isAddCt = ct === 1 || ct === 2;
          // inner: 加算は単値、乗算は init〜max 範囲対応
          let inner;
          if (!isAddCt) {
            const lo = ef.bairitu_init,
              hi = ef.bairitu;
            inner = lo != null && lo !== hi ? fmtLarge(lo) + '〜' + fmtLarge(hi) : fmtLarge(hi);
          } else {
            inner = fmtLarge(ef.bairitu);
          }
          // sc あり → 括弧で括って "+(v + sc * 熟度)"。なし → 単に "+v"。
          v = pfx + (sc ? '(' + inner + ' + ' + sc + ' * 熟度)' : inner);
        }
        if (bunrui.includes(7)) {
          const hitStr = fmtHitStages(ef);
          if (hitStr) v += (v ? ' / ' : '') + hitStr;
        }
        return v;
      };
      // scope tag のスタイル/略称は utils.js / soul-render.js と統一（自/全/X/X·自/X·全）。
      export const fmtScopeTag = (ef) => {
        const elStr =
          ef.element != null
            ? []
                .concat(ef.element)
                .map((e) => ELEMENT[e] || e)
                .join('/')
            : '';
        const tyStr =
          ef.weapon != null
            ? []
                .concat(ef.weapon)
                .map((t) => WEAPON[t] || t)
                .join('/')
            : '';
        const parts = [elStr, tyStr].filter(Boolean);
        const lim = parts.join('·');
        // 直读 master range / element / weapon / weapon_base_id (adapter 已不再注入 eff.scope)
        if (ef.weapon_base_id) {
          return '<span class="scope-tag scope-lim">キャラ限</span>';
        }
        if (ef.element != null || ef.weapon != null) {
          return '<span class="scope-tag scope-lim">' + (lim || '限') + '</span>';
        }
        if (ef.range === 'All') return '<span class="scope-tag scope-all">全</span>';
        return '<span class="scope-tag scope-self">自</span>';
      };
      export const renderEfRow = (ef) => {
        const btags = _efBadges(ef);
        const cond = ef.condition
          ? `<span class="cond-tag cond-${ef.condition}">${CONDITION[ef.condition]}</span>`
          : '';
        return `<div class="eftags">${btags}<span class="tag-val">${fmtVal(ef)}</span>${fmtScopeTag(ef)}${cond}</div>`;
      };
      // _resolveCharaSkills / _resolveSoulSkills import 自 stats-calc.js。
      export const renderSkillsPanel = (skills) => {
        if (!skills?.length) return '';
        const rows = skills
          .map((sk) => {
            const efrows = (sk.effects || [])
              .filter((ef) => !(ef.bunrui || []).includes(16))
              .map(renderEfRow)
              .join('');
            if (!efrows) return '';
            return `<div class="skill-item">${efrows}</div>`;
          })
          .filter(Boolean)
          .join('');
        return rows ? '<div class="skills-panel">' + rows + '</div>' : '';
      };
      export const renderBgPanel = (bg) => {
        if (!bg) return '';
        return `<div class="skills-panel"><div class="skill-item"><div class="skill-eftxt">${escHtml(bg.effect_text || '')}</div>${(bg.effects || []).map(renderEfRow).join('')}</div></div>`;
      };
      export const renderMasouPanel = (m) => {
        if (!m) return '';
        // masou.effects 是 master shape ({parameter, math_type, value, value_scaling, effect_text})、
        // renderEfRow 期待 wiki shape — inline 转换 (masou 无 element/weapon/range 限定、固定自身)
        const rows = (m.effects || [])
          .map((e) => {
            if (!e || e.parameter === 'NoEffect') return '';
            const ef = {
              _parameter: e.parameter,
              bairitu: e.value,
              bairitu_scaling: e.value_scaling || 0,
              calc_type: e.math_type === 'Addition' ? 1 : 0,
              condition: 0,
            };
            const txt = e.effect_text ? `<div class="skill-eftxt">${escHtml(e.effect_text)}</div>` : '';
            return `<div class="skill-item">${txt}${renderEfRow(ef)}</div>`;
          })
          .filter(Boolean)
          .join('');
        return rows ? `<div class="skills-panel">${rows}</div>` : '';
      };
      // crystal effect 倍率: crystalEffectiveValue(cr, cfg) (cfg.lv 在 initial → max 线性插值)。
      export const renderCrystalEffList = (cfgs) => {
        // cfgs: [{id, weight, purity}, ...] or null。weight/purity 衰减後 effective bairitu を表示。
        const items = (cfgs || [])
          .filter(Boolean)
          .map((cfg) => {
            const cr = allCrystals.find((x) => x.id === cfg.id);
            return cr ? { cr, cfg } : null;
          })
          .filter(Boolean);
        if (!items.length) return '';
        return (
          '<div class="cr-eff-list">' +
          items
            .map(({ cr, cfg }) => {
              const tags = (cr.effects || [])
                .map((ef) => {
                  const btags = _efBadges(ef);
                  const eff = _crystalEffectiveBairitu(cr, cfg, ef);
                  const val = (ef.calc_type === 1 ? _addP(eff) : 'x') + fmtLarge(eff, 3);
                  return btags + `<span class="tag-val">${val}</span>`;
                })
                .join(' ');
              return `<div class="cr-eff-row"><span class="cr-eff-name" title="${escHtml(cr.name)}">${escHtml(cr.name)}</span><div class="cr-eff-tags">${tags}</div></div>`;
            })
            .join('') +
          '</div>'
        );
      };

      // ===== TEAM =====
      export const autoAssignSoul = (si) => {
        const used = new Set(
          team
            .filter((_, i) => i !== si)
            .map((s) => s.soul)
            .filter(Boolean),
        );
        const byId = [...allSouls].sort((a, b) => a.id - b.id);
        const found = byId.find((s) => !used.has(s.id));
        team[si].soul = found ? found.id : null;
        _clampSoulTr(si);
      };
      // 把 tr.soul_lv / tr.soul_awakening 夹紧到当前 soul 的 cap（rarity 决定）
      export const _clampSoulTr = (si) => {
        const soul = allSouls.find((x) => x.id === team[si].soul);
        if (!soul) return;
        const awMax = soulAwkMax(soul);
        if (team[si].tr.soul_awakening > awMax) team[si].tr.soul_awakening = awMax;
        const cap = soulLvCap(soul, team[si].tr.soul_awakening);
        if (team[si].tr.soul_lv > cap) team[si].tr.soul_lv = cap;
      };
      export const syncCrystals = (si) => {
        const c = allCharas.find((x) => x.id === team[si].chara);
        // slice が秘録記憶本体を外すと結晶枠も -1 (連鎖) → 固定点まで再計算
        let n = crystalSlotCount(c, si);
        while (team[si].crystals.length > n) {
          team[si].crystals = team[si].crystals.slice(0, n);
          n = crystalSlotCount(c, si);
        }
        const cur = team[si].crystals;
        if (cur.length < n) team[si].crystals = [...cur, ...Array(n - cur.length).fill(null)];
      };
      export const setTeamSize = (n) => {
        teamSize = n;
        document
          .querySelectorAll('.size-btn')
          .forEach((b) => b.classList.toggle('on', +b.dataset.n === n));
        for (let i = 0; i < 3; i++)
          document.getElementById('slot-' + i).classList.toggle('disabled', i >= n);
        if (isMob() && mobileActiveSlot >= n) {
          mobileActiveSlot = n - 1;
          updateMobVisible();
        } else if (isMob()) updateMobIndicator();
        refreshAllStats();
      };

      // ===== 編成 export / import (.json 文件 + 分享码 + URL #hash、deflate-raw 压缩) =====
      // 紧凑对象: 省略 tr/enemy 默认值 + 空 slot/crystals (import 时 merge 默认补回)。
      const _ENEMY_DEF = { element: 6, bk: false, mode: 'normal', bkResistance: 'normal', difficulty: 'Normal', guildTitle: null, bd_cap: 0 };
      const _DEF_EMBLEMS = [{ id: 1, level: 25 }, { id: 4, level: 40 }, { id: 16, level: 55 }, { id: 17, level: 55 }];
      const _DEF_EMBLEMS_STR = JSON.stringify(_DEF_EMBLEMS);
      const _henseiCompact = () => {
        const def = mkTr();
        const ctr = (tr) => {
          const o = {};
          for (const k in def) {
            if (k === 'omoide_picks') continue;
            if (tr[k] !== def[k] && tr[k] !== undefined) o[k] = tr[k];
          }
          if (tr.omoide_picks && Object.keys(tr.omoide_picks).length) o.omoide_picks = tr.omoide_picks;
          return o;
        };
        const cslot = (s) => {
          const o = {};
          for (const k of ['chara', 'soul', 'bg', 'masou']) if (s[k] != null) o[k] = s[k];
          const cr = (s.crystals || [])
            .filter((c) => c && c.id != null) // 过滤未填的结晶槽 (null)
            .map((c) => ({ id: c.id, lv: c.lv, weight: c.weight, purity: c.purity }));
          if (cr.length) o.crystals = cr;
          const t = ctr(s.tr || {});
          if (Object.keys(t).length) o.tr = t;
          return o;
        };
        const ce = () => {
          const o = {};
          for (const k in _ENEMY_DEF) if (enemy[k] !== _ENEMY_DEF[k]) o[k] = enemy[k];
          // emblems: 保留 4 槽位置 (filter 会丢位置)、与默认相同则省略
          const emb = [0, 1, 2, 3].map((i) => {
            const e = (enemy.emblems || [])[i];
            return e && e.id != null ? { id: e.id, level: e.level } : { id: null, level: 1 };
          });
          if (JSON.stringify(emb) !== _DEF_EMBLEMS_STR) o.emblems = emb;
          const aw = [...(enemy.advantageWeapons || [])];
          if (aw.length) o.advantageWeapons = aw;
          return o;
        };
        return { v: 1, teamSize, team: team.map(cslot), enemy: ce() };
      };

      // 把配置(紧凑或全量)灌回 team/enemy 并重渲染。缺失/失效 id 跳过、tr/enemy 缺省补默认值。
      const _applyHenseiConfig = (data) => {
        if (!data || !Array.isArray(data.team)) throw new Error('invalid format (no team)');
        const validId = (arr, id) => (id != null && Array.isArray(arr) && arr.some((x) => x.id === id) ? id : null);
        for (let i = 0; i < 3; i++) {
          const s = data.team[i] || {};
          team[i].chara = validId(allCharas, s.chara);
          team[i].soul = validId(allSouls, s.soul);
          team[i].bg = validId(allBGs, s.bg);
          team[i].masou = validId(allMasou, s.masou);
          team[i].crystals = Array.isArray(s.crystals)
            ? s.crystals
                .filter((c) => c && c.id != null && allCrystals.some((x) => x.id === c.id))
                .map((c) => ({ id: c.id, lv: c.lv ?? 1, weight: c.weight ?? 0, purity: c.purity ?? 0 }))
            : [];
          team[i].tr = { ...mkTr(), ...(s.tr || {}) };
          if (s.tr?.have_mp === false) team[i].tr.mp = 0; // 旧 #hash 兼容: have_mp=false → MP 空
        }
        // enemy 先重置默认 (紧凑对象省略默认字段、不重置会残留上一份的非默认值)
        Object.assign(enemy, _ENEMY_DEF, { emblems: _DEF_EMBLEMS.map((e) => ({ ...e })), advantageWeapons: new Set() });
        if (data.enemy && typeof data.enemy === 'object') {
          const { advantageWeapons, emblems, ...rest } = data.enemy;
          Object.assign(enemy, rest);
          enemy.advantageWeapons = new Set(Array.isArray(advantageWeapons) ? advantageWeapons : []);
          // emblems: 仅当带了才覆盖 (省略=默认、保留上面 reset 的默认);归一 4 槽 + 校验 id (失效置 null)
          if (Array.isArray(emblems)) {
            enemy.emblems = [0, 1, 2, 3].map((i) => {
              const e = emblems[i] || {};
              const id = e.id != null && allGuildEmblems.some((g) => g.id === e.id) ? e.id : null;
              return { id, level: Math.max(1, Math.floor(+e.level) || 1) };
            });
          }
          // guildTitle 校验 (失效置 null)
          if (enemy.guildTitle != null && !allGuildTitles.some((g) => g.id === enemy.guildTitle)) enemy.guildTitle = null;
        }
        renderEnemyBar();
        renderAll();
        setTeamSize([1, 2, 3].includes(data.teamSize) ? data.teamSize : 3); // 含 refreshAllStats
        updateMobVisible();
        // import 后触发 omoide 懒加载 (autoEquip=false: 保留导入的 omoide_picks);fetch 完成后 re-render 显示好感
        for (let i = 0; i < 3; i++) if (team[i].chara != null) _ensureOmoideLoaded(team[i].chara, false);
      };

      // ---- 压缩编码: deflate-raw + base64url (原生 CompressionStream、无依赖;无则退回纯 base64url) ----
      const _b64 = (bytes) => { let s = ''; for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]); return btoa(s); };
      const _toUrl = (b) => b.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      const _fromUrl = (s) => s.replace(/-/g, '+').replace(/_/g, '/');
      const _bytes = (b64) => { const bin = atob(b64); const a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; };
      // pipeThrough 模式: 自动处理背压 (手动 writer.write/close 在浏览器会死锁)
      const _deflate = async (str) => {
        if (typeof CompressionStream === 'undefined') return null;
        const s = new Blob([str]).stream().pipeThrough(new CompressionStream('deflate-raw'));
        return new Uint8Array(await new Response(s).arrayBuffer());
      };
      const _inflate = async (bytes) => {
        const s = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
        return await new Response(s).text();
      };
      const _encodeHensei = async () => {
        const json = JSON.stringify(_henseiCompact());
        const z = await _deflate(json);
        if (z) return 'bxb1:' + _toUrl(_b64(z));                            // 压缩
        return 'bxb0:' + _toUrl(btoa(unescape(encodeURIComponent(json))));  // fallback 纯 base64url(utf8)
      };
      const _decodeHensei = async (str) => {
        str = (str || '').trim();
        if (str.startsWith('bxb1:')) return JSON.parse(await _inflate(_bytes(_fromUrl(str.slice(5)))));
        if (str.startsWith('bxb0:')) return JSON.parse(decodeURIComponent(escape(atob(_fromUrl(str.slice(5))))));
        return JSON.parse(str); // 容错: 直接粘 JSON
      };

      const _ioMsg = (m) => { const el = document.getElementById('io-msg'); if (el) el.textContent = m || ''; };
      export const closeIoModal = () => document.getElementById('io-modal')?.classList.remove('open');
      export const openIoModal = async () => {
        document.getElementById('io-modal')?.classList.add('open');
        const imp = document.getElementById('io-import-str'); if (imp) imp.value = '';
        _ioMsg('');
        const ta = document.getElementById('io-export-str');
        if (ta) {
          ta.value = 'generating...';
          try { ta.value = await _encodeHensei(); }
          catch (e) { ta.value = ''; _ioMsg('encode failed: ' + e.message); }
        }
      };
      export const copyIoString = async () => {
        const s = document.getElementById('io-export-str')?.value || '';
        try { await navigator.clipboard.writeText(s); _ioMsg('code copied ✓'); }
        catch { _ioMsg('copy failed — select the text above manually'); }
      };
      // copy url: POST #hash 到短链 API、拿 key 拼成 …#s:<key> 复制。失败仅提示 (用户可改用 copy code)
      export const copyIoUrl = async () => {
        _ioMsg('shortening…');
        let code = (document.getElementById('io-export-str')?.value || '').trim();
        if (!/^bxb[01]:/.test(code)) {
          try { code = await _encodeHensei(); }
          catch (e) { _ioMsg('encode failed: ' + e.message); return; }
        }
        try {
          const res = await fetch(_shareEndpoint(), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ hash: code }),
          });
          const json = await res.json().catch(() => ({}));
          if (!res.ok || !json.key) throw new Error(json.error || 'HTTP ' + res.status);
          const url = location.origin + location.pathname + '#s:' + json.key;
          try { await navigator.clipboard.writeText(url); _ioMsg('short url copied ✓'); }
          catch { document.getElementById('io-export-str').value = url; _ioMsg('copy failed — select the url above manually'); }
        } catch (e) {
          _ioMsg('short link failed: ' + e.message);
        }
      };
      export const ioDownloadJson = () => {
        try {
          const blob = new Blob([JSON.stringify(_henseiCompact(), null, 1)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `bxb-hensei-${new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-')}.json`;
          document.body.appendChild(a); a.click(); a.remove();
          URL.revokeObjectURL(url);
          _ioMsg('.json saved ✓');
        } catch (e) { _ioMsg('export failed: ' + e.message); }
      };
      export const ioImportString = async () => {
        const s = (document.getElementById('io-import-str')?.value || '').trim();
        if (!s) { _ioMsg('paste a code first'); return; }
        try { _applyHenseiConfig(await _decodeHensei(s)); _ioMsg('loaded ✓'); setTimeout(closeIoModal, 500); }
        catch (e) { _ioMsg('load failed: ' + e.message); }
      };
      export const triggerImportHensei = () => document.getElementById('hensei-import-file')?.click();
      export const importHenseiFile = (input) => {
        const file = input?.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try { _applyHenseiConfig(JSON.parse(reader.result)); _ioMsg('loaded ✓'); closeIoModal(); }
          catch (e) { _ioMsg('load failed: ' + e.message); }
          input.value = '';
        };
        reader.readAsText(file);
      };

      export const _maxOmoideThreshold = (c) => {
        // omoide 在 chara._omoide_slots[].affection_threshold (Frida 抓包 lazy fetch)
        const slots = c?._omoide_slots;
        if (!Array.isArray(slots) || !slots.length) return 0;
        return slots.reduce((m, s) => Math.max(m, +s.affection_threshold || 0), 0);
      };

      // 已装备好感数 = 仅算「好感度已解锁 (affection_threshold ≤ affinity)」的 pick。
      // 锁定槽 (好感不足) 不计、跟 stats-calc 的 gate + 模态显示一致。
      // (import 的 #hash 可能带高于当前好感的 picks → 不该算/显示成已装备)
      const _omoideEquippedCount = (chara, tr) => {
        const picks = tr?.omoide_picks || {};
        const aff = +tr?.affinity || 0;
        const slots = chara?._omoide_slots || [];
        return Object.keys(picks).filter(
          (k) => picks[k] != null && slots[+k] && (+slots[+k].affection_threshold || 0) <= aff,
        ).length;
      };

      // omoide data lazy fetch: 注入 chara._omoide_slots、完成后 re-render 用到该 chara 的 slot。
      //   omoide json 按 base_id 4 位命名 (data/omoide/1001.json)、chara.id 是 variant_id 6 位 → 取 _master.id。
      //   autoEquip=true: fetch 后自动「攻撃優先」全装備 (setChara 换魔剣时)。
      //   autoEquip=false: 仅 re-render (import 时、保留导入的 omoide_picks)。
      const _ensureOmoideLoaded = (id, autoEquip) => {
        const c = allCharas.find((x) => x.id === id);
        if (!c || c._omoide_loaded) return;
        c._omoide_loaded = true;
        c._omoide_slots = [];
        const baseId = c._master?.id ?? Math.floor(id / 100);
        fetch(`../data/omoide/${baseId}.json`)
          .then((r) => (r.ok ? r.json() : null))
          .then((data) => {
            if (data?.slots) c._omoide_slots = data.slots.map((s) => s.memory_slot).filter(Boolean);
            if (team.some((s) => s.chara === id)) {
              team.forEach((slot, slotIdx) => {
                if (slot.chara === id) {
                  renderSlot(slotIdx);
                  if (autoEquip) { try { equipAllOmoide(slotIdx); } catch (_) {} }
                }
              });
              refreshAllStats();
            }
          })
          .catch(() => {});
      };

      export const setChara = (si, id) => {
        // 清空 chara：只清魔剣 + 結晶 + 魔装；魂 / 心象結晶 保留
        if (id === null) {
          team[si].chara = null;
          team[si].crystals = [];
          team[si].masou = null;
          renderSlot(si);
          refreshAllStats();
          return;
        }
        const other = team.findIndex((s, i) => i !== si && s.chara === id);
        if (other >= 0) {
          // swap entire slot — chara/soul/bg/masou/crystals/tr all move together（保留交换语义）
          [team[si], team[other]] = [team[other], team[si]];
          renderSlot(other);
        } else {
          // 更换魔剣（非 swap）：清空結晶 + 魔装（魔装是 chara 限定），魂 / 心象結晶不动
          team[si].chara = id;
          team[si].masou = null;
          const c = allCharas.find((x) => x.id === id);
          // omoide data lazy fetch (注入 _omoide_slots → re-render + 自動「攻撃優先」全装備)
          _ensureOmoideLoaded(id, true);
          // 换魔剣 → 整条练度 tr 重置到默认 (HP/MP/BD ON/BD条数/結婚/燃心/LP 全归零、不带上个魔剣的值);
          // 仅保留 soul 进度 (soul_lv/soul_awakening)、因 soul 不随魔剣换。再叠魔剣特定初始值。
          const _keepSoulLv = team[si].tr.soul_lv;
          const _keepSoulAwk = team[si].tr.soul_awakening;
          team[si].tr = mkTr();
          team[si].tr.soul_lv = _keepSoulLv;
          team[si].tr.soul_awakening = _keepSoulAwk;
          // 默认 affinity = 90000 (最大、解锁全部 omoide slot)
          team[si].tr.affinity = 90000;
          // 默认最高 state（極弐>改造>通常）；SS(r=4) 特例 jukudo 38/level 255、其他 = state max (awakening 已由 mkTr 置 0)
          if (c) {
            const r = c.rarity;
            const newState = ['極弐', '改造', '通常'].find((s) => c.states?.[s]) || '通常';
            team[si].tr.state = newState;
            if (r === 4) {
              team[si].tr.jukudo = 38;
              team[si].tr.level = 255;
            } else {
              team[si].tr.jukudo = JUKUDO_MAX_TBL[r]?.[newState] || 1;
              team[si].tr.level = LEVEL_MAX_TBL[r]?.[newState] || 1;
            }
          }
          if (!team[si].soul) autoAssignSoul(si);
          team[si].crystals = [];
          syncCrystals(si);
          equipAllOmoide(si);
        }
        renderSlot(si);
        resetBdCapToInitial();   // chara 变 → 重置 bd_cap 为初始值 (BlazeGauge skill 算)
        refreshAllStats();
      };
      // 换 soul 时把 tr.soul_lv / tr.soul_awakening 重置：觉醒=0、lv=该觉醒下的 max（不保留上一只魂的进度）
      const _resetSoulTr = (si) => {
        team[si].tr.soul_awakening = 0;
        const s = allSouls.find((x) => x.id === team[si].soul);
        team[si].tr.soul_lv = s ? soulLvCap(s, 0) : 1;
      };
      export const setSoul = (si, id) => {
        if (id === null) {
          team[si].soul = null;
          renderSlot(si);
          refreshAllStats();
          return;
        }
        const other = team.findIndex((s, i) => i !== si && s.soul === id);
        if (other >= 0) {
          [team[si].soul, team[other].soul] = [team[other].soul, team[si].soul];
          _resetSoulTr(other);
          _resetSoulTr(si);
          renderSlot(other);
        } else {
          team[si].soul = id;
          _resetSoulTr(si);
        }
        _clampSoulTr(si);
        renderSlot(si);
        // 不重置 bd_cap: 换 soul 不该把用户手设的 BDゲージ上限拍回 initial (initialBlazeGauge 来自 chara skill、非 soul)。
        // refreshAllStats → refreshBdCapMax 已处理「soul 改了 bdCapMax (BlazeGaugeMaxLevel)」时的 max 更新 + 必要下钳。
        refreshAllStats();
      };
      export const setBG = (si, id) => {
        if (id === null) {
          team[si].bg = null;
          renderSlot(si);
          refreshAllStats();
          return;
        }
        const other = team.findIndex((s, i) => i !== si && s.bg === id);
        if (other >= 0) {
          [team[si].bg, team[other].bg] = [team[other].bg, team[si].bg];
          renderSlot(other);
        } else team[si].bg = id;
        renderSlot(si);
        refreshAllStats();
      };
      export const setCrystal = (si, ci, id) => {
        if (id == null) {
          team[si].crystals[ci] = null;
        } else {
          const cr = allCrystals.find((x) => x.id === id);
          const m = cr?._master || {};
          team[si].crystals[ci] = {
            id,
            weight: m.max_weight ?? 100,
            purity: m.max_purity ?? 100,
            lv: cryLvMax(cr),
          };
        }
        // 秘録記憶 着脱で結晶枠が ±1 しうる
        syncCrystals(si);
        renderSlot(si);
        refreshAllStats();
      };
      // 玩家在 hensei 槽位上调结晶 weight/purity/lv
      // Phase 7 Session 2: weight/purity 用 master M_W_max/M_P_max 字段判定 + min_/max_ revise 范围
      //   weight: clamp min_weight..max_weight, 缺省 100 (跟 master 默认值)
      //   purity: clamp min_purity..max_purity, 缺省 100
      //   lv:     clamp 1..cryLvMax, 整数
      export const setCrystalDim = (si, ci, dim, val) => {
        const cfg = team[si].crystals[ci];
        if (!cfg) return;
        const n = +val;
        if (!Number.isFinite(n)) return;
        const cr = allCrystals.find((x) => x.id === cfg.id);
        const m = cr?._master || {};
        if (dim === 'lv') {
          const maxLv = cryLvMax(cr);
          cfg.lv = Math.max(1, Math.min(maxLv, Math.round(n)));
        } else if (dim === 'weight') {
          const wMin = m.min_weight ?? 0;
          const wMax = m.max_weight ?? 100;
          cfg.weight = Math.max(wMin, Math.min(wMax, n));
        } else if (dim === 'purity') {
          const pMin = m.min_purity ?? 0;
          const pMax = m.max_purity ?? 100;
          cfg.purity = Math.max(pMin, Math.min(pMax, n));
        }
        const col = document.getElementById('col' + si + 'r');
        if (col) col.innerHTML = renderCrystalEffList(team[si].crystals);
        // popover name 右侧实时倍率跟 slider 联动
        const bEl = document.getElementById('pop-bairitu-' + si + '-' + ci);
        if (bEl && cr) bEl.textContent = _crBairituStr(cr, cfg);
        refreshAllStats();
      };

      // ===== 結晶 重量/純度 popover（⚙ 触发，浮在 slot-card 正上方）=====
      let _crystalPopEl = null;
      let _crystalPopHandler = null;
      // row 排版：[label][slider][number][unit]、slider/number 双向同步、都触发 setCrystalDim
      const _popRow = (si, ci, kind, opts) => {
        const { label, min, max, step, value, unit, oninp } = opts;
        return `<div class="pop-row" data-kind="${kind}">
    <label>${label}</label>
    <input type="range"   min="${min}" max="${max}" step="${step}" value="${value}" oninput="this.parentNode.querySelector('input[type=number]').value=this.value;${oninp}">
    <input type="number" min="${min}" max="${max}" step="${step}" value="${value}" oninput="this.parentNode.querySelector('input[type=range]').value=this.value;${oninp}">
    <span class="pop-unit">${unit}</span>
  </div>`;
      };
      export const openCrystalDimPopover = (si, ci, btnEl) => {
        closeCrystalDimPopover();
        const cfg = team[si]?.crystals?.[ci];
        if (!cfg) return;
        const cr = allCrystals.find((x) => x.id === cfg.id);
        if (!cr) return;
        const m = cr._master || {};
        const desc = m.description || cr.description || '';
        const { hasW, hasP, hasLv } = crystalDimAvailability(cr);
        const maxLv = cryLvMax(cr);
        // 无滑条也开 popover (至少看 name + description);name 下、滑条上插 description
        const minW = m.min_weight ?? 0;
        const maxW = m.max_weight ?? 100;
        const minP = m.min_purity ?? 0;
        const maxP = m.max_purity ?? 100;
        const wRow = hasW
          ? _popRow(si, ci, 'weight', {
              label: '重',
              min: minW,
              max: maxW,
              step: crystalSliderStep(m, 'weight'),
              value: cfg.weight ?? maxW,
              unit: 'g',
              oninp: `setCrystalDim(${si},${ci},'weight',this.value)`,
            })
          : '';
        const pRow = hasP
          ? _popRow(si, ci, 'purity', {
              label: '純',
              min: minP,
              max: maxP,
              step: crystalSliderStep(m, 'purity'),
              value: cfg.purity ?? maxP,
              unit: '%',
              oninp: `setCrystalDim(${si},${ci},'purity',this.value)`,
            })
          : '';
        const lvRow = hasLv
          ? _popRow(si, ci, 'lv', {
              label: 'Lv',
              min: 1,
              max: maxLv,
              step: 1,
              value: cfg.lv ?? maxLv,
              unit: '',
              oninp: `setCrystalDim(${si},${ci},'lv',this.value)`,
            })
          : '';
        const pop = document.createElement('div');
        pop.className = 'crystal-dim-popover';
        pop.innerHTML = `
    <div class="pop-title">${escHtml(cr.name)} <span id="pop-bairitu-${si}-${ci}" class="pop-bairitu">${_crBairituStr(cr, cfg)}</span></div>
    ${desc ? `<div class="pop-desc">${escHtml(desc)}</div>` : ''}
    ${wRow}${pRow}${lvRow}
    <div class="pop-actions">
      <button onclick="resetCrystalDim(${si},${ci})">リセット</button>
      <button onclick="closeCrystalDimPopover()">×</button>
    </div>`;
        document.body.appendChild(pop);
        _crystalPopEl = pop;
        // 定位：「整个結晶 section 的正上方」— anchor 用 ⚙ 所在的 .equip-section（記憶結晶 那一块）；
        // 箭头横向指向 ⚙ 自身。
        const card = btnEl?.closest('.equip-section');
        const cardRect = card ? card.getBoundingClientRect() : btnEl.getBoundingClientRect();
        const btnRect = btnEl.getBoundingClientRect();
        const popW = pop.offsetWidth;
        const popH = pop.offsetHeight;
        // 横向：以 slot-card 中心为基准；防溢出
        let left = cardRect.left + cardRect.width / 2 - popW / 2 + window.scrollX;
        const margin = 8;
        if (left < margin) left = margin;
        if (left + popW > window.innerWidth - margin) left = window.innerWidth - margin - popW;
        pop.style.left = left + 'px';
        // 纵向：卡片**上方**（pop 底边离卡片顶部 12px），箭头朝下指向 ⚙
        pop.style.top = cardRect.top - popH - 12 + window.scrollY + 'px';
        // 箭头 x：指向 ⚙ 按钮中心（不是卡片中心，更明确指向触发点）
        const arrowX = btnRect.left + btnRect.width / 2 - left + window.scrollX;
        pop.style.setProperty('--arrow-x', Math.max(12, Math.min(popW - 12, arrowX)) + 'px');
        setTimeout(() => {
          _crystalPopHandler = (e) => {
            if (!pop.contains(e.target) && e.target !== btnEl) closeCrystalDimPopover();
          };
          document.addEventListener('click', _crystalPopHandler);
        }, 0);
      };
      export const closeCrystalDimPopover = () => {
        if (_crystalPopEl) {
          _crystalPopEl.remove();
          _crystalPopEl = null;
        }
        if (_crystalPopHandler) {
          document.removeEventListener('click', _crystalPopHandler);
          _crystalPopHandler = null;
        }
      };
      export const resetCrystalDim = (si, ci) => {
        const cfg = team[si]?.crystals?.[ci];
        if (!cfg) return;
        const cr = allCrystals.find((x) => x.id === cfg.id);
        const m = cr?._master || {};
        cfg.weight = m.max_weight ?? 100;
        cfg.purity = m.max_purity ?? 100;
        cfg.lv = cryLvMax(cr);
        const col = document.getElementById('col' + si + 'r');
        if (col) col.innerHTML = renderCrystalEffList(team[si].crystals);
        refreshAllStats();
        // popover 内 slider/number 也同步重置到各自的 max
        if (_crystalPopEl) {
          _crystalPopEl.querySelectorAll('.pop-row').forEach((row) => {
            const kind = row.getAttribute('data-kind');
            const resetVal = kind === 'lv' ? maxLv : 100;
            row.querySelectorAll('input').forEach((inp) => {
              inp.value = resetVal;
            });
          });
        }
      };
      export const setMasou = (si, id) => {
        team[si].masou = id;
        renderSlot(si);
        refreshAllStats();
      };
      export const clearSlot = (si) => {
        team[si] = { chara: null, soul: null, bg: null, masou: null, crystals: [], tr: mkTr() };
        renderSlot(si);
        refreshAllStats();
      };

      export const setTrField = (si, key, val) => {
        team[si].tr[key] = val;
        // state / marriage 変化时 → 結晶スロット数が変わる可能性あり
        if (key === 'marriage' || key === 'state') syncCrystals(si);
        renderSlot(si);
        refreshAllStats();
      };
      // BD 条数 (value + additional_value × 条数;0..bdCapMax、默认 bd_skill.cost)
      export const setBdCount = (si, val) => {
        const cap = Math.floor(_lastTrace[si]?.bdCapMax ?? 9);
        const v = Math.max(0, Math.min(cap, Math.floor(+val || 0)));
        team[si].tr.bd_count = v;
        const inp = document.getElementById('bdcnt-' + si);
        if (inp) inp.value = v;
        refreshAllStats();
      };
      export const setJukudoSlider = (si, val) => {
        const sl = document.getElementById('tr-jkslider-' + si);
        const max = sl ? +sl.max : 99;
        const inp = document.getElementById('tr-jkinput-' + si);
        if (inp) inp.value = val;
        setTrNum(si, 'jukudo', val, max);
      };
      export const setAwakeningSlider = (si, val) => {
        const sl = document.getElementById('tr-awslider-' + si);
        const max = sl ? +sl.max : 99;
        const inp = document.getElementById('tr-awinput-' + si);
        if (inp) inp.value = val;
        setTrNum(si, 'awakening', val, max);
      };
      export const setTrNum = (si, key, val, max) => {
        const minVal = key === 'jukudo' ? 1 : 0;
        team[si].tr[key] = Math.min(max, Math.max(minVal, +val || minVal));
        if (key === 'jukudo') {
          const jksl = document.getElementById('tr-jkslider-' + si);
          if (jksl) jksl.value = team[si].tr[key];
        }
        if (key === 'awakening') {
          const awsl = document.getElementById('tr-awslider-' + si);
          if (awsl) awsl.value = team[si].tr[key];
        }
        const c = allCharas.find((x) => x.id === team[si].chara);
        if (!c) {
          refreshAllStats();
          return;
        }
        const r = c.rarity,
          tr = team[si].tr;
        const lev1 = LEVEL_1JUK_TBL[r]?.[tr.state],
          levMax = LEVEL_MAX_TBL[r]?.[tr.state];
        if (lev1 == null || levMax == null) {
          refreshAllStats();
          return;
        }
        const jk = Math.min(tr.jukudo, JUKUDO_MAX_TBL[r]?.[tr.state] ?? 0);
        const base = jk === 0 ? lev1 - 5 : Math.min(levMax, lev1 + (jk - 1) * 5);
        const newCap = base + tr.awakening * 5;
        const slider = document.getElementById('tr-lvslider-' + si);
        if (slider) {
          slider.max = newCap;
          if (tr.level > newCap) {
            tr.level = newCap;
            slider.value = newCap;
          }
          const lvval = document.getElementById('tr-lvval-' + si);
          if (lvval) {
            lvval.max = newCap;
            lvval.value = slider.value;
          }
          const lvcapslider = document.getElementById('tr-lvcapslider-' + si);
          if (lvcapslider) lvcapslider.textContent = ' / ' + newCap;
        }
        refreshAllStats();
      };
      export const setLevel = (si, val) => {
        team[si].tr.level = +val;
        const el = document.getElementById('tr-lvval-' + si);
        if (el) el.value = val;
        refreshAllStats();
      };
      export const setLevelInput = (si, val) => {
        const sl = document.getElementById('tr-lvslider-' + si);
        const max = sl ? +sl.max : 999;
        const v = Math.min(max, Math.max(1, +val || 1));
        team[si].tr.level = v;
        const inp = document.getElementById('tr-lvval-' + si);
        if (inp) inp.value = v;
        if (sl) sl.value = v;
        refreshAllStats();
      };
      export const setHpSlider = (si, val) => {
        const v = Math.min(100, Math.max(0, +val || 0));
        team[si].tr.hp = v;
        const inp = document.getElementById('tr-hpinput-' + si);
        if (inp) inp.value = v;
        refreshAllStats();
      };
      export const setHpInput = (si, val) => {
        let v = +val;
        if (isNaN(v)) v = 100;
        v = Math.min(100, Math.max(0, Math.round(v * 100) / 100));   // 支持 2 位小数、超出自动 round
        team[si].tr.hp = v;
        const inp = document.getElementById('tr-hpinput-' + si);
        if (inp) inp.value = v;
        const sl = document.getElementById('tr-hpslider-' + si);
        if (sl) sl.value = Math.round(v);
        refreshAllStats();
      };
      const _mpMaxOf = (si) => Math.floor(+allCharas.find((x) => x.id === team[si].chara)?._master?.mp || 0);
      export const setMpSlider = (si, val) => {
        const v = Math.max(0, Math.min(_mpMaxOf(si), Math.round(+val) || 0));
        team[si].tr.mp = v;
        const inp = document.getElementById('tr-mpinput-' + si);
        if (inp) inp.value = v;
        refreshAllStats();
      };
      export const setMpInput = (si, val) => {
        const max = _mpMaxOf(si);
        let v = +val;
        if (isNaN(v)) v = max;
        v = Math.max(0, Math.min(max, Math.round(v)));
        team[si].tr.mp = v;
        const inp = document.getElementById('tr-mpinput-' + si);
        if (inp) inp.value = v;
        const sl = document.getElementById('tr-mpslider-' + si);
        if (sl) sl.value = v;
        refreshAllStats();
      };
      export const setAffinity = (si, val) => {
        let v = +val;
        if (isNaN(v)) v = 0;
        v = Math.max(0, Math.floor(v));
        team[si].tr.affinity = v;
        // 同步槽位级 input + omoide modal 的 input（双向同步）
        const slotInp = document.getElementById('aff-input-slot-' + si);
        if (slotInp && +slotInp.value !== v) slotInp.value = v;
        if (omoideModalSlot === si) _renderOmoideModalBody();
        _refreshOmoideCountLabel(si);   // 好感变 → 重算「已解锁(threshold ≤ aff)且已选」的装备数 (否则 40/40 不动)
        refreshAllStats();
      };

      // ====== 魂等级 / 觉醒 setter（与槽位 UI 联动） ======
      export const setSoulLv = (si, val) => {
        const soul = allSouls.find((x) => x.id === team[si].soul);
        if (!soul) return;
        const cap = soulLvCap(soul, team[si].tr.soul_awakening);
        const v = Math.max(1, Math.min(cap, Math.floor(+val) || 1));
        team[si].tr.soul_lv = v;
        const sl = document.getElementById('soul-lv-slider-' + si);
        if (sl) sl.value = v;
        const inp = document.getElementById('soul-lv-input-' + si);
        if (inp) inp.value = v;
        refreshAllStats();
      };
      export const setSoulAwk = (si, val) => {
        const soul = allSouls.find((x) => x.id === team[si].soul);
        if (!soul) return;
        const max = soulAwkMax(soul);
        const v = Math.max(0, Math.min(max, Math.floor(+val) || 0));
        team[si].tr.soul_awakening = v;
        // surgical 更新：触らないと oninput 中に DOM が outerHTML 置換されて drag が中断する。
        const awSl = document.getElementById('soul-aw-slider-' + si);
        if (awSl) awSl.value = v;
        const awInp = document.getElementById('soul-aw-input-' + si);
        if (awInp) awInp.value = v;
        // lv cap 連動：覚醒変化で lv max が動く → slider/input の max + value を更新
        const cap = soulLvCap(soul, v);
        if (team[si].tr.soul_lv > cap) team[si].tr.soul_lv = cap;
        const lvSl = document.getElementById('soul-lv-slider-' + si);
        const lvInp = document.getElementById('soul-lv-input-' + si);
        if (lvSl) {
          lvSl.max = cap;
          lvSl.value = team[si].tr.soul_lv;
        }
        if (lvInp) {
          lvInp.max = cap;
          lvInp.value = team[si].tr.soul_lv;
        }
        // /cap 表示の <span class="tr-max">（renderSoulTraining 内で固定値で書き出してた）も更新
        const wrap = document.getElementById('soul-tr-' + si);
        if (wrap) {
          const lvMaxSpan = wrap.querySelector('.tr-max');
          if (lvMaxSpan) lvMaxSpan.textContent = '/ ' + cap;
        }
        refreshAllStats();
      };
      export const renderSoulTraining = (i, soul) => {
        if (!soul) return '';
        const aw = team[i].tr.soul_awakening || 0;
        const awMax = soulAwkMax(soul);
        const lvCap = soulLvCap(soul, aw);
        const lv = Math.min(team[i].tr.soul_lv || 1, lvCap);
        return min`
    <div class="training-row" id="soul-tr-${i}" style="margin-top:6px;flex-wrap:nowrap">
      <span class="tr-label">Lv</span>
      <input id="soul-lv-slider-${i}" class="tr-slider" type="range" min="1" max="${lvCap}" value="${lv}" oninput="setSoulLv(${i},+this.value)">
      <input id="soul-lv-input-${i}" class="tr-lvval" type="number" min="1" max="${lvCap}" value="${lv}" onchange="setSoulLv(${i},+this.value)" style="width:26px;padding:3px 2px">

      <input id="soul-aw-input-${i}" class="tr-input" type="number" min="0" max="${awMax}" value="${aw}" onchange="setSoulAwk(${i},+this.value)">
      <span class="tr-max">/ ${awMax}</span>
    </div>`;
      };
      export const renderTraining = (i, chara) => {
        if (!chara) return '';
        const r = chara.rarity,
          tr = team[i].tr;
        const stOpts = r === 4 ? ['通常', '改造'] : ['通常', '改造', '極弐'];
        if (!stOpts.includes(tr.state)) team[i].tr.state = tr.state = '通常';
        const jMax = JUKUDO_MAX_TBL[r]?.[tr.state] ?? 0;
        const aMax = AWAKENING_MAX_TBL[r] ?? 0;
        const jk = Math.min(Math.max(1, tr.jukudo || 1), jMax),
          aw = Math.min(tr.awakening, aMax);
        const lev1 = LEVEL_1JUK_TBL[r]?.[tr.state],
          levMax = LEVEL_MAX_TBL[r]?.[tr.state];
        let lvCap = null;
        if (lev1 != null && levMax != null) {
          const base = jk === 0 ? lev1 - 5 : Math.min(levMax, lev1 + (jk - 1) * 5);
          lvCap = base + aw * 5;
        }
        const lvCapDisp = lvCap != null ? lvCap : '-';
        const lvCur = lvCap != null ? Math.min(tr.level || 1, lvCap) : 1;
        const stHtml = stOpts
          .map(
            (s) =>
              `<button class="tr-btn${s === tr.state ? ' on' : ''}" onclick="setTrField(${i},'state','${s}')">${s}</button>`,
          )
          .join('');
        const mrHtml = [
          ['未婚', 0],
          ['花なし', 1],
          ['花あり', 2],
        ]
          .map(
            ([l, v]) =>
              `<button class="tr-btn${tr.marriage === v ? ' on' : ''}" onclick="setTrField(${i},'marriage',${v})">${l}</button>`,
          )
          .join('');
        const lpHtml = [
          ['½↑', 0],
          ['½↓', 1],
          ['¼↓', 2],
          ['0', 3],
        ]
          .map(
            ([l, v]) =>
              `<button class="tr-btn${tr.lp === v ? ' on' : ''}" onclick="setTrField(${i},'lp',${v})">${l}</button>`,
          )
          .join('');
        // MP: [0, chara.mp] 滑条 (mp_ratio<0.5 时攻撃/ブレイク × rate、见 stats-calc _mpRate);mp 数据缺则不显示。独立一行、紧跟 HP
        const mpMax = Math.floor(+chara._master?.mp || 0);
        const mpCur = tr.mp != null ? tr.mp : mpMax;
        const mpRow = mpMax > 0
          ? `<div class="training-row">
        <span class="tr-label">MP</span>
        <input id="tr-mpslider-${i}" class="tr-slider" type="range" min="0" max="${mpMax}" step="1" value="${mpCur}" oninput="setMpSlider(${i},+this.value)">

      </div>`
          : '';
        // 末尾「好感 + BD」行：仅当 chara 有 omoide 或 bd_skill 时显示
        const hasOmoide = Array.isArray(chara._omoide_slots) && chara._omoide_slots.length > 0;
        const hasBd = !!(chara.bd_skill && chara.bd_skill.name);
        const equipped = _omoideEquippedCount(chara, tr);
        const total = (chara._omoide_slots || []).length;
        const aff = Math.floor(+tr.affinity || 0);
        const omoideHtml = hasOmoide
          ? min`
      <div style="display:flex;align-items:center;gap:6px">
        <span class="tr-label">好感</span>
        <input id="aff-input-slot-${i}" type="number" min="0" step="1" value="${aff}" onchange="setAffinity(${i},+this.value)" class="tr-input aff-input" style="width:48px;text-align:right">
        <span style="color:var(--text2);font-size:11px" id="om-count-${i}">(${equipped}/${total})</span>
        <button class="tr-btn" style="font-size:11px;padding:3px 8px" onclick="openOmoideModal(${i})">編集</button>
      </div>`
          : '';
        const bdCount = tr.bd_count != null ? tr.bd_count : (chara.bd_skill?.cost ?? 0);
        const bdCapMaxN = Math.floor(_lastTrace[i]?.bdCapMax ?? 9);
        const bdHtml = hasBd
          ? min`
      <div style="display:flex;align-items:center;gap:6px">
        <span class="tr-label">BD</span>
        <button class="tr-btn${tr.bd_on ? ' on' : ''}" style="min-width:38px;text-align:center" onclick="setTrField(${i},'bd_on',${!tr.bd_on})">${tr.bd_on ? 'ON' : 'OFF'}</button>
        ${tr.bd_on ? min`<input id="bdcnt-${i}" type="number" min="0" max="${bdCapMaxN}" step="1" value="${bdCount}" onchange="setBdCount(${i},+this.value)" class="tr-input" style="width:26px;text-align:right" title="BD条数 (倍率 = value + additional_value × 条数)"><span class="tr-max">/ ${bdCapMaxN}</span>` : ''}
      </div>`
          : '';
        const omoideBdRow =
          omoideHtml || bdHtml
            ? min`<div class="training-row" style="display:flex;align-items:center;gap:10px">${omoideHtml}${bdHtml}</div>`
            : '';

        return min`
    <div class="training-wrap">
      <div class="training-row" style="display:flex;align-items:center;gap:10px">
        <div style="display:flex;align-items:center;gap:6px">
          <span class="tr-label">改造</span>
          <div class="tr-btns">${stHtml}</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px">

      </div>
      <div class="training-row">

        <input id="tr-jkslider-${i}" class="tr-slider" type="range" min="1" max="${jMax}" value="${jk}" oninput="setJukudoSlider(${i},+this.value)">

          <button class="tr-btn${tr.moeshin ? ' on on-fire' : ''}" style="min-width:30px;text-align:center" onclick="setTrField(${i},'moeshin',${!tr.moeshin})">${tr.moeshin ? 'ON' : 'OFF'}</button>
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <span class="tr-label">LP</span>
